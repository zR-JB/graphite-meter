workflow: &workflow
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/ci-paths.yml'
  - '.githooks/**'
  - 'scripts/**'
  - 'mise.toml'
  - 'mise.lock'
  - 'go/go.mod'
  - 'go/go.sum'

code:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'rust/**'
  - 'legal/**'
  - 'container/**'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

go:
  - *workflow
  - 'api/**'
  - 'go/**'
  - 'client/src/app.css'

deps:
  - *workflow
  - 'go/**'
  - 'client/package.json'
  - 'client/bun.lock'
  - 'client/bunfig.toml'

# Every input of the Rust image build, which the policy checks against Dockerfile.rust.
rust:
  - *workflow
  - 'rust/**'
  - 'api/**'
  - 'go/**'
  - 'client/**'
  - 'legal/**'
  - 'container/Dockerfile.rust'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

# Inputs of the Rust release exports, their staging and their verification.
rust-release:
  - '.github/workflows/ci.yml'
  - '.github/workflows/release-request.yml'
  - '.github/actions/**'
  - '.github/ci-paths.yml'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'
  - 'mise.toml'
  - 'mise.lock'
  - 'container/Dockerfile.rust'
  - 'scripts/**'
  - 'legal/**'
  - 'client/package.json'
  - 'client/bun.lock'
  - 'client/bunfig.toml'
  - 'rust/Cargo.lock'
  - 'rust/Cargo.toml'
  - 'rust/*/Cargo.toml'
  - 'rust/*/build.rs'
  - 'rust/legal_build.rs'
  - 'rust/rust-toolchain.toml'
