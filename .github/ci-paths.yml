workflow: &workflow
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/ci-paths.yml'
  - '.githooks/**'
  - 'scripts/**'
  - 'mise.toml'
  - 'mise.lock'
  - 'go/go.mod'
  - 'go/go.sum'

code:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'rust/**'
  - 'legal/**'
  - 'container/**'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

go:
  - *workflow
  - 'api/**'
  - 'go/**'
  - 'client/src/app.css'

deps:
  - *workflow
  - 'go/**'
  - 'client/package.json'
  - 'client/bun.lock'
  - 'client/bunfig.toml'

rust:
  - *workflow
  - 'rust/**'
  - 'api/**'
  - 'go/**'
  - 'client/**'
  - 'legal/**'
  - 'container/Dockerfile.rust'

# Inputs that can change what a macOS TUI links or imports, or how its notices are checked.
darwin:
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'
  - 'mise.toml'
  - 'mise.lock'
  - 'scripts/legal/**'
  - 'scripts/package-rust.py'
  - 'scripts/tui-targets.txt'
  - 'legal/rust-*.json'
  - 'rust/Cargo.lock'
  - 'rust/Cargo.toml'
  - 'rust/*/Cargo.toml'
  - 'rust/*/build.rs'
  - 'rust/rust-toolchain.toml'
