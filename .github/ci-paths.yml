workflow: &workflow
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/ci-paths.yml'
  - '.githooks/**'
  - 'scripts/**'
  - 'mise.toml'
  - 'mise.lock'
  - 'go/go.mod'
  - 'go/go.sum'

# Client v2 and what it shares from client v1: static files and the E2E harness modules.
code:
  - *workflow
  - 'api/**'
  - 'client-v2/**'
  - 'client/public/**'
  - 'client/e2e/browsers.ts'
  - 'client/e2e/servers.ts'
  - 'client/e2e/webview.ts'
  - 'client/scripts/e2e.ts'
  - 'go/**'
  - 'legal/**'
  - 'container/**'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

go:
  - *workflow
  - 'api/**'
  - 'go/**'

deps:
  - *workflow
  - 'go/**'
  - 'client-v2/package.json'
  - 'client-v2/bun.lock'
  - 'client-v2/bunfig.toml'

# Inputs of the Rust workspace's checks and tests.
rust:
  - *workflow
  - 'rust/**'
  - 'api/**'
  - 'legal/**'
  - 'go/internal/auth/assets/**'

# The Rust binaries against Go's peers, server and client.
rust-interop:
  - *workflow
  - 'rust/**'
  - 'go/**'

# Every input of the Rust image build, which the policy checks against Dockerfile.rust.
rust-image:
  - *workflow
  - 'rust/**'
  - 'legal/**'
  - 'client-v2/**'
  - 'client/public/**'
  - 'client/e2e/browsers.ts'
  - 'client/e2e/servers.ts'
  - 'client/e2e/webview.ts'
  - 'client/scripts/e2e.ts'
  - 'go/internal/auth/assets/**'
  - 'container/Dockerfile.rust'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

# Inputs of the TUI archives and their staging, rust/**/src included: every stage of Dockerfile.rust, and of the
# browser app's only its locked dependencies, whose sources the server's source offers carry.
rust-release:
  - *workflow
  - 'rust/**'
  - 'legal/**'
  - 'go/internal/auth/assets/**'
  - 'client-v2/package.json'
  - 'client-v2/bun.lock'
  - 'client-v2/bunfig.toml'
  - 'container/Dockerfile.rust'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'
