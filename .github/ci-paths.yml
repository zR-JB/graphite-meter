workflow: &workflow
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/ci-paths.yml'
  - '.githooks/**'
  - 'scripts/**'
  - 'mise.toml'
  - 'mise.lock'
  - 'go/go.mod'
  - 'go/go.sum'

# Client v2's lockfiles reach the union legal scope; the rest of client-v2/ selects only its own jobs.
code:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'client-v2/package.json'
  - 'client-v2/bun.lock'
  - 'client-v2/bunfig.toml'
  - 'go/**'
  - 'legal/**'
  - 'container/**'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

go:
  - *workflow
  - 'api/**'
  - 'go/**'
  - 'client/src/app.css'

deps:
  - *workflow
  - 'go/**'
  - 'client/package.json'
  - 'client/bun.lock'
  - 'client/bunfig.toml'
  - 'client-v2/package.json'
  - 'client-v2/bun.lock'
  - 'client-v2/bunfig.toml'

# The v2 browser client, the static files and E2E harness it shares with v1, and the server it runs against.
client-v2:
  - *workflow
  - 'client-v2/**'
  - 'client/public/**'
  - 'client/e2e/browsers.ts'
  - 'client/e2e/servers.ts'
  - 'client/e2e/webview.ts'
  - 'client/scripts/e2e.ts'
  - 'api/**'
  - 'go/**'
  - 'legal/**'
  - 'container/Dockerfile'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

# Inputs of the Rust workspace's checks and tests.
rust:
  - *workflow
  - 'rust/**'
  - 'api/**'
  - 'legal/**'
  - 'go/internal/auth/assets/**'

# The Rust binaries against Go's peers, server and client.
rust-interop:
  - *workflow
  - 'rust/**'
  - 'go/**'

# Every input of the Rust image build, which the policy checks against Dockerfile.rust.
rust-image:
  - *workflow
  - 'rust/**'
  - 'legal/**'
  - 'client/**'
  - 'api/**'
  - 'go/internal/auth/assets/**'
  - 'container/Dockerfile.rust'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

# Inputs of the TUI archives and their staging, rust/**/src included: every stage of Dockerfile.rust, and of the
# browser app's only its locked dependencies, whose sources the server's source offers carry.
rust-release:
  - *workflow
  - 'rust/**'
  - 'legal/**'
  - 'go/internal/auth/assets/**'
  - 'client/package.json'
  - 'client/bun.lock'
  - 'client/bunfig.toml'
  - 'client/patches/**'
  - 'container/Dockerfile.rust'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'
