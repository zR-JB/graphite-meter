workflow: &workflow
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/ci-paths.yml'
  - '.githooks/**'
  - 'scripts/ci/**'
  - 'justfile'
  - '.bun-version'
  - '.just-version'
  - '.gitleaks-version'
  - 'go/go.mod'
  - 'go/go.sum'

core:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'legal/**'
  - 'scripts/**'
  - 'container/**'
  - 'LICENSE'
  - 'COPYRIGHT'

go:
  - *workflow
  - 'api/**'
  - 'go/**'
  - 'client/src/auth/**'

browser:
  - *workflow
  - 'api/**'
  - 'client/**'

tui:
  - *workflow
  - 'go/**'
  - 'scripts/tui-targets.txt'
  - 'scripts/package-tui.sh'

integration:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'container/**'

smoke:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'container/**'
  - '.dockerignore'
  - 'legal/**'
  - 'LICENSE'
  - 'COPYRIGHT'
  - 'scripts/verify-container.sh'

release:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'legal/**'
  - 'container/**'
  - '.dockerignore'
  - 'scripts/**'
  - 'LICENSE'
  - 'COPYRIGHT'

security:
  - *workflow
  - 'go/**'
  - 'client/package.json'
  - 'client/bun.lock'
  - 'client/bunfig.toml'
