workflow: &workflow
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/ci-paths.yml'
  - '.githooks/**'
  - 'scripts/**'
  - 'mise.toml'
  - 'mise.lock'
  - 'go/go.mod'
  - 'go/go.sum'

code:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'legal/**'
  - 'container/**'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

go:
  - *workflow
  - 'api/**'
  - 'go/**'
  - 'client/src/app.css'

deps:
  - *workflow
  - 'go/**'
  - 'client/package.json'
  - 'client/bun.lock'
  - 'client/bunfig.toml'

# Inputs of the Rust workspace's checks and tests.
rust:
  - *workflow
  - 'rust/**'
  - 'api/**'
  - 'legal/**'
  - 'go/internal/auth/assets/**'

# The Rust binaries against Go's peers, server and client.
rust-interop:
  - *workflow
  - 'rust/**'
  - 'go/**'

# Every input of the Rust image build, which the policy checks against Dockerfile.rust.
rust-image:
  - *workflow
  - 'rust/**'
  - 'legal/**'
  - 'client/**'
  - 'api/**'
  - 'go/internal/auth/assets/**'
  - 'container/Dockerfile.rust'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

# Inputs of the TUI archives and their staging: every stage of Dockerfile.rust but the browser app's, rust/**/src included.
rust-release:
  - *workflow
  - 'rust/**'
  - 'legal/**'
  - 'go/internal/auth/assets/**'
  - 'container/Dockerfile.rust'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'
