workflow: &workflow
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/ci-paths.yml'
  - '.githooks/**'
  - 'scripts/**'
  - 'mise.toml'
  - 'mise.lock'
  - 'go/go.mod'
  - 'go/go.sum'

core:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'legal/**'
  - 'container/**'
  - 'LICENSE'
  - 'COPYRIGHT'

go:
  - *workflow
  - 'api/**'
  - 'go/**'
  - 'client/src/auth/**'
  - 'client/src/app.css'

tui:
  - *workflow
  - 'go/**'

e2e:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'container/**'

smoke:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'container/**'
  - '.dockerignore'
  - 'legal/**'
  - 'LICENSE'
  - 'COPYRIGHT'

release:
  - *workflow
  - 'api/**'
  - 'client/**'
  - 'go/**'
  - 'legal/**'
  - 'container/**'
  - '.dockerignore'
  - 'LICENSE'
  - 'COPYRIGHT'

security:
  - *workflow
  - 'go/**'
  - 'client/package.json'
  - 'client/bun.lock'
  - 'client/bunfig.toml'
