version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-deps:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /client
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      client-deps:
        patterns: ["*"]
