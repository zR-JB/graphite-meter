version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /client
    # Svelte requires this alias for the stable native compiler alongside TypeScript 6.
    # Bun Dependabot looks up the alias as a package and fails with registry_error.
    ignore:
      - dependency-name: "@typescript/native"
    schedule:
      interval: weekly
    groups:
      client-deps:
        patterns: ["*"]
