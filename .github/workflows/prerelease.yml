name: Publish PR prerelease

# This workflow never checks out or executes PR code. It validates the request,
# asks the owner to apply a one-use label, validates the resulting OCI data,
# and gives package write permission only to the final publisher.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open same-repository PR number
        required: true
        type: string
      tag:
        description: vMAJOR.MINOR.PATCH-alpha.N, beta.N, or rc.N
        required: true
        type: string
      sha:
        description: Exact 40-character current PR head SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  issues: write

concurrency:
  group: prerelease-${{ github.repository }}-${{ inputs.pr }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Official Quay currently publishes v1.22.2 as its newest stable Skopeo
  # image. Keep this digest immutable and verify the binary at runtime.
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:c7d3c512612f52805023cd38351081dad7e2729fc13d14b701e47c7c8bdd6615
  SKOPEO_VERSION: 1.22.2

jobs:
  request:
    name: Validate prerelease request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      label: ${{ steps.trust.outputs.label }}
      request_run_id: ${{ steps.trust.outputs.request_run_id }}
      pr: ${{ steps.trust.outputs.pr }}
      sha: ${{ steps.trust.outputs.sha }}
      tag: ${{ steps.trust.outputs.tag }}
      version: ${{ steps.trust.outputs.version }}
    steps:
      - name: Checkout trusted main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: trust
        name: Verify owner, PR, tree, Gate, and CodeQL
        shell: bash
        env:
          MODE: request
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ inputs.pr }}
          REQUESTED_SHA: ${{ inputs.sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: scripts/prerelease-trust.sh

  wait-for-candidate:
    name: Wait for exact candidate artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: request
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      oci_sha256: ${{ steps.wait.outputs.oci_sha256 }}
      artifact_digest: ${{ steps.wait.outputs.artifact_digest }}
      candidate_run_id: ${{ steps.wait.outputs.candidate_run_id }}
    steps:
      - name: Checkout trusted main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: wait
        name: Find and verify exact candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_RUN_ID: ${{ needs.request.outputs.request_run_id }}
          REQUEST_PR: ${{ needs.request.outputs.pr }}
          REQUEST_SHA: ${{ needs.request.outputs.sha }}
          REQUEST_TAG: ${{ needs.request.outputs.tag }}
          REQUEST_VERSION: ${{ needs.request.outputs.version }}
        run: scripts/prerelease-wait.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-prerelease-oci-${{ needs.request.outputs.request_run_id }}
          path: ${{ steps.wait.outputs.handoff_dir }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  validate-candidate:
    name: Validate candidate OCI data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [request, wait-for-candidate]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-prerelease-oci-${{ needs.request.outputs.request_run_id }}
          path: ${{ runner.temp }}/validated-prerelease
      - name: Verify trusted handoff checksum
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.wait-for-candidate.outputs.oci_sha256 }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/validated-prerelease"
          jq -e --arg sha "$EXPECTED_SHA256" '.ociSha256 == $sha' "$handoff/trusted-validation.json" >/dev/null
          actual=$(sha256sum "$handoff/graphite-meter.oci.tar" | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_SHA256" ]]
      - name: Checkout trusted main verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect candidate without executing it
        env:
          REPOSITORY: ${{ github.repository }}
          SKOPEO_IMAGE: ${{ env.SKOPEO_IMAGE }}
          SKOPEO_VERSION: ${{ env.SKOPEO_VERSION }}
          VERSION: ${{ needs.request.outputs.version }}
          REVISION: ${{ needs.request.outputs.sha }}
        run: scripts/verify-prerelease-oci.sh "$VERSION" "$REVISION" "$RUNNER_TEMP/validated-prerelease/graphite-meter.oci.tar"

  recheck:
    name: Recheck PR trust state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [request, validate-candidate]
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout trusted main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify PR has not moved
        shell: bash
        env:
          MODE: recheck
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.request.outputs.pr }}
          REQUESTED_SHA: ${{ needs.request.outputs.sha }}
          REQUESTED_TAG: ${{ needs.request.outputs.tag }}
        run: scripts/prerelease-trust.sh

  publish-prerelease:
    name: Publish exact PR prerelease image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [request, wait-for-candidate, validate-candidate, recheck]
    environment: ghcr-release
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-prerelease-oci-${{ needs.request.outputs.request_run_id }}
          path: ${{ runner.temp }}/validated-prerelease
      - name: Verify the exact trusted archive before authentication
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.wait-for-candidate.outputs.oci_sha256 }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/validated-prerelease"
          jq -e --arg sha "$EXPECTED_SHA256" '.ociSha256 == $sha' "$handoff/trusted-validation.json" >/dev/null
          actual=$(sha256sum "$handoff/graphite-meter.oci.tar" | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_SHA256" ]]
      - name: Publish only the requested immutable prerelease tag
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.request.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          docker run --rm --entrypoint /bin/sh \
            -e REGISTRY_TOKEN -e GITHUB_ACTOR -e IMAGE="$image" -e VERSION \
            -v "$RUNNER_TEMP/validated-prerelease:/work:ro" \
            "$SKOPEO_IMAGE" -ec '
              auth_dir=$(mktemp -d)
              trap "rm -rf \"$auth_dir\"" EXIT
              export REGISTRY_AUTH_FILE="$auth_dir/auth.json"
              printf "%s" "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
              error_file=$(mktemp)
              if skopeo inspect "docker://$IMAGE:$VERSION" >/dev/null 2>"$error_file"; then
                echo "prerelease image $VERSION already exists; refusing overwrite" >&2
                exit 1
              fi
              if ! grep -Eiq "manifest unknown|name unknown|not found|404" "$error_file"; then
                cat "$error_file" >&2
                echo "registry lookup failed; refusing to publish" >&2
                exit 1
              fi
              skopeo copy --all oci-archive:/work/graphite-meter.oci.tar "docker://$IMAGE:$VERSION"
              skopeo logout ghcr.io
            '

  cleanup-request:
    name: Clean up temporary request label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [request, wait-for-candidate, validate-candidate, recheck, publish-prerelease]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Remove only this request label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          REQUESTED_SHA: ${{ inputs.sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUEST_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          label="gm-prerelease-$REQUEST_RUN_ID"
          if metadata=$(gh api "repos/$REPOSITORY/labels/$label" 2>/dev/null); then
            expected=$(jq -cn --arg tag "$REQUESTED_TAG" --arg sha "$REQUESTED_SHA" \
              '{t:$tag,s:$sha}')
            actual=$(jq -r '.description // ""' <<<"$metadata")
            if [[ "$actual" == "$expected" ]]; then
              gh api --method DELETE "repos/$REPOSITORY/issues/$PR_NUMBER/labels/$label" >/dev/null 2>&1 || true
              gh api --method DELETE "repos/$REPOSITORY/labels/$label" >/dev/null 2>&1 || true
            else
              echo "temporary label metadata did not match; leaving it untouched" >&2
              exit 1
            fi
          fi
