name: Release
run-name: Stable release · trusted request run ${{ github.event.workflow_run.id }} · ${{ github.sha }}

# TRUSTED CONSUMER: the manual request workflow has no publication authority.
# workflow_run executes this workflow from the default branch, where the request
# run/ref/artifact are treated as untrusted input and rebound to exact current main.
on:
  workflow_run:
    workflows: ["Request stable release"]
    types: [completed]

permissions:
  contents: read
  actions: read
  security-events: read

# One stable release transaction at a time. This also avoids confusing interleaved UI state.
concurrency:
  group: stable-release-${{ github.repository }}
  cancel-in-progress: false

env:
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:c7d3c512612f52805023cd38351081dad7e2729fc13d14b701e47c7c8bdd6615
  SKOPEO_VERSION: 1.22.2

jobs:
  guard:
    if: github.event.workflow_run.conclusion == 'success'
    name: Guard trusted current-main release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
      series: ${{ steps.guard.outputs.series }}
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - name: Checkout trusted default-branch release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download untrusted manual release request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-request-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/stable-release-request
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - id: guard
        name: Bind request to trusted current main, Gate, CodeQL, and stable SemVer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PUBLISHER_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUEST_DIR: ${{ runner.temp }}/stable-release-request
        run: python3 scripts/ci/release.py guard

  build:
    name: Build and verify exact release payload
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: guard
    permissions:
      contents: read
    outputs:
      oci_sha256: ${{ steps.oci-digest.outputs.sha256 }}
    steps:
      - name: Checkout guarded release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up release toolchain without dependency caches
        uses: ./.github/actions/setup-project
        with:
          go: 'true'
          go-cache: 'false'
          bun: 'true'
          client-deps: 'true'
          bun-cache: 'false'

      - name: Generate release legal outputs
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: just legal-generate

      - name: Build exact production client and server
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: just release-build "$VERSION"

      - name: Build native artifacts and corresponding source
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: just release-artifacts "$VERSION"

      - name: Verify release package invariants
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: just release-check "$VERSION"

      - name: Build linux/amd64 + linux/arm64 OCI archive
        uses: ./.github/actions/build-oci
        with:
          version: ${{ needs.guard.outputs.version }}
          revision: ${{ github.sha }}
          output: ${{ runner.temp }}/release-image/graphite-meter.oci.tar
          client-validate: '0'

      - name: Verify OCI platforms and provenance labels
        env:
          REPOSITORY: ${{ github.repository }}
          SKOPEO_IMAGE: ${{ env.SKOPEO_IMAGE }}
          SKOPEO_VERSION: ${{ env.SKOPEO_VERSION }}
          VERSION: ${{ needs.guard.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/ci/verify_oci.py "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/release-image/graphite-meter.oci.tar"

      - name: Verify native artifacts and embedded versions
        env:
          RELEASE_DIST: go/dist
          VERSION: ${{ needs.guard.outputs.version }}
        run: python3 scripts/ci/verify_release_assets.py "$VERSION"

      - id: oci-digest
        name: Record OCI archive SHA-256
        run: |
          set -euo pipefail
          digest=$(sha256sum "$RUNNER_TEMP/release-image/graphite-meter.oci.tar" | awk '{print $1}')
          echo "sha256=$digest" >>"$GITHUB_OUTPUT"
          echo "::notice::release OCI handoff sha256:$digest"

      - name: Upload verified release image handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image/graphite-meter.oci.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Upload verified release asset handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: go/dist/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  approval:
    name: Approve stable publication
    if: needs.guard.outputs.publish == 'true'
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ghcr-release
    permissions: {}
    steps:
      - name: Publication authorization granted
        run: echo "::notice::protected release environment approved; final trust recheck starts next"

  recheck:
    name: Recheck mutable release trust after approval
    if: needs.guard.outputs.publish == 'true'
    needs: [guard, build, approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ci_run_id: ${{ steps.recheck.outputs.ci_run_id }}
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - name: Checkout trusted current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: recheck
        name: Reconfirm source is still current main with Gate and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REQUESTED_VERSION: ${{ needs.guard.outputs.tag }}
        run: python3 scripts/ci/release.py recheck

  publish-image:
    name: Publish exact version image
    if: needs.guard.outputs.publish == 'true'
    needs: [guard, build, recheck]
    uses: ./.github/workflows/_publish-oci.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      packages: write
    with:
      artifact: release-image
      tag: ${{ needs.guard.outputs.version }}
      expected_sha256: ${{ needs.build.outputs.oci_sha256 }}
      source_sha: ${{ github.sha }}
      trusted_main_sha: ${{ github.sha }}
      expected_ci_run_id: ${{ needs.recheck.outputs.ci_run_id }}

  publish-release:
    name: Publish verified stable GitHub Release
    if: needs.guard.outputs.publish == 'true'
    needs: [guard, build, publish-image]
    uses: ./.github/workflows/_publish-release.yml
    permissions:
      actions: read
      contents: write
    with:
      artifact: release-artifacts
      tag: ${{ needs.guard.outputs.tag }}
      target_sha: ${{ github.sha }}

  promote:
    name: Promote stable aliases without rollback
    if: needs.guard.outputs.publish == 'true'
    needs: [guard, publish-release]
    uses: ./.github/workflows/_promote-oci.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.guard.outputs.version }}
      series: ${{ needs.guard.outputs.series }}
