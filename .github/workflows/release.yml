name: Release

# Production publishing is tag-only. workflow_dispatch is deliberately a
# validation build from trusted main and never receives publication rights.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer test version for a trusted-main dry run, e.g. v0.5.2
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  security-events: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}

env:
  # Official Quay currently publishes v1.22.2 as its newest stable Skopeo
  # image. Keep this digest immutable and verify the binary at runtime. Move
  # this single reference to the official v1.23.0 image when that image is
  # published; do not substitute an unverified digest.
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:c7d3c512612f52805023cd38351081dad7e2729fc13d14b701e47c7c8bdd6615
  SKOPEO_VERSION: 1.22.2

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
      series: ${{ steps.guard.outputs.series }}
      stable: ${{ steps.guard.outputs.stable }}
      dry_run: ${{ steps.guard.outputs.dry_run }}
    steps:
      - name: Checkout trusted tag
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout trusted main for dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - id: guard
        name: Verify exact release source and checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: scripts/release-guard.sh

  build:
    name: Trusted release build and verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: guard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: zR-JB/graphite-meter/.github/actions/setup-project@f93944ad191f8a55e74f49b2de92ed1a1747692a
        with:
          go: 'true'
          bun: 'true'
          client-deps: 'true'
          bun-cache: 'false'
      - id: versions
        name: Read repository toolchain versions
        shell: bash
        run: echo "bun=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"
      - name: Generate release legal outputs
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: just legal-generate
      - name: Build exact production client and server
        run: just release-build "${{ needs.guard.outputs.version }}"
      - name: Build all native release artifacts
        run: just release-artifacts "${{ needs.guard.outputs.version }}"
      - name: Verify release package invariants
        run: just release-check "${{ needs.guard.outputs.version }}"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build multi-platform OCI archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/graphite-meter.oci.tar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.guard.outputs.sha }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            GM_CLIENT_BUILD_LABEL=prod
            GM_CLIENT_VALIDATE=0
            BUN_VERSION=${{ steps.versions.outputs.bun }}
      - name: Verify OCI archive and release artifacts
        env:
          RELEASE_DIST: go/dist
        run: scripts/verify-release.sh "${{ needs.guard.outputs.version }}" "${{ runner.temp }}/graphite-meter.oci.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image
          path: ${{ runner.temp }}/graphite-meter.oci.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: go/dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish exact image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [guard, build]
    if: needs.guard.outputs.dry_run != 'true'
    environment: ghcr-release
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image
      - name: Publish image and stable aliases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.guard.outputs.version }}
          SERIES: ${{ needs.guard.outputs.series }}
          STABLE: ${{ needs.guard.outputs.stable }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker run --rm --entrypoint /bin/sh \
            -e GH_TOKEN -e GITHUB_ACTOR -e IMAGE -e VERSION -e SERIES -e STABLE \
            -v "$RUNNER_TEMP/release-image:/work:ro" \
            "$SKOPEO_IMAGE" -ec '
              auth_dir=$(mktemp -d)
              trap "rm -rf \"$auth_dir\"" EXIT
              export REGISTRY_AUTH_FILE="$auth_dir/auth.json"
              printf "%s" "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
              skopeo copy --all oci-archive:/work/graphite-meter.oci.tar "docker://$IMAGE:$VERSION"
              if [ "$STABLE" = true ]; then
                skopeo copy --all "docker://$IMAGE:$VERSION" "docker://$IMAGE:$SERIES"
                skopeo copy --all "docker://$IMAGE:$VERSION" "docker://$IMAGE:latest"
              fi
              skopeo logout ghcr.io
            '

  github-release:
    name: Create stable GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [guard, publish]
    if: needs.guard.outputs.stable == 'true' && needs.guard.outputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          generate_release_notes: true
          files: ${{ runner.temp }}/release-artifacts/*
