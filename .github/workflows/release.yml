name: Release
# The request title holds dispatch inputs, so only its GitHub-set run number names this run.
run-name: Release of request #${{ github.event.workflow_run.run_number }}

# TRUSTED CONSUMER: runs default-branch tooling only, never checks out or executes
# the requested source, and treats the request run's artifacts as untrusted data.
on:
  workflow_run:
    workflows: ["Request release"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.path == '.github/workflows/release-request.yml'
    name: Verify request
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      security-events: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      stable: ${{ steps.verify.outputs.stable }}
      publish: ${{ steps.verify.outputs.publish }}
      sha: ${{ steps.verify.outputs.sha }}
      main_sha: ${{ steps.verify.outputs.main_sha }}
      pr: ${{ steps.verify.outputs.pr }}
      oci_sha256: ${{ steps.verify.outputs.oci_sha256 }}
      digest: ${{ steps.verify.outputs.digest }}
      assets_sha256: ${{ steps.verify.outputs.assets_sha256 }}
    steps:
      - name: Check out main's tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_AUTO_INSTALL: '0'
        with:
          version: 2026.10.18
          install_args: --locked python
          cache: false

      - name: Download request
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-request-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/request/release-request-${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - id: verify
        name: Verify request, files, CI and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PUBLISHER_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUEST_DIR: ${{ runner.temp }}/request
          HANDOFF_DIR: ${{ runner.temp }}/handoff
        run: python3 scripts/ci/release.py verify

      - name: Hand off image
        if: steps.verify.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: ${{ runner.temp }}/handoff/image/graphite-meter.oci.tar
          if-no-files-found: error
          retention-days: 35
          compression-level: 0
          overwrite: true

      - name: Hand off release assets
        if: steps.verify.outputs.publish == 'true' && steps.verify.outputs.stable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/handoff/assets/*
          if-no-files-found: error
          retention-days: 35
          overwrite: true

  publish:
    name: Publish ${{ needs.verify.outputs.tag || 'release' }}
    if: needs.verify.outputs.publish == 'true'
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: ghcr-release
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    env:
      SKOPEO_IMAGE: quay.io/containers/skopeo:v1.22.3-immutable@sha256:f45eb1e14223a5ba0da4246274679a083653dab1402acc1fcb70a6339b50cf00
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      security-events: read
    steps:
      - name: Check out main's tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_AUTO_INSTALL: '0'
        with:
          version: 2026.10.18
          install_args: --locked python
          cache: false

      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: ${{ runner.temp }}/handoff/image

      - name: Download release assets
        if: needs.verify.outputs.stable == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/handoff/assets

      - name: Recheck after approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          MAIN_SHA: ${{ needs.verify.outputs.main_sha }}
          PR: ${{ needs.verify.outputs.pr }}
          OCI_SHA256: ${{ needs.verify.outputs.oci_sha256 }}
          ASSETS_SHA256: ${{ needs.verify.outputs.assets_sha256 }}
          HANDOFF_DIR: ${{ runner.temp }}/handoff
        run: python3 scripts/ci/release.py recheck

      - name: Push version tag
        env:
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REGISTRY_ACTOR: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.verify.outputs.digest }}
          ARCHIVE_DIR: ${{ runner.temp }}/handoff/image
        run: scripts/ci/publish.sh image

      - id: app
        name: Mint release token
        if: needs.verify.outputs.stable == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish GitHub Release
        if: needs.verify.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          DIGEST: ${{ needs.verify.outputs.digest }}
          ASSETS_DIR: ${{ runner.temp }}/handoff/assets
        run: python3 scripts/ci/release.py publish

      - name: Move stable aliases
        if: needs.verify.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REGISTRY_ACTOR: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.verify.outputs.digest }}
        run: scripts/ci/publish.sh aliases
