name: Release

# Tag scheme (SemVer 2.0.0): vMAJOR.MINOR.PATCH[-alpha.N|-beta.N|-rc.N].
#   v0.1.0-alpha.0, v0.1.0-alpha.1, ... -beta.0 ..., -rc.0 ... then v0.1.0.
# Use dotted numeric prerelease identifiers (alpha.9 < alpha.10 compares
# correctly; a bare "alpha10" would sort lexically wrong). A tag counts as
# a prerelease iff its name contains "-" — every job below keys off that.
# Prerelease tags: build + push the image from a CI-green main commit or open
# same-repository PR targeting main, but never move the
# `latest`/`{{major}}.{{minor}}` floating tags or cut a GitHub Release. Final
# tags (no "-"): main only, full promotion, all floating tags move, GitHub
# Release is created.
on:
  push:
    tags: ["v*.*.*"] # glob `*` matches "-" too, so this already covers prereleases

permissions:
  contents: write
  packages: write
  actions: read # guard job reads the CI run for the tagged commit
  pull-requests: read # prerelease tags may point at an open PR head

concurrency:
  group: release-${{ github.ref }}

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Stable artifacts remain main-only. Prerelease images may come from an
      # open same-repository PR targeting main so the exact candidate can be
      # tested before merge; its pull-request CI is checked below.
      - name: Verify tag source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          ci_event=push
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            if [[ "${{ github.ref_name }}" != *-* ]]; then
              echo "::error::Stable tag ${{ github.ref_name }} (commit ${{ github.sha }}) is not reachable from main — refusing to publish."
              exit 1
            fi
            pr_number="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq 'map(select(.state == "open" and .base.ref == "main" and .head.sha == "${{ github.sha }}" and .head.repo.full_name == "${{ github.repository }}")) | first | .number // empty')"
            if [[ -z "$pr_number" ]]; then
              echo "::error::Prerelease tag ${{ github.ref_name }} must point to main or the exact head of an open same-repository PR targeting main."
              exit 1
            fi
            echo "Using pull-request CI from PR #$pr_number."
            ci_event=pull_request
          fi
          echo "ci_event=$ci_event" >> "$GITHUB_OUTPUT"
      # CI already ran the full matrix for the exact main or PR head commit.
      # Verify that run instead of rebuilding it here; wait for an in-flight
      # run and fail on anything but a completed success.
      - name: Verify CI succeeded on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT: ${{ steps.source.outputs.ci_event }}
        run: |
          runs_url="repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&event=${CI_EVENT}"
          for i in $(seq 1 60); do
            read -r status conclusion <<<"$(gh api "$runs_url" \
              --jq '.workflow_runs | first // {} | "\(.status // "missing") \(.conclusion // "-")"')"
            case "$status" in
              completed)
                [ "$conclusion" = "success" ] && exit 0
                echo "::error::CI for ${{ github.sha }} concluded '$conclusion' — refusing to publish."
                exit 1
                ;;
              missing)
                echo "::error::No CI push run found for ${{ github.sha }} — tag a commit from main after CI has been triggered on it."
                exit 1
                ;;
              *)
                echo "CI run is '$status' — waiting ($i/60)"
                sleep 15
                ;;
            esac
          done
          echo "::error::Timed out waiting for CI on ${{ github.sha }}."
          exit 1

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: guard
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false disables the action's own implicit "latest" so it can't
          # ever conflict with the explicit, prerelease-aware rule below.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The guard requires a successful CI push run for this exact commit,
          # so release only rebuilds the artifact.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GM_CLIENT_BUILD_LABEL=prod
            GM_CLIENT_VALIDATE=0
          cache-from: type=gha

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish
    # Prerelease tags (v0.1.0-alpha.0 etc.) publish an image to test against
    # but deliberately don't cut a GitHub Release — that's reserved for the
    # final tag once it's actually promoted. Same gate covers the native TUI
    # client binaries below: no Release object, nowhere to attach them.
    if: ${{ !contains(github.ref_name, '-') }}
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Standalone downloads for the native Bubble Tea TUI client (connects to
      # any running server; not embedded in the container image). Pure Go, no
      # cgo, so it cross-compiles cleanly from one runner. Stamped with the
      # same VERSION as the image (see go/internal/goclient.Version).
      #
      # Symbols are deliberately NOT stripped: unsigned Go binaries built with
      # -s -w trip AV ML heuristics (Trojan:Win32/Wacatac.C!ml and friends).
      # The build is bit-for-bit reproducible from a clean checkout of the
      # tagged commit with this exact go build line (go/dist and the
      # intermediate binaries are gitignored so buildvcs stamps a clean tree).
      - name: Build native client binaries
        working-directory: go
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-X github.com/zR-JB/graphite-meter/go/internal/goclient.Version=${VERSION}"
          build() {
            os="$1"; arch="$2"
            bin="graphite-meter-client"
            [ "$os" = "windows" ] && bin="graphite-meter-client.exe"
            echo "building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$bin" ./cmd/graphite-meter-client
            if [ "$os" = "windows" ]; then
              zip -j "dist/graphite-meter-client_${VERSION}_${os}_${arch}.zip" "$bin"
            else
              tar -czf "dist/graphite-meter-client_${VERSION}_${os}_${arch}.tar.gz" "$bin"
            fi
            rm -f "$bin"
          }
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64
          ( cd dist && sha256sum * > checksums.txt )
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: go/dist/*
