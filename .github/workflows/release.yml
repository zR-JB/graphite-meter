name: Release
run-name: Release · request run ${{ github.event.workflow_run.id }} · ${{ github.sha }}

# TRUSTED CONSUMER: runs default-branch tooling only, never checks out or executes
# the requested source, and treats the request run's artifacts as untrusted data.
on:
  workflow_run:
    workflows: ["Request release"]
    types: [completed]

permissions:
  contents: read

env:
  SKOPEO_IMAGE: quay.io/containers/skopeo:v1.22.3-immutable@sha256:f45eb1e14223a5ba0da4246274679a083653dab1402acc1fcb70a6339b50cf00
  SKOPEO_VERSION: 1.22.3

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.path == '.github/workflows/release-request.yml'
    name: Verify the untrusted candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      security-events: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      stable: ${{ steps.verify.outputs.stable }}
      publish: ${{ steps.verify.outputs.publish }}
      sha: ${{ steps.verify.outputs.sha }}
      main_sha: ${{ steps.verify.outputs.main_sha }}
      pr: ${{ steps.verify.outputs.pr }}
      oci_sha256: ${{ steps.verify.outputs.oci_sha256 }}
      digest: ${{ steps.verify.outputs.digest }}
      assets_sha256: ${{ steps.verify.outputs.assets_sha256 }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned mise and Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_AUTO_INSTALL: '0'
        with:
          version: 2026.9.14
          install_args: --locked python
          cache: false

      - name: Download the untrusted request artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/request
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - id: verify
        name: Verify request, artifacts, PR or main, Gate and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PUBLISHER_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUEST_DIR: ${{ runner.temp }}/request
          HANDOFF_DIR: ${{ runner.temp }}/handoff
        run: python3 scripts/ci/release.py verify

      - name: Upload verified image handoff
        if: steps.verify.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image
          path: ${{ runner.temp }}/handoff/image/graphite-meter.oci.tar
          if-no-files-found: error
          retention-days: 35
          compression-level: 0
          overwrite: true

      - name: Upload verified stable asset handoff
        if: steps.verify.outputs.publish == 'true' && steps.verify.outputs.stable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/handoff/assets/*
          if-no-files-found: error
          retention-days: 35
          overwrite: true

  publish:
    name: Publish after ghcr-release approval
    if: needs.verify.outputs.publish == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ghcr-release
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      security-events: read
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned mise and Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_AUTO_INSTALL: '0'
        with:
          version: 2026.9.14
          install_args: --locked python
          cache: false

      - name: Download verified image handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image
          path: ${{ runner.temp }}/handoff/image

      - name: Download verified stable asset handoff
        if: needs.verify.outputs.stable == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/handoff/assets

      - name: Recheck handoff, source, main, Gate and CodeQL after approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          MAIN_SHA: ${{ needs.verify.outputs.main_sha }}
          PR: ${{ needs.verify.outputs.pr }}
          OCI_SHA256: ${{ needs.verify.outputs.oci_sha256 }}
          ASSETS_SHA256: ${{ needs.verify.outputs.assets_sha256 }}
          HANDOFF_DIR: ${{ runner.temp }}/handoff
        run: python3 scripts/ci/release.py recheck

      - name: Publish the exact version tag
        env:
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REGISTRY_ACTOR: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.verify.outputs.digest }}
          ARCHIVE_DIR: ${{ runner.temp }}/handoff/image
        run: scripts/ci/publish.sh image

      - id: app
        name: Mint the release App token
        if: needs.verify.outputs.stable == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish the verified GitHub Release
        if: needs.verify.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          ASSETS_DIR: ${{ runner.temp }}/handoff/assets
        run: scripts/ci/publish.sh release

      - name: Promote stable aliases without rollback
        if: needs.verify.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REGISTRY_ACTOR: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.verify.outputs.digest }}
        run: scripts/ci/publish.sh aliases
