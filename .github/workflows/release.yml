name: Release

# Tag scheme (SemVer 2.0.0): vMAJOR.MINOR.PATCH[-alpha.N|-beta.N|-rc.N].
#   v0.1.0-alpha.0, v0.1.0-alpha.1, ... -beta.0 ..., -rc.0 ... then v0.1.0.
# Use dotted numeric prerelease identifiers (alpha.9 < alpha.10 compares
# correctly; a bare "alpha10" would sort lexically wrong). A tag counts as
# a prerelease iff its name contains "-" — every job below keys off that.
# Prerelease tags: build + push the image (so you can pull and test the
# exact release artifact) but never move the `latest`/`{{major}}.{{minor}}`
# floating tags and never cut a GitHub Release. Final tags (no "-"): full
# promotion, all floating tags move, GitHub Release is created.
on:
  push:
    tags: ["v*.*.*"] # glob `*` matches "-" too, so this already covers prereleases

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    name: Release tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Branch protection on main doesn't cover tags — anyone can push a tag
      # pointing at an unreviewed commit. Refuse to publish unless the tagged
      # commit actually merged to main, so the image always matches a
      # CI-green, reviewed state.
      - name: Verify tag is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} (commit ${{ github.sha }}) is not reachable from main — refusing to publish. Tag from an up-to-date main."
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: go test
        working-directory: go
        run: go test ./...
      - uses: oven-sh/setup-bun@v2
      - name: Client tests
        working-directory: client
        run: |
          bun install --frozen-lockfile
          bun test

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false disables the action's own implicit "latest" so it can't
          # ever conflict with the explicit, prerelease-aware rule below.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GM_CLIENT_BUILD_LABEL=prod
          cache-from: type=gha

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: publish
    # Prerelease tags (v0.1.0-alpha.0 etc.) publish an image to test against
    # but deliberately don't cut a GitHub Release — that's reserved for the
    # final tag once it's actually promoted.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
