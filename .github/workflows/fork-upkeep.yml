name: Fork upkeep

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-upkeep
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: '0'

jobs:
  upkeep:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.FORK_UPKEEP_APP_CLIENT_ID != '' && vars.FORK_PIN_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_AUTO_INSTALL: '0'
        with:
          version: 2026.9.14
          install_args: --locked python
          cache: false
      - id: inventory
        run: echo "repositories=$(python3 scripts/ci/fork_upkeep.py --repositories)" >> "$GITHUB_OUTPUT"
      - id: pin-token
        if: steps.inventory.outputs.repositories != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.FORK_PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORK_PIN_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose reviewed pins
        if: steps.inventory.outputs.repositories != ''
        env:
          GH_TOKEN: ${{ steps.pin-token.outputs.token }}
          APP_SLUG: ${{ steps.pin-token.outputs.app-slug }}
        run: |
          gh auth setup-git
          python3 scripts/ci/fork_upkeep.py --publish pins
      - id: fork-token
        if: steps.inventory.outputs.repositories != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.FORK_UPKEEP_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORK_UPKEEP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.inventory.outputs.repositories }}
          permission-contents: write
          permission-issues: write
          permission-workflows: write
      - name: Mirror forks and propose stable releases
        if: steps.inventory.outputs.repositories != ''
        env:
          GH_TOKEN: ${{ steps.fork-token.outputs.token }}
          APP_SLUG: ${{ steps.fork-token.outputs.app-slug }}
        run: |
          gh auth setup-git
          python3 scripts/ci/fork_upkeep.py --publish forks
