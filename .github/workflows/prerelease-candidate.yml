name: PR prerelease candidate

# This is deliberately a low-trust pull_request workflow. It may execute the
# requested PR's build code, but it never receives secrets or publication
# permission. The owner-applied request label is the only entry point.
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prerelease-candidate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  candidate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.label.name, 'gm-prerelease-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - id: request
        name: Validate internal request label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$LABEL_NAME" =~ ^gm-prerelease-[0-9]+$ ]] || { echo "not a prerelease request label" >&2; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "invalid PR number" >&2; exit 1; }
          [[ "$PR_BASE" == main && "$HEAD_REPOSITORY" == "$REPOSITORY" ]] || { echo "candidate is not a same-repository main PR" >&2; exit 1; }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid PR head SHA" >&2; exit 1; }

          label=$(gh api "repos/$REPOSITORY/labels/$LABEL_NAME")
          description=$(jq -r '.description // ""' <<<"$label")
          suffix=${LABEL_NAME#gm-prerelease-}
          tag=$(jq -r '.t // ""' <<<"$description")
          sha=$(jq -r '.s // ""' <<<"$description")
          request_run_id=$suffix
          [[ "$sha" == "$PR_HEAD_SHA" ]] || { echo "request SHA does not match current PR head" >&2; exit 1; }
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]] || { echo "request tag is invalid" >&2; exit 1; }
          version=${tag#v}
          {
            echo "request_run_id=$request_run_id"
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$sha"
            echo "pr=$PR_NUMBER"
          } >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-project
        with:
          go: 'true'
          bun: 'true'
          client-deps: 'true'

      - id: versions
        name: Read candidate toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          echo "bun=$(tr -d '[:space:]' < .bun-version)" >>"$GITHUB_OUTPUT"
          bun --version
          bun --revision

      - name: Generate candidate legal outputs
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: just legal-generate

      - name: Build exact candidate production client and server
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: just release-build "$VERSION"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd7d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build requested multi-platform OCI candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/graphite-meter.oci.tar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.request.outputs.sha }}
            org.opencontainers.image.version=${{ steps.request.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: |
            VERSION=${{ steps.request.outputs.version }}
            GM_CLIENT_BUILD_LABEL=prod
            GM_CLIENT_VALIDATE=0
            BUN_VERSION=${{ steps.versions.outputs.bun }}

      - name: Write candidate manifest and checksum
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.request.outputs.pr }}
          HEAD_SHA: ${{ steps.request.outputs.sha }}
          TAG: ${{ steps.request.outputs.tag }}
          VERSION: ${{ steps.request.outputs.version }}
          REQUEST_RUN_ID: ${{ steps.request.outputs.request_run_id }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum graphite-meter.oci.tar > graphite-meter.oci.tar.sha256
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg pr "$PR_NUMBER" \
            --arg headSha "$HEAD_SHA" \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg requestRunId "$REQUEST_RUN_ID" \
            --arg candidateRunId "$CANDIDATE_RUN_ID" \
            --arg candidateRunAttempt "$CANDIDATE_RUN_ATTEMPT" \
            '{schemaVersion:1,repository:$repository,pr:($pr|tonumber),headSha:$headSha,tag:$tag,version:$version,requestRunId:$requestRunId,candidateRunId:$candidateRunId,candidateRunAttempt:($candidateRunAttempt|tonumber)}' \
            > candidate.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prerelease-oci-${{ steps.request.outputs.request_run_id }}
          path: |
            ${{ runner.temp }}/graphite-meter.oci.tar
            ${{ runner.temp }}/graphite-meter.oci.tar.sha256
            ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
