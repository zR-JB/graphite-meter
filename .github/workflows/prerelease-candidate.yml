name: PR prerelease candidate
run-name: PR prerelease candidate · #${{ github.event.pull_request.number }} · ${{ github.event.label.name }}

# LOW TRUST: executes PR source. No secrets, no write permission, no shared dependency caches.
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: prerelease-candidate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build PR prerelease candidate
    if: >-
      github.run_attempt == 1 &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.label.name, 'gm-prerelease-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The workflow definition is separately required to match current main.
      # Canonical helpers are sourced from the PR base to reduce PR-controlled pipeline
      # configuration. This is still one low-trust runner: after PR code executes, no
      # candidate-side file is treated as a trust authority by the publisher.
      - name: Checkout base-sourced CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-ci
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts/ci
          sparse-checkout-cone-mode: false

      - id: request
        name: Validate owner-approved request label
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          LABEL_NAME: ${{ github.event.label.name }}
          LABEL_DESCRIPTION: ${{ github.event.label.description }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .trusted-ci/scripts/ci/prerelease.py candidate-prepare

      - name: Set up project toolchain without shared caches
        uses: ./.trusted-ci/.github/actions/setup-project
        with:
          go: 'true'
          go-cache: 'false'
          bun: 'true'
          client-deps: 'true'
          bun-cache: 'false'

      - name: Generate candidate legal outputs
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: just legal-generate

      - name: Build candidate production client and server
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: just release-build "$VERSION"

      - name: Build candidate linux/amd64 + linux/arm64 OCI archive
        uses: ./.trusted-ci/.github/actions/build-oci
        with:
          version: ${{ steps.request.outputs.version }}
          revision: ${{ steps.request.outputs.sha }}
          output: ${{ runner.temp }}/prerelease-candidate/graphite-meter.oci.tar
          client-validate: '0'

      - name: Finalize untrusted candidate manifest and checksum
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.request.outputs.pr }}
          HEAD_SHA: ${{ steps.request.outputs.sha }}
          TAG: ${{ steps.request.outputs.tag }}
          VERSION: ${{ steps.request.outputs.version }}
          REQUEST_RUN_ID: ${{ steps.request.outputs.request_run_id }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          OUT_DIR: ${{ runner.temp }}/prerelease-candidate
          OCI_ARCHIVE: ${{ runner.temp }}/prerelease-candidate/graphite-meter.oci.tar
        run: python3 .trusted-ci/scripts/ci/prerelease.py candidate-finalize

      - name: Upload untrusted candidate data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prerelease-candidate-${{ steps.request.outputs.request_run_id }}
          path: |
            ${{ runner.temp }}/prerelease-candidate/graphite-meter.oci.tar
            ${{ runner.temp }}/prerelease-candidate/graphite-meter.oci.tar.sha256
            ${{ runner.temp }}/prerelease-candidate/candidate.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
