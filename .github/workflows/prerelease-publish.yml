name: Publish verified PR prerelease
run-name: PR prerelease publish · candidate run ${{ github.event.workflow_run.id }}

# PRIVILEGED CONSUMER: candidate artifacts are untrusted data. PR source is never executed here.
on:
  workflow_run:
    workflows: ["PR prerelease candidate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: prerelease-publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:c7d3c512612f52805023cd38351081dad7e2729fc13d14b701e47c7c8bdd6615
  SKOPEO_VERSION: 1.22.2

jobs:
  resolve:
    name: Resolve trusted request and candidate provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
      label: ${{ steps.resolve.outputs.label }}
      label_tag: ${{ steps.resolve.outputs.label_tag }}
      request_run_id: ${{ steps.resolve.outputs.request_run_id }}
      request_artifact: ${{ steps.resolve.outputs.request_artifact }}
      candidate_run_id: ${{ steps.resolve.outputs.candidate_run_id }}
      candidate_run_attempt: ${{ steps.resolve.outputs.candidate_run_attempt }}
      candidate_artifact: ${{ steps.resolve.outputs.candidate_artifact }}
      candidate_success: ${{ steps.resolve.outputs.candidate_success }}
    steps:
      - name: Checkout trusted publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: resolve
        name: Bind workflow run to one request, PR, and SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/ci/prerelease.py publish-resolve

  validate:
    name: Validate candidate strictly as untrusted data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: resolve
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      oci_sha256: ${{ steps.validate.outputs.oci_sha256 }}
      main_sha: ${{ steps.validate.outputs.main_sha }}
      validated_artifact: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Require successful low-trust candidate job
        if: needs.resolve.outputs.candidate_success != 'true'
        run: |
          echo "::error::PR prerelease candidate did not complete successfully; nothing will be published"
          exit 1

      - name: Download trusted request metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.request_artifact }}
          path: ${{ runner.temp }}/request
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.request_run_id }}

      - name: Download low-trust candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}

      - name: Checkout trusted validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: validate
        name: Recheck request metadata, PR state, Gate, and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          LABEL_TAG: ${{ needs.resolve.outputs.label_tag }}
          REQUEST_RUN_ID: ${{ needs.resolve.outputs.request_run_id }}
          CANDIDATE_RUN_ID: ${{ needs.resolve.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.resolve.outputs.candidate_run_attempt }}
          REQUEST_DIR: ${{ runner.temp }}/request
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
          HANDOFF_DIR: ${{ runner.temp }}/validated
        run: python3 scripts/ci/prerelease.py publish-validate

      - name: Verify OCI platforms and labels without executing image payload
        env:
          REPOSITORY: ${{ github.repository }}
          SKOPEO_IMAGE: ${{ env.SKOPEO_IMAGE }}
          SKOPEO_VERSION: ${{ env.SKOPEO_VERSION }}
        run: >-
          python3 scripts/ci/verify_oci.py
          "${{ steps.validate.outputs.version }}"
          "${{ needs.resolve.outputs.sha }}"
          "$RUNNER_TEMP/validated/graphite-meter.oci.tar"

      - id: artifact-name
        name: Name trusted publication handoff
        run: echo "name=validated-prerelease-${{ needs.resolve.outputs.candidate_run_id }}" >>"$GITHUB_OUTPUT"

      - name: Upload trusted publication handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            ${{ runner.temp }}/validated/graphite-meter.oci.tar
            ${{ runner.temp }}/validated/trusted-validation.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  approval:
    name: Approve prerelease publication
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ghcr-release
    permissions: {}
    steps:
      - name: Publication authorization granted
        run: echo "::notice::protected release environment approved; final PR trust recheck starts next"

  recheck:
    name: Recheck mutable PR trust after approval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [resolve, validate, approval]
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout trusted recheck tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact PR head, current main, Gate, and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          EXPECTED_MAIN_SHA: ${{ needs.validate.outputs.main_sha }}
        run: python3 scripts/ci/prerelease.py publish-recheck

  publish:
    name: Publish exact prerelease tag
    needs: [resolve, validate, recheck]
    uses: ./.github/workflows/_publish-oci.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      packages: write
    with:
      artifact: ${{ needs.validate.outputs.validated_artifact }}
      tag: ${{ needs.validate.outputs.version }}
      expected_sha256: ${{ needs.validate.outputs.oci_sha256 }}
      source_sha: ${{ needs.resolve.outputs.sha }}
      trusted_main_sha: ${{ needs.validate.outputs.main_sha }}
      pr_number: ${{ needs.resolve.outputs.pr }}

  cleanup:
    name: Clean up one-use request label
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, validate, approval, recheck, publish]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted cleanup tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Remove only matching temporary label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          LABEL_NAME: ${{ needs.resolve.outputs.label }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 scripts/ci/prerelease.py cleanup
