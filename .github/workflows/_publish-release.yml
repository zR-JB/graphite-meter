name: _Publish stable GitHub Release

on:
  workflow_call:
    inputs:
      artifact:
        description: Artifact in the caller run containing all release assets
        required: true
        type: string
      tag:
        description: Stable Git tag including leading v
        required: true
        type: string
      target_sha:
        description: Exact protected-main commit that the release tag must target
        required: true
        type: string

concurrency:
  group: publish-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/release-assets

      - name: Stage, verify, and publish release transaction
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "invalid stable tag: $TAG" >&2; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid target SHA" >&2; exit 1; }

          umask 077
          local_map=$(mktemp)
          remote_map=$(mktemp)
          err=$(mktemp)
          auth_header=$(mktemp)
          printf 'Authorization: Bearer %s\n' "$GH_TOKEN" >"$auth_header"
          trap 'rm -f "$local_map" "$remote_map" "$err" "$auth_header"' EXIT

          : >"$local_map"
          asset_count=0
          while IFS= read -r -d '' entry; do
            name=${entry##*/}
            [[ -f "$entry" && ! -L "$entry" ]] || {
              echo "release handoff contains a non-regular entry: $name" >&2
              exit 1
            }
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || {
              echo "release handoff contains an unsafe asset name: $name" >&2
              exit 1
            }
            digest=$(sha256sum "$entry" | awk '{print $1}')
            printf '%s\tsha256:%s\n' "$name" "$digest" >>"$local_map"
            asset_count=$((asset_count + 1))
          done < <(find "$assets" -mindepth 1 -maxdepth 1 -print0)
          ((asset_count > 0)) || { echo "release artifact is empty" >&2; exit 1; }
          LC_ALL=C sort -o "$local_map" "$local_map"

          version=${TAG#v}
          source_asset="graphite-meter_${version}_third-party-source.tar.gz"
          awk -F '\t' -v name="$source_asset" '$1 == name { found=1 } END { exit found ? 0 : 1 }' "$local_map" || {
            echo "release handoff is missing required third-party source asset: $source_asset" >&2
            exit 1
          }
          source_notice=$(printf '%s\n\n%s\n\n%s' \
            '## Source availability' \
            "Graphite Meter source for this release is the repository snapshot at tag **$TAG** (commit **$TARGET_SHA**). GitHub provides that tagged project source below as **Source code (zip)** and **Source code (tar.gz)**." \
            "Source for third-party components included in the distributed artifacts is attached as **$source_asset**. Together, the tagged repository source and that archive form the source offer for this release.")

          resolve_tag_target() {
            ref_json=$1
            object_type=$(jq -r '.object.type' <<<"$ref_json")
            object_sha=$(jq -r '.object.sha' <<<"$ref_json")
            case "$object_type" in
              commit) printf '%s\n' "$object_sha" ;;
              tag)
                tag_json=$(gh api "repos/$REPOSITORY/git/tags/$object_sha")
                [[ $(jq -r '.object.type' <<<"$tag_json") == commit ]] || {
                  echo "release tag does not ultimately reference a commit" >&2
                  exit 1
                }
                jq -r '.object.sha' <<<"$tag_json"
                ;;
              *) echo "unexpected tag object type: $object_type" >&2; exit 1 ;;
            esac
          }

          # A pre-existing tag is acceptable only when it already names the exact source SHA.
          if tag_ref=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" 2>"$err"); then
            resolved=$(resolve_tag_target "$tag_ref")
            [[ "$resolved" == "$TARGET_SHA" ]] || {
              echo "$TAG already exists at $resolved, expected $TARGET_SHA" >&2
              exit 1
            }
          elif ! grep -Eiq 'HTTP 404|Not Found' "$err"; then
            cat "$err" >&2
            exit 1
          fi
          : >"$err"

          # The by-tag endpoint only returns published releases. Use the authenticated
          # release list so a retry can deterministically resume an existing draft.
          release_pages=$(gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100")
          matches=$(jq -c --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]' <<<"$release_pages")
          match_count=$(jq -r 'length' <<<"$matches")
          if [[ "$match_count" -gt 1 ]]; then
            echo "multiple releases unexpectedly use tag $TAG" >&2
            exit 1
          elif [[ "$match_count" -eq 1 ]]; then
            release=$(jq -c '.[0]' <<<"$matches")
            release_id=$(jq -r '.id' <<<"$release")
            draft=$(jq -r '.draft' <<<"$release")
            prerelease=$(jq -r '.prerelease' <<<"$release")
            [[ "$prerelease" == false ]] || { echo "$TAG already exists as a prerelease" >&2; exit 1; }
            if [[ "$draft" == false ]]; then
              gh api --paginate "repos/$REPOSITORY/releases/$release_id/assets?per_page=100" \
                --jq '.[] | [.name, (.digest // "")] | @tsv' | LC_ALL=C sort >"$remote_map"
              cmp -s "$local_map" "$remote_map" || {
                echo "$TAG is published but asset names/digests differ" >&2
                diff -u "$local_map" "$remote_map" >&2 || true
                exit 1
              }
              tag_ref=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")
              [[ $(resolve_tag_target "$tag_ref") == "$TARGET_SHA" ]] || {
                echo "$TAG published release tag target changed" >&2
                exit 1
              }
              published_body=$(jq -r '.body // ""' <<<"$release")
              [[ "$published_body" == "$source_notice"* ]] || {
                echo "$TAG is published but its source-availability notice is missing or stale" >&2
                exit 1
              }
              echo "::notice::$TAG is already published with the exact expected source, assets, and source notice"
              exit 0
            fi
          else
            payload=$(jq -nc --arg tag "$TAG" --arg sha "$TARGET_SHA" --arg body "$source_notice" '{tag_name:$tag,target_commitish:$sha,draft:true,prerelease:false,generate_release_notes:true,body:$body}')
            release=$(gh api --method POST "repos/$REPOSITORY/releases" --input - <<<"$payload")
            release_id=$(jq -r '.id' <<<"$release")
          fi

          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo "invalid release ID" >&2; exit 1; }
          current=$(gh api "repos/$REPOSITORY/releases/$release_id")
          [[ $(jq -r '.tag_name' <<<"$current") == "$TAG" ]] || { echo "release ID/tag mismatch" >&2; exit 1; }
          [[ $(jq -r '.draft' <<<"$current") == true ]] || { echo "$TAG must remain draft during asset verification" >&2; exit 1; }
          current_body=$(jq -r '.body // ""' <<<"$current")
          if [[ "$current_body" != "$source_notice"* ]]; then
            if grep -Fq '## Source availability' <<<"$current_body"; then
              echo "$TAG draft contains a stale source-availability notice" >&2
              exit 1
            fi
            if [[ -n "$current_body" ]]; then
              updated_body=$(printf '%s\n\n%s' "$source_notice" "$current_body")
            else
              updated_body=$source_notice
            fi
            body_payload=$(jq -nc --arg body "$updated_body" '{body:$body}')
            current=$(gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" --input - <<<"$body_payload")
          fi

          # Refresh drafts from a clean asset set so retries cannot retain stale files.
          while IFS= read -r asset_id; do
            [[ -n "$asset_id" ]] || continue
            gh api --method DELETE "repos/$REPOSITORY/releases/assets/$asset_id" >/dev/null
          done < <(gh api --paginate "repos/$REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].id')

          # Upload to the exact draft release ID. Keep the token out of process
          # arguments by storing the Authorization header in a mode-0600 temp file.
          upload_base=$(jq -r '.upload_url' <<<"$current" | sed 's/{.*$//')
          [[ "$upload_base" == https://uploads.github.com/* ]] || { echo "unexpected release upload URL" >&2; exit 1; }
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            encoded_name=$(jq -nr --arg name "$name" '$name | @uri')
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "@$auth_header" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$assets/$name" \
              "${upload_base}?name=${encoded_name}" >/dev/null
          done < <(cut -f1 "$local_map")

          gh api --paginate "repos/$REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name, (.digest // "")] | @tsv' | LC_ALL=C sort >"$remote_map"
          cmp -s "$local_map" "$remote_map" || {
            echo "draft release asset names/digests do not match verified local files" >&2
            diff -u "$local_map" "$remote_map" >&2 || true
            exit 1
          }

          tag_ref=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")
          resolved=$(resolve_tag_target "$tag_ref")
          [[ "$resolved" == "$TARGET_SHA" ]] || {
            echo "$TAG resolves to $resolved, expected $TARGET_SHA" >&2
            exit 1
          }

          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" \
            --input - <<'JSON' >/dev/null
          {"draft":false,"prerelease":false,"make_latest":"legacy"}
          JSON

          published=$(gh api "repos/$REPOSITORY/releases/$release_id")
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and .prerelease == false' <<<"$published" >/dev/null
          published_body=$(jq -r '.body // ""' <<<"$published")
          [[ "$published_body" == "$source_notice"* ]] || {
            echo "published release lost its source-availability notice" >&2
            exit 1
          }
          echo "::notice::published $TAG with verified SHA-256 assets and source notice; latest selection uses GitHub legacy SemVer ordering"
