name: Advisories

# Advisory databases change without a commit, so main is checked daily; a new advisory also fails every code PR.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: '0'

jobs:
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Rust, pinned cargo-deny and the client's dependencies
        uses: ./.github/actions/setup-project
        with: {rust: 'true', cargo-deny: 'true', bun: 'true', client-deps: 'true', cache: 'false'}
      - name: Fetch the live advisory database and the locked crates
        run: mise run rust-deny-fetch
      - name: Check the locked Rust dependencies against the live advisory database
        working-directory: rust
        run: cargo deny --locked --offline check advisories
      - name: Require a verdict on every advisory the Cargo forks inherit
        run: python3 -m scripts.legal.check_fork_advisories
      - name: Check the client's locked dependencies against the registry advisory database
        run: mise run client-audit
