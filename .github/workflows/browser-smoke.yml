name: Browser Beta smoke
run-name: Browser Beta smoke · ${{ github.ref_name }}

on:
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: '0'

concurrency:
  group: browser-beta-smoke
  cancel-in-progress: false

jobs:
  server:
    name: Build server and resolve Beta versions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      chrome: ${{ steps.browsers.outputs.chrome }}
      firefox: ${{ steps.browsers.outputs.firefox }}
      firefox_sha256: ${{ steps.browsers.outputs.firefox_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: browsers
        name: Resolve current Beta releases
        run: python3 scripts/ci/toolchains.py latest-browsers --beta >> "$GITHUB_OUTPUT"
      - name: Set up pinned Buildx
        uses: ./.github/actions/setup-buildx
      - name: Build the reviewed amd64 server
        run: |
          docker buildx build --file container/Dockerfile --platform linux/amd64 --build-arg VERSION=0.0.0-ci \
            --build-arg PROFILE=ci --build-arg GM_CLIENT_VALIDATE=0 --target server \
            --output "type=local,dest=$RUNNER_TEMP/server" .
      - name: Upload the server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: ${{ runner.temp }}/server/graphite-meter
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Signed-in WebTransport (${{ matrix.browser }} Beta)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: server
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up the browser test tools
        uses: ./.github/actions/setup-project
        with: {bun: 'true', client-deps: 'true', cache: 'false'}
      - id: browser
        name: Install the selected Beta release
        uses: ./.github/actions/setup-browser
        with:
          browser: ${{ matrix.browser }}
          version: ${{ matrix.browser == 'chrome' && needs.server.outputs.chrome || needs.server.outputs.firefox }}
          firefox-sha256: ${{ needs.server.outputs.firefox_sha256 }}
      - name: Download the server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: ${{ runner.temp }}/server
      - name: Verify signed-in WebTransport across origins
        env:
          GM_E2E_HOST_LOOPBACK: '1'
          GM_E2E_SERVER_BIN: ${{ runner.temp }}/server/graphite-meter
          GM_E2E_BROWSER: ${{ matrix.browser }}
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.browser.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ matrix.browser == 'chrome' && needs.server.outputs.chrome || '' }}
          GM_FIREFOX_PATH: ${{ steps.browser.outputs.firefox-path }}
          GM_EXPECTED_FIREFOX_VERSION: ${{ matrix.browser == 'firefox' && needs.server.outputs.firefox || '' }}
        run: |
          chmod +x "$GM_E2E_SERVER_BIN"
          mise run e2e "$GM_E2E_SERVER_BIN" network-smoke
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-smoke-${{ matrix.browser }}
          retention-days: 7
          path: |
            client/test-results/webview
            client/test-results/servers
