name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: '0'

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        name: Determine whether code changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml
          predicate-quantifier: every

  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up the checks' toolchains
        uses: ./.github/actions/setup-project
        with:
          python: 'true'
          gitleaks: 'true'
          bun: ${{ needs.plan.outputs.code }}
          client-deps: ${{ needs.plan.outputs.code }}
          biome: ${{ needs.plan.outputs.code }}
      - parallel:
          - name: Enforce repository and workflow security policy
            run: mise run workflow-check
          - name: Type-check and test the release, legal and workflow tooling
            run: mise run pipeline-test
          - name: Scan repository with pinned Gitleaks
            run: mise run secret-scan-ci
          - name: Check the browser client
            if: needs.plan.outputs.code == 'true'
            run: mise run client-ci

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.code == 'true'
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Rust, pinned cargo-deny and cargo-nextest
        uses: ./.github/actions/setup-project
        with: {rust: 'true', cargo-deny: 'true', cargo-nextest: 'true'}
      # Target build scripts compile C; only these checks use Ubuntu's unpinned cross compilers, which install while
      # the workspace checks run. A stalled mirror fails the step in minutes instead of holding the job to its limit.
      - id: cross-compilers
        name: Install C cross compilers for the target checks
        background: true
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 mingw-w64-x86-64-dev \
            musl-tools gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Check Rust formatting, dependency policy, lints and tests
        run: mise run rust-check
      - name: Verify the fork pins against their branches, upstream tags and reviewed change sets
        run: python3 -m scripts.legal.check_git_sources --verify
      - name: Gate delayed-link HTTP/3 and WebTransport downloads
        run: mise run delayed-downloads
      - wait: cross-compilers
      - name: Check the shipped client and server targets
        run: mise run rust-check-targets

  rust-windows:
    name: Rust checks on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.code == 'true'
    defaults:
      run: {shell: bash}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Tests compare checked-in text byte for byte.
      - name: Check out text with its committed line endings
        run: git config --global core.autocrlf false
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Rust
        uses: ./.github/actions/setup-project
        with: {rust: 'true'}
      - name: Run the client, net and legal crates' unit and process tests
        working-directory: rust
        run: cargo test --locked -p graphite-meter-client -p graphite-meter-net -p graphite-meter-legal --lib --tests
      - name: Check that the server builds for Windows
        working-directory: rust
        run: cargo check --locked -p graphite-meter-server

  # The browser tests start from this amd64 server instead of waiting for both images.
  server:
    name: E2E server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.code == 'true'
    env:
      VERSION: 0.0.0-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned Buildx
        uses: ./.github/actions/setup-buildx
      - name: Build the image's amd64 server
        run: |
          docker buildx build --file container/Dockerfile --target server --platform linux/amd64 \
            --build-arg VERSION="$VERSION" --build-arg PROFILE=ci --build-arg GM_CLIENT_VALIDATE=0 \
            --output "type=local,dest=$RUNNER_TEMP/server" .
          mv "$RUNNER_TEMP/server/graphite-meter" "$RUNNER_TEMP/graphite-meter-server"
      - name: Upload the amd64 server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: ${{ runner.temp }}/graphite-meter-server
          if-no-files-found: error
          retention-days: 7

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.code == 'true'
    env:
      VERSION: 0.0.0-ci
      REPOSITORY: ${{ github.repository }}
      REVISION: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Only the arm64 image's checks run arm64 code, so emulation sets up while the image builds.
      - id: qemu
        name: Set up arm64 emulation
        background: true
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # setup-qemu runs this image privileged to register binfmt. Pin the
          # secondary image as tightly as the Action that launches it.
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: 'false'
      - name: Set up pinned Buildx
        uses: ./.github/actions/setup-buildx
      # The OCI archive builds each architecture's server once; the loaded images and the source offers reuse its
      # layers. The ci profile leaves out LTO and PGO, and the checks job checks the browser app.
      - name: Build the amd64 and arm64 server image with reviewed notices and export its source offers
        run: |
          build() {
            docker buildx build --file container/Dockerfile \
              --build-arg VERSION="$VERSION" --build-arg PROFILE=ci --build-arg GM_CLIENT_VALIDATE=0 \
              --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
              --label "org.opencontainers.image.revision=$REVISION" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label org.opencontainers.image.licenses=AGPL-3.0-or-later "$@" .
          }
          mkdir -p "$RUNNER_TEMP/image"
          build --target server --platform linux/amd64,linux/arm64 --provenance mode=max \
            --output "type=oci,dest=$RUNNER_TEMP/image/graphite-meter.oci.tar"
          # Docker's image store cannot load the attestation manifests.
          for arch in amd64 arm64; do
            build --target server --platform "linux/$arch" --provenance false --load --tag "graphite-meter:$arch"
          done
          build --target server-artifacts --platform linux/amd64,linux/arm64 --provenance false \
            --output "type=local,dest=$RUNNER_TEMP/image/server-export"
      # The arm64 image runs under emulation.
      - wait: qemu
      - name: Check both images' files, server, browser app and allocator setting
        env:
          GM_CLIENT_REVISION: source
        run: |
          for arch in amd64 arm64; do
            scripts/verify-container.sh "graphite-meter:$arch"
          done
      - name: Upload the image and its source offers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 7

  tui:
    name: Client archive (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: plan
    if: needs.plan.outputs.code == 'true'
    # One runner per TUI platform of rust/Cargo.toml; staging refuses a missing or extra archive.
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64, windows/amd64]
    env:
      VERSION: 0.0.0-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - parallel:
          - name: Set up pinned mise and Python
            uses: ./.github/actions/setup-project
          - id: buildx
            name: Set up pinned Buildx
            uses: ./.github/actions/setup-buildx
      # The release build with the ci profile, as the image's: no LTO or PGO, no CI cache, the release request's BuildKit.
      - name: Build the client archive and source offer in the pinned builder
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          PROFILE: ci
          RELEASE_DIST: ${{ runner.temp }}/tui
          TUI_PLATFORM: ${{ matrix.platform }}
        run: mise run tui-package "$VERSION"
      - name: Run the amd64 client out of its archive on the runner
        if: matrix.platform == 'linux/amd64'
        env:
          RELEASE_DIST: ${{ runner.temp }}/tui
        run: python3 -m scripts.package "$VERSION" --output "$RELEASE_DIST" --check
      - name: Upload the client archive and source offer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-${{ strategy.job-index }}
          path: ${{ runner.temp }}/tui/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Stages and verifies this run's builds as a release request stages and the release verifies them.
  release-staging:
    name: Release staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [plan, image, tui]
    if: needs.plan.outputs.code == 'true'
    env:
      VERSION: 0.0.0-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned mise and Python
        uses: ./.github/actions/setup-project
      - name: Download the image and its source offers from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Download the client archives and source offers from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tui-*
          merge-multiple: true
          path: ${{ runner.temp }}/tui
      - name: Stage exactly the release files out of the exports
        env:
          OCI_ARCHIVE: ${{ runner.temp }}/image/graphite-meter.oci.tar
          SERVER_EXPORT: ${{ runner.temp }}/image/server-export
          TUI_EXPORT: ${{ runner.temp }}/tui
          OUT_DIR: ${{ runner.temp }}/staged
        run: python3 scripts/ci/assets.py stage
      - name: Verify the image, the client archives and the source offer as the release does
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          PROFILE: ci
          STAGED_DIR: ${{ runner.temp }}/staged
        run: python3 scripts/ci/assets.py check

  e2e:
    name: Browser E2E (${{ matrix.browser }}, ${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan, server]
    if: needs.plan.outputs.code == 'true'
    # The surface-reversal file runs its widths serially under CPU throttling, so it takes a Chrome runner of its own;
    # tests that need the DevTools Protocol run in Chrome only.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: chrome, group: reversals}
          - {browser: chrome, group: heavy}
          - {browser: chrome, group: rest-1}
          - {browser: chrome, group: rest-2}
          - {browser: firefox, group: heavy}
          - {browser: firefox, group: rest-1}
          - {browser: firefox, group: rest-2}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # The runner's Python reads the pins, so the browser installs while the toolchain sets up.
      - id: pins
        name: Read the pinned browsers
        run: |
          for pin in chrome firefox firefox_sha256; do
            value=$(python3 scripts/ci/toolchains.py get "browser.$pin")
            printf '%s=%s\n' "${pin//_/-}" "$value"
          done >> "$GITHUB_OUTPUT"
      - parallel:
          - name: Set up E2E toolchain
            uses: ./.github/actions/setup-project
            with: {bun: 'true', client-deps: 'true'}
          - id: chrome
            name: Install pinned Chrome for Testing
            if: matrix.browser == 'chrome'
            uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
            with:
              chrome-version: ${{ steps.pins.outputs.chrome }}
              install-dependencies: true
          # Mozilla's release archive, held to the SHA-256 mise.toml pins beside its version.
          - id: firefox
            name: Install pinned Firefox
            if: matrix.browser == 'firefox'
            env:
              FIREFOX_VERSION: ${{ steps.pins.outputs.firefox }}
              FIREFOX_SHA256: ${{ steps.pins.outputs.firefox-sha256 }}
            run: |
              archive="$RUNNER_TEMP/firefox.tar.xz"
              curl -fsSL --retry 3 -o "$archive" \
                "https://ftp.mozilla.org/pub/firefox/releases/$FIREFOX_VERSION/linux-x86_64/en-US/firefox-$FIREFOX_VERSION.tar.xz"
              printf '%s  %s\n' "$FIREFOX_SHA256" "$archive" | sha256sum -c -
              tar -xJf "$archive" -C "$RUNNER_TEMP"
              printf 'firefox-path=%s\n' "$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_OUTPUT"
          - name: Download the amd64 server from this run
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
              name: server
              path: ${{ runner.temp }}/image
      - name: Restore the server's executable mode
        run: chmod +x "$RUNNER_TEMP/image/graphite-meter-server"
      # Chrome for Testing is an unpacked archive without a setuid sandbox; the script runs it with --no-sandbox.
      - name: Check Chromium's HTTP/3, WebTransport and session close codes against the image's sharded server
        if: matrix.group == 'heavy'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 rust/interop/browser.py --server image
      - name: Run the browser against one local fleet of the image's server
        env:
          GM_E2E_BROWSER: ${{ matrix.browser }}
          # Chrome for Testing is an unpacked archive without a setuid sandbox;
          # this read-only, secret-free job therefore uses Chromium's CI mode.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ matrix.browser == 'chrome' && steps.pins.outputs.chrome || '' }}
          GM_FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
          GM_EXPECTED_FIREFOX_VERSION: ${{ matrix.browser == 'firefox' && steps.pins.outputs.firefox || '' }}
          GROUP: ${{ matrix.group }}
        run: mise run e2e "$RUNNER_TEMP/image/graphite-meter-server" "$GROUP"
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ matrix.browser }}-${{ matrix.group }}
          retention-days: 7
          path: |
            client/test-results/webview
            client/test-results/servers
            ${{ runner.temp }}/browser-*/*.log
            ${{ runner.temp }}/browser-*/*.json
          if-no-files-found: ignore

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [plan, checks, rust, rust-windows, server, image, tui, release-staging, e2e]
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          {
            printf '### CI Gate\n\n| Job | Result |\n|---|---|\n'
            jq -r 'to_entries[] | "| \(.key) | `\(.value.result)` |"' <<<"$NEEDS"
          } >>"$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null || {
            echo "::error::CI Gate failed; inspect the summary table for the failing job"
            exit 1
          }
