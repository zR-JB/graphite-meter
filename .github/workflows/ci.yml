name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Path filtering happens per-job (via the `changes` job) rather than with a
# workflow-level `paths:` filter, for two reasons: skipped jobs still report a
# status so required PR checks can't hang, and release.yml relies on a CI run
# existing for every push to main.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      tui: ${{ steps.filter.outputs.tui }}
      client: ${{ steps.filter.outputs.client }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      # Checkout is needed for push events; PR events are diffed via the API.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # api/ holds the wire test-vector corpus read by both go and client
          # tests. The tui filter is the TUI binary's actual dependency
          # closure (go list -deps ./cmd/graphite-meter-client).
          filters: |
            workflow: &workflow
              - ".github/workflows/ci.yml"
            go:
              - *workflow
              - "go/**"
              - "api/**"
            tui:
              - *workflow
              - "go/go.mod"
              - "go/go.sum"
              - "go/cmd/graphite-meter-client/**"
              - "go/internal/goclient/**"
              - "go/internal/wire/**"
            client:
              - *workflow
              - "client/**"
              - "api/**"
            smoke:
              - *workflow
              - "go/**"
              - "client/**"
              - "api/**"
              - "container/**"

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt violations:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      - name: go vet
        working-directory: go
        run: go vet ./...
      - name: go test
        working-directory: go
        run: go test -race -shuffle=on ./...

  goclient-cross-build:
    name: TUI cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.tui == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Catches cross-compile breaks (e.g. an accidental cgo/platform-specific
      # import) on every PR instead of only at release-tag time.
      - name: Build
        working-directory: go
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/graphite-meter-client

  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.client == 'true'
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('client/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Prettier
        run: bun run format:check
      - name: Type check
        run: bun run check
      - name: Tests
        run: bun test

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: container/Dockerfile
          load: true
          tags: graphite-meter:smoke
          # The Client job owns semantic checks and tests. Smoke only needs
          # the integration artifact, so avoid repeating svelte-check/tsc
          # inside Docker while still running the real bundle step.
          build-args: |
            VERSION=0.0.0-ci
            GM_CLIENT_BUILD_LABEL=ci-${{ github.sha }}
            GM_CLIENT_VALIDATE=0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: docker run -d --name gm -p 8765:8765 graphite-meter:smoke
      - name: Wait for ready
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8765/preflight && exit 0
            sleep 1
          done
          echo "::error::server never became ready"
          exit 1
      - name: Smoke /preflight
        run: |
          curl -fsS http://localhost:8765/preflight | tee /tmp/preflight.json
          jq -e '
            .engineVersion == "0.0.0-ci"
            and .capabilities.transports.websocket == true
            and .capabilities.endpoints.download == "/download"
            and (.server.port | type == "number")
          ' /tmp/preflight.json
      - name: Smoke SPA index
        run: |
          curl -fsS http://localhost:8765/ | grep -qi '<script' || {
            echo "::error::/ did not return the built SPA"
            exit 1
          }
      - name: Dump logs on failure
        if: failure()
        run: docker logs gm || true
