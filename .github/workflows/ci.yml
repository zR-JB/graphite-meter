name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:17da3ac5cadf2b27a3dcf7dea857c4cea558ef757641725fc0eec560030057b3
  SKOPEO_VERSION: 1.22.2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan and repository safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      go: ${{ steps.filter.outputs.go }}
      browser: ${{ steps.filter.outputs.browser }}
      tui: ${{ steps.filter.outputs.tui }}
      integration: ${{ steps.filter.outputs.integration }}
      smoke: ${{ steps.filter.outputs.smoke }}
      release: ${{ steps.filter.outputs.release }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce repository and workflow security policy
        run: python3 scripts/ci/workflow_policy.py

      - name: Test privileged release transaction
        run: python3 scripts/ci/test_release_transaction.py

      - id: filter
        name: Determine affected CI areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Summarize CI plan
        env:
          CORE: ${{ steps.filter.outputs.core }}
          GO: ${{ steps.filter.outputs.go }}
          BROWSER: ${{ steps.filter.outputs.browser }}
          TUI: ${{ steps.filter.outputs.tui }}
          INTEGRATION: ${{ steps.filter.outputs.integration }}
          SMOKE: ${{ steps.filter.outputs.smoke }}
          RELEASE: ${{ steps.filter.outputs.release }}
          SECURITY: ${{ steps.filter.outputs.security }}
        run: |
          cat >>"$GITHUB_STEP_SUMMARY" <<EOF_SUMMARY
          ### CI execution plan

          Source: \`${GITHUB_SHA}\`

          | Area | Selected |
          |---|---|
          | Core | \`$CORE\` |
          | Go race/coverage | \`$GO\` |
          | Browser | \`$BROWSER\` |
          | TUI cross-build | \`$TUI\` |
          | Integration | \`$INTEGRATION\` |
          | Container smoke | \`$SMOKE\` |
          | Release package checks | \`$RELEASE\` |
          | Vulnerability scan | \`$SECURITY\` |
          | Secret scan | always |
          EOF_SUMMARY

  core:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.core == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up core toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', staticcheck: 'true'}
      - name: Run deterministic repository gate
        run: just check

  go:
    name: Go race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.go == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Run race detector and coverage floor
        run: just server-race

  browser:
    name: Browser (Chromium WebView)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up browser test toolchain
        uses: ./.github/actions/setup-project
        with: {bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 152.0.7977.54
          install-dependencies: true
      - name: Verify pinned Chromium WebView launch
        env:
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: 152.0.7977.54
        run: cd client && bun run check:webview
      - name: Run Chromium WebView browser suite
        env:
          # Chrome for Testing is an unpacked archive without a setuid sandbox;
          # this read-only, secret-free job therefore uses Chromium's CI mode.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: just client-browser
      - name: Upload WebView failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webview-browser-failures
          path: client/test-results/webview
          if-no-files-found: ignore

  tui:
    name: TUI cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.tui == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Cross-build all supported TUI targets
        run: just tui-cross-build

  integration:
    name: Browser/server E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 152.0.7977.54
          install-dependencies: true
      - name: Verify pinned Chromium WebView launch
        env:
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: 152.0.7977.54
        run: cd client && bun run check:webview
      - name: Run browser/server transport E2E
        env:
          # See the browser job: the archive has no usable setuid sandbox.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: just client-e2e
      - name: Upload WebView failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webview-e2e-failures
          path: client/test-results/webview
          if-no-files-found: ignore

  smoke:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Just
        uses: ./.github/actions/setup-project
      - name: Build and verify local container
        run: just container-smoke

  release:
    name: Release package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up release test toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - name: Build and verify representative release packages
        run: just release-check
      - name: Verify pinned Skopeo runtime contract
        env:
          SKOPEO_IMAGE: ${{ env.SKOPEO_IMAGE }}
          SKOPEO_VERSION: ${{ env.SKOPEO_VERSION }}
        run: python3 scripts/ci/verify_oci.py --check-skopeo

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.security == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned vulnerability scanner and client dependencies
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', govulncheck: 'true'}
      - name: Run Go and client vulnerability scans
        run: |
          just security
          just client-audit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Just
        uses: ./.github/actions/setup-project
      - name: Scan repository with pinned Gitleaks image
        run: just secret-scan-ci

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [plan, core, go, browser, tui, integration, smoke, release, security, secret-scan]
    steps:
      - name: Summarize and require all selected jobs
        env:
          PLAN: ${{ needs.plan.result }}
          CORE: ${{ needs.core.result }}
          GO: ${{ needs.go.result }}
          BROWSER: ${{ needs.browser.result }}
          TUI: ${{ needs.tui.result }}
          INTEGRATION: ${{ needs.integration.result }}
          SMOKE: ${{ needs.smoke.result }}
          RELEASE: ${{ needs.release.result }}
          SECURITY: ${{ needs.security.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          set -eu
          cat >>"$GITHUB_STEP_SUMMARY" <<EOF_SUMMARY
          ### CI Gate

          | Job | Result |
          |---|---|
          | Plan | \`$PLAN\` |
          | Core | \`$CORE\` |
          | Go | \`$GO\` |
          | Browser | \`$BROWSER\` |
          | TUI | \`$TUI\` |
          | Integration | \`$INTEGRATION\` |
          | Container smoke | \`$SMOKE\` |
          | Release packages | \`$RELEASE\` |
          | Security | \`$SECURITY\` |
          | Secret scan | \`$SECRET_SCAN\` |
          EOF_SUMMARY
          failed=0
          for result in "$PLAN" "$CORE" "$GO" "$BROWSER" "$TUI" "$INTEGRATION" "$SMOKE" "$RELEASE" "$SECURITY" "$SECRET_SCAN"; do
            case "$result" in success|skipped) ;; *) failed=1 ;; esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::CI Gate failed; inspect the summary table for the failing job"
            exit 1
          fi
          echo "::notice::CI Gate passed for $GITHUB_SHA"
