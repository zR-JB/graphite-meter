name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: '0'
  SKOPEO_IMAGE: quay.io/containers/skopeo:v1.22.3-immutable@sha256:f45eb1e14223a5ba0da4246274679a083653dab1402acc1fcb70a6339b50cf00
  SKOPEO_VERSION: 1.22.3

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan and repository safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ github.event_name == 'push' || steps.filter.outputs.core == 'true' }}
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' }}
      tui: ${{ github.event_name == 'push' || steps.filter.outputs.tui == 'true' }}
      e2e: ${{ github.event_name == 'push' || steps.filter.outputs.e2e == 'true' }}
      smoke: ${{ github.event_name == 'push' || steps.filter.outputs.smoke == 'true' }}
      release: ${{ github.event_name == 'push' || steps.filter.outputs.release == 'true' }}
      security: ${{ github.event_name == 'push' || steps.filter.outputs.security == 'true' }}
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python verification tools
        uses: ./.github/actions/setup-project
        with: {python: 'true'}

      - name: Enforce repository and workflow security policy
        run: mise run workflow-check

      - name: Type-check and test tooling, pipeline and legal boundaries
        run: mise run pipeline-test

      - id: filter
        name: Determine affected CI areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Summarize CI plan
        env:
          CHANGES: ${{ github.event_name == 'push' && 'every area on main' || steps.filter.outputs.changes }}
        run: |
          printf '### CI plan for `%s`\n\nSelected: `%s`; secret scan always runs.\n' \
            "$GITHUB_SHA" "$CHANGES" >>"$GITHUB_STEP_SUMMARY"

  core:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.core == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up core toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', staticcheck: 'true', python: 'true'}
      - name: Refresh reviewed legal metadata
        run: mise run legal-generate
      - name: Run component checks
        run: mise run core-check

  go:
    name: Go race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.go == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Run race detector and coverage floor
        run: mise run server-race

  tui:
    name: TUI cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.tui == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Cross-build all supported TUI targets
        run: mise run tui-cross-build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Run Chromium against one local server fleet
        env:
          # Chrome for Testing is an unpacked archive without a setuid sandbox;
          # this read-only, secret-free job therefore uses Chromium's CI mode.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
        run: mise run e2e
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failures
          path: |
            client/test-results/webview
            client/test-results/servers
          if-no-files-found: ignore

  smoke:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up mise
        uses: ./.github/actions/setup-project
      - name: Build and verify local container
        run: mise run container-smoke

  release:
    name: Release package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up release test toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - name: Refresh reviewed legal metadata
        run: mise run legal-generate
      - name: Build and verify representative release packages
        run: mise run release-check
      - name: Verify pinned Skopeo runtime contract
        run: python3 scripts/ci/verify_oci.py --check-skopeo

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.security == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned vulnerability scanner and client dependencies
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', govulncheck: 'true'}
      - name: Run Go and client vulnerability scans
        run: |
          mise run security
          mise run client-audit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up mise
        uses: ./.github/actions/setup-project
      - name: Scan repository with pinned Gitleaks image
        run: mise run secret-scan-ci

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [plan, core, go, tui, e2e, smoke, release, security, secret-scan]
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          {
            printf '### CI Gate\n\n| Job | Result |\n|---|---|\n'
            jq -r 'to_entries[] | "| \(.key) | `\(.value.result)` |"' <<<"$NEEDS"
          } >>"$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null || {
            echo "::error::CI Gate failed; inspect the summary table for the failing job"
            exit 1
          }
