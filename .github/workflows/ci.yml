name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: '0'

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' }}
      deps: ${{ github.event_name == 'push' || steps.filter.outputs.deps == 'true' }}
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        name: Determine affected CI areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Summarize CI plan
        env:
          CHANGES: ${{ github.event_name == 'push' && 'every area on main' || steps.filter.outputs.changes }}
        run: |
          printf '### CI plan for `%s`\n\nSelected: `%s`; tooling and the secret scan always run.\n' \
            "$GITHUB_SHA" "$CHANGES" >>"$GITHUB_STEP_SUMMARY"

  tooling:
    name: Workflow policy and pipeline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Python verification tools
        uses: ./.github/actions/setup-project
        with: {python: 'true'}
      - name: Enforce repository and workflow security policy
        run: mise run workflow-check
      - name: Type-check and test tooling, pipeline and legal boundaries
        run: mise run pipeline-test

  core:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up core toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', staticcheck: 'true'}
      - name: Check legal outputs for drift
        run: mise run legal-check
      - name: Run component checks
        run: mise run core-check

  go:
    name: Go race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.go == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Run race detector and coverage floor
        run: mise run server-race

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Run Chromium against one local server fleet
        env:
          # Chrome for Testing is an unpacked archive without a setuid sandbox;
          # this read-only, secret-free job therefore uses Chromium's CI mode.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
        run: mise run e2e
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failures
          path: |
            client/test-results/webview
            client/test-results/servers
          if-no-files-found: ignore

  smoke:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up mise
        uses: ./.github/actions/setup-project
      - name: Build and verify local container
        run: mise run container-smoke

  release:
    name: Release package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up release test toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - name: Build and verify representative release packages
        run: mise run release-check

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.deps == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned vulnerability scanner and client dependencies
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', govulncheck: 'true'}
      - name: Run Go and client vulnerability scans
        run: |
          mise run security
          mise run client-audit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned Gitleaks
        uses: ./.github/actions/setup-project
        with: {gitleaks: 'true'}
      - name: Scan repository with pinned Gitleaks
        run: mise run secret-scan-ci

  rust:
    name: Experimental Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Python tools
        uses: ./.github/actions/setup-project
      - name: Install pinned experimental Rust toolchain
        run: |
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust/rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - id: cargo-cache
        name: Cache Cargo downloads, dependency policy tool and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            rust/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Install pinned cargo-deny
        working-directory: rust
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check experimental Rust implementation and dependency policy
        run: mise run rust-check
      - name: Keep only dependency builds in a new cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        working-directory: rust
        run: cargo clean -p graphite-meter-server -p graphite-meter-client -p graphite-meter-core -p graphite-meter-net -p graphite-meter-webtransport

  rust-interop:
    name: Experimental Rust interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go and Python interoperability tools
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Install pinned experimental Rust toolchain
        run: |
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust/rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - id: cargo-cache
        name: Cache Cargo downloads and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Rust server with unchanged Go clients
        run: python3 rust/tests/server_interop.py
      - name: Rust client with unchanged Go server
        run: python3 rust/tests/client_interop.py
      - name: Unchanged and current-only Go reliable-reset interoperability
        run: python3 rust/tests/interop.py
      - name: Delayed HTTP/3 and WebTransport downloads
        working-directory: rust
        run: cargo test --locked --release -p graphite-meter-server --test connection_faults quic_downloads_exceed_the_old_window_limit -- --ignored --nocapture
      - name: Keep only dependency builds in a new cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        working-directory: rust
        run: cargo clean -p graphite-meter-server -p graphite-meter-client -p graphite-meter-core -p graphite-meter-net -p graphite-meter-webtransport

  rust-e2e:
    name: Experimental Rust browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          cache-binary: 'false'
          buildkitd-flags: --log-level=info
      - name: Build the Rust server with reviewed browser and runtime notices
        run: docker buildx build --platform linux/amd64 --file container/Dockerfile.rust --target server-e2e --build-arg VERSION=0.0.0-dev --output type=local,dest=rust/target/e2e .
      - name: Run the shared browser suite against Rust
        env:
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
        run: python3 rust/tests/browser_interop.py --server rust/target/e2e/graphite-meter-server
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-e2e-failures
          path: |
            client/test-results/webview
            client/test-results/servers
          if-no-files-found: ignore

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [plan, tooling, core, go, e2e, smoke, release, security, secret-scan, rust, rust-interop, rust-e2e]
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          {
            printf '### CI Gate\n\n| Job | Result |\n|---|---|\n'
            jq -r 'to_entries[] | "| \(.key) | `\(.value.result)` |"' <<<"$NEEDS"
          } >>"$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null || {
            echo "::error::CI Gate failed; inspect the summary table for the failing job"
            exit 1
          }
