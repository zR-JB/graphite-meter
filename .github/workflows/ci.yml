name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: '0'

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' }}
      deps: ${{ github.event_name == 'push' || steps.filter.outputs.deps == 'true' }}
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
      rust-release: ${{ github.event_name == 'push' || steps.filter.outputs.rust-release == 'true' }}
      darwin: ${{ github.event_name == 'push' || steps.filter.outputs.darwin == 'true' }}
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        name: Determine affected CI areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Summarize CI plan
        env:
          CHANGES: ${{ github.event_name == 'push' && 'every area on main' || steps.filter.outputs.changes }}
        run: |
          printf '### CI plan for `%s`\n\nSelected: `%s`; tooling and the secret scan always run.\n' \
            "$GITHUB_SHA" "$CHANGES" >>"$GITHUB_STEP_SUMMARY"

  tooling:
    name: Workflow policy and pipeline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Python verification tools
        uses: ./.github/actions/setup-project
        with: {python: 'true'}
      - name: Enforce repository and workflow security policy
        run: mise run workflow-check
      - name: Type-check and test tooling, pipeline and legal boundaries
        run: mise run pipeline-test

  core:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up core toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', staticcheck: 'true'}
      - name: Check legal outputs for drift
        run: mise run legal-check
      - name: Run component checks
        run: mise run core-check

  go:
    name: Go race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.go == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Run race detector and coverage floor
        run: mise run server-race

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Run Chromium against one local server fleet
        env:
          # Chrome for Testing is an unpacked archive without a setuid sandbox;
          # this read-only, secret-free job therefore uses Chromium's CI mode.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
        run: mise run e2e
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failures
          path: |
            client/test-results/webview
            client/test-results/servers
          if-no-files-found: ignore

  smoke:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up mise
        uses: ./.github/actions/setup-project
      - name: Build and verify local container
        run: mise run container-smoke

  release:
    name: Release package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up release test toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - name: Build and verify representative release packages
        run: mise run release-check

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.deps == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned vulnerability scanner and client dependencies
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', govulncheck: 'true'}
      - name: Run Go and client vulnerability scans
        run: |
          mise run security
          mise run client-audit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned Gitleaks
        uses: ./.github/actions/setup-project
        with: {gitleaks: 'true'}
      - name: Scan repository with pinned Gitleaks
        run: mise run secret-scan-ci

  rust:
    name: Experimental Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Rust, pinned cargo-deny and cargo-nextest
        uses: ./.github/actions/setup-project
        with: {rust: 'true', cargo-deny: 'true', cargo-nextest: 'true'}
      - name: Check experimental Rust implementation and dependency policy
        run: mise run rust-check
      - name: Verify the Cargo fork pins against their branches, upstream tags and reviewed change sets
        run: python3 -m scripts.legal.check_git_sources --verify
      # ring compiles C for each target: mingw-w64 for Windows, the host GCC for x86_64 musl.
      - name: Install the pinned builder's Windows cross toolchain packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 mingw-w64-x86-64-dev
      - name: Check the Windows and musl TUIs, the HTTP/3 codec without I/O and the fuzz targets
        run: mise run rust-check-targets
      - name: Keep only dependency builds in a new cache
        run: mise run rust-cache-trim

  rust-interop:
    name: Experimental Rust interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go, Python, Rust and cargo-nextest interoperability tools
        uses: ./.github/actions/setup-project
        with: {go: 'true', rust: 'true', cargo-nextest: 'true'}
      - name: Rust server with unchanged Go clients
        run: python3 rust/tests/server_interop.py
      - name: Rust client with unchanged Go server
        run: python3 rust/tests/client_interop.py
      - name: Unchanged and current-only Go reliable-reset interoperability
        run: python3 rust/tests/interop.py
      - name: Delayed HTTP/3 and WebTransport downloads
        run: mise run rust-delayed-downloads
      - name: Keep only dependency builds in a new cache
        run: mise run rust-cache-trim

  rust-e2e:
    name: Experimental Rust browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          cache-binary: 'false'
          buildkitd-flags: --log-level=info
      - name: Build the Rust server image with reviewed browser and runtime notices
        run: >-
          docker buildx build --platform linux/amd64 --file container/Dockerfile.rust --target server
          --build-arg VERSION=0.0.0-dev --build-arg PROFILE=ci --label org.opencontainers.image.licenses=AGPL-3.0-or-later
          --load --tag graphite-meter-rust:smoke .
      - name: Smoke-test the Rust server image like the Go image
        env:
          VERSION: 0.0.0-dev
          ENGINE_VERSION: 0.0.0-dev-rust
          GM_CLIENT_REVISION: source
        run: scripts/verify-container.sh graphite-meter-rust:smoke
      - name: Run the shared browser suite against the image's server
        env:
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
        run: |
          docker create --name rust-e2e graphite-meter-rust:smoke
          docker cp rust-e2e:/graphite-meter "$RUNNER_TEMP/graphite-meter-server"
          python3 rust/tests/browser_interop.py --server "$RUNNER_TEMP/graphite-meter-server"
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-e2e-failures
          path: |
            client/test-results/webview
            client/test-results/servers
          if-no-files-found: ignore

  rust-release:
    name: Experimental Rust release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: plan
    if: needs.plan.outputs.rust-release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned mise and Python
        uses: ./.github/actions/setup-project
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          cache-binary: 'false'
          buildkitd-flags: --log-level=info
      # A release request's exports with its provenance; only the arm64 server is left out.
      - name: Export the Linux and Windows TUIs as a release request does
        run: >-
          docker buildx build --platform linux/amd64 --file container/Dockerfile.rust --target tui-artifacts
          --build-arg VERSION=0.0.0-ci --provenance mode=max --output "type=local,dest=$RUNNER_TEMP/rust-export/tui" .
      - name: Export the amd64 server source as a release request does
        run: >-
          docker buildx build --platform linux/amd64 --file container/Dockerfile.rust --target server-artifacts
          --build-arg VERSION=0.0.0-ci --build-arg GM_CLIENT_VALIDATE=0 --provenance mode=max
          --output "type=local,dest=$RUNNER_TEMP/rust-export/server" .
      - name: Stage them as a release request does and verify them as the release does
        env:
          RUST: both
          RUST_SERVER: linux/amd64
          VERSION: 0.0.0-ci
          RUST_EXPORT: ${{ runner.temp }}/rust-export
          RUST_ASSETS: ${{ runner.temp }}/rust-assets
        run: |
          python3 -m scripts.ci.release stage-rust
          python3 -m scripts.ci.release check-rust

  rust-darwin:
    name: Experimental Rust macOS TUIs
    runs-on: macos-15
    timeout-minutes: 40
    needs: plan
    if: needs.plan.outputs.darwin == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned mise and Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_AUTO_INSTALL: '0'
        with:
          version: 2026.9.14
          install_args: --locked python
          cache: false
      # Release requests run the same task on the same runner, Xcode and platform record.
      - name: Build the macOS TUIs as a release request does
        env:
          RELEASE_DIST: ${{ runner.temp }}/rust-darwin
        run: mise run rust-darwin-package 0.0.0-dev
      - name: Test the TUI's crates on macOS
        working-directory: rust
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        # The tests' disposable identities come from the openssl CLI; macOS ships LibreSSL, whose certificates
        # rustls rejects, so the runner's Homebrew OpenSSL makes them as on Linux.
        run: |
          PATH="$(brew --prefix openssl@3)/bin:$PATH"
          openssl version | grep '^OpenSSL 3'
          cargo test --locked -p graphite-meter-client -p graphite-meter-core -p graphite-meter-net

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [plan, tooling, core, go, e2e, smoke, release, security, secret-scan, rust, rust-interop, rust-e2e, rust-release,
            rust-darwin]
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          {
            printf '### CI Gate\n\n| Job | Result |\n|---|---|\n'
            jq -r 'to_entries[] | "| \(.key) | `\(.value.result)` |"' <<<"$NEEDS"
          } >>"$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null || {
            echo "::error::CI Gate failed; inspect the summary table for the failing job"
            exit 1
          }
