name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: '0'
  SKOPEO_IMAGE: quay.io/containers/skopeo:v1.22.2@sha256:093db3c35ae8bc8569d1cc034a503ff00abb6f4adac1cf7bab561881e3de94d4
  SKOPEO_VERSION: 1.22.2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan and repository safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      go: ${{ steps.filter.outputs.go }}
      browser: ${{ steps.filter.outputs.browser }}
      tui: ${{ steps.filter.outputs.tui }}
      integration: ${{ steps.filter.outputs.integration }}
      smoke: ${{ steps.filter.outputs.smoke }}
      release: ${{ steps.filter.outputs.release }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python verification tools
        uses: ./.github/actions/setup-project
        with: {python: 'true'}

      - name: Enforce repository and workflow security policy
        run: mise run workflow-check

      - name: Type-check and test tooling, pipeline and legal boundaries
        run: mise run pipeline-test

      - id: filter
        name: Determine affected CI areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Summarize CI plan
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: printf '### CI plan for `%s`\n\nSelected: `%s`; secret scan always runs.\n' "$GITHUB_SHA" "$CHANGES" >>"$GITHUB_STEP_SUMMARY"

  core:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.core == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up core toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', staticcheck: 'true', python: 'true'}
      - name: Refresh reviewed legal metadata
        run: mise run legal-generate
      - name: Run component checks
        run: mise run core-check

  go:
    name: Go race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.go == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Run race detector and coverage floor
        run: mise run server-race

  browser:
    name: Browser (Chromium WebView)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up browser test toolchain
        uses: ./.github/actions/setup-project
        with: {bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Verify pinned Chromium WebView launch
        env:
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
        run: cd client && bun run check:webview
      - name: Run Chromium WebView browser suite
        env:
          # Chrome for Testing is an unpacked archive without a setuid sandbox;
          # this read-only, secret-free job therefore uses Chromium's CI mode.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: mise run client-browser
      - name: Upload WebView failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webview-browser-failures
          path: client/test-results/webview
          if-no-files-found: ignore

  tui:
    name: TUI cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.tui == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Cross-build all supported TUI targets
        run: mise run tui-cross-build

  integration:
    name: Browser/server E2E (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [connections, measurement, authentication, performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Verify pinned Chromium WebView launch
        env:
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
        run: cd client && bun run check:webview
      - name: Run browser/server transport E2E
        env:
          GM_E2E_SUITE: ${{ matrix.suite }}
          # See the browser job: the archive has no usable setuid sandbox.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: mise run client-e2e
      - name: Upload WebView failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webview-e2e-failures-${{ matrix.suite }}
          path: client/test-results/webview
          if-no-files-found: ignore

  smoke:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up mise
        uses: ./.github/actions/setup-project
      - name: Build and verify local container
        run: mise run container-smoke

  release:
    name: Release package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up release test toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - name: Refresh reviewed legal metadata
        run: mise run legal-generate
      - name: Build and verify representative release packages
        run: mise run release-check
      - name: Verify pinned Skopeo runtime contract
        env:
          SKOPEO_IMAGE: ${{ env.SKOPEO_IMAGE }}
          SKOPEO_VERSION: ${{ env.SKOPEO_VERSION }}
        run: python3 scripts/ci/verify_oci.py --check-skopeo

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.security == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned vulnerability scanner and client dependencies
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', govulncheck: 'true'}
      - name: Run Go and client vulnerability scans
        run: |
          mise run security
          mise run client-audit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up mise
        uses: ./.github/actions/setup-project
      - name: Scan repository with pinned Gitleaks image
        run: mise run secret-scan-ci

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [plan, core, go, browser, tui, integration, smoke, release, security, secret-scan]
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          {
            printf '### CI Gate\n\n| Job | Result |\n|---|---|\n'
            jq -r 'to_entries[] | "| \(.key) | `\(.value.result)` |"' <<<"$NEEDS"
          } >>"$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null || {
            echo "::error::CI Gate failed; inspect the summary table for the failing job"
            exit 1
          }
