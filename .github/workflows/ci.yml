name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: '0'

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' }}
      deps: ${{ github.event_name == 'push' || steps.filter.outputs.deps == 'true' }}
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
      rust-release: ${{ github.event_name == 'push' || steps.filter.outputs.rust-release == 'true' }}
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        name: Determine affected CI areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Summarize CI plan
        env:
          CHANGES: ${{ github.event_name == 'push' && 'every area on main' || steps.filter.outputs.changes }}
        run: |
          printf '### CI plan for `%s`\n\nSelected: `%s`; tooling and the secret scan always run.\n' \
            "$GITHUB_SHA" "$CHANGES" >>"$GITHUB_STEP_SUMMARY"

  tooling:
    name: Workflow policy and pipeline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Python verification tools
        uses: ./.github/actions/setup-project
        with: {python: 'true'}
      - name: Enforce repository and workflow security policy
        run: mise run workflow-check
      - name: Type-check and test tooling, pipeline and legal boundaries
        run: mise run pipeline-test

  core:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up core toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', staticcheck: 'true'}
      - name: Check legal outputs for drift
        run: mise run legal-check
      - name: Run component checks
        run: mise run core-check

  go:
    name: Go race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.go == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Run race detector and coverage floor
        run: mise run server-race

  e2e:
    name: Browser E2E (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [heavy, rest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Run Chromium against one local server fleet
        env:
          # Chrome for Testing is an unpacked archive without a setuid sandbox;
          # this read-only, secret-free job therefore uses Chromium's CI mode.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
          GM_E2E_GROUP: ${{ matrix.group }}
        run: mise run e2e
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failures-${{ matrix.group }}
          retention-days: 7
          path: |
            client/test-results/webview
            client/test-results/servers
          if-no-files-found: ignore

  smoke:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up mise
        uses: ./.github/actions/setup-project
      - name: Build and verify local container
        run: mise run container-smoke
      # The smoke image's build arguments, so the client and server stages come from its cache.
      - name: Export the image's third-party source as a prerelease request does
        run: >-
          docker build --file container/Dockerfile --target third-party-source --build-arg VERSION=0.0.0-ci
          --build-arg CLIENT_VERSION=0.0.0-ci --build-arg GM_CLIENT_REVISION=local --build-arg GM_CLIENT_VALIDATE=0
          --output "type=local,dest=$RUNNER_TEMP/source-offer" .
      - name: Stage it as a prerelease request does
        env:
          VERSION: 0.0.0-ci
          SOURCE_EXPORT: ${{ runner.temp }}/source-offer
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: python3 -m scripts.ci.release stage-source

  release:
    name: Release package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up release test toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - name: Build and verify representative release packages
        run: mise run release-check

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.deps == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned vulnerability scanner and client dependencies
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', govulncheck: 'true'}
      - name: Run Go and client vulnerability scans
        run: |
          mise run security
          mise run client-audit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned Gitleaks
        uses: ./.github/actions/setup-project
        with: {gitleaks: 'true'}
      - name: Scan repository with pinned Gitleaks
        run: mise run secret-scan-ci

  rust:
    name: Experimental Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Rust, pinned cargo-deny and cargo-nextest
        uses: ./.github/actions/setup-project
        with: {rust: 'true', cargo-deny: 'true', cargo-nextest: 'true'}
      - name: Check experimental Rust implementation and dependency policy
        run: mise run rust-check
      - name: Verify the Cargo fork pins against their branches, upstream tags and reviewed change sets
        run: python3 -m scripts.legal.check_git_sources --verify
      # Native dependencies need mingw-w64 for Windows and musl headers for Linux. Only cargo check
      # uses Ubuntu's current mingw-w64; the Windows TUI links with the version the builder image pins.
      - name: Install C compilers and headers for cargo check
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 mingw-w64-x86-64-dev musl-tools
      - name: Check the Windows TUI and musl binaries
        run: mise run rust-check-targets
      - name: Keep only dependency builds in a new cache
        run: mise run rust-cache-trim

  rust-interop:
    name: Experimental Rust interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go, Python, Rust and cargo-nextest interoperability tools
        uses: ./.github/actions/setup-project
        with: {go: 'true', rust: 'true', cargo-nextest: 'true'}
      - name: Rust server with unchanged Go clients
        run: python3 rust/tests/server_interop.py
      - name: Rust client with unchanged Go server
        run: python3 rust/tests/client_interop.py
      - name: Delayed HTTP/3 and WebTransport downloads
        run: mise run rust-delayed-downloads
      - name: Keep only dependency builds in a new cache
        run: mise run rust-cache-trim

  rust-e2e-build:
    name: Experimental Rust browser image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned mise and Python
        uses: ./.github/actions/setup-project
      - name: Set up pinned Buildx
        uses: ./.github/actions/setup-buildx
      - name: Build the Rust server image with reviewed browser and runtime notices
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: container/Dockerfile.rust
          target: server
          platforms: linux/amd64
          load: true
          tags: graphite-meter-rust:smoke
          labels: org.opencontainers.image.licenses=AGPL-3.0-or-later
          github-token: ''
          # Docker's local image loader cannot load the extra attestation manifest.
          provenance: 'false'
          cache-from: type=gha,scope=rust-ci-browser
          cache-to: type=gha,scope=rust-ci-browser,mode=max,ignore-error=true,timeout=2m
          build-args: |
            VERSION=0.0.0-dev
            PROFILE=ci
            GM_RUST_DEPENDENCY_CACHE=1
      - name: Smoke-test the Rust server image like the Go image
        env:
          VERSION: 0.0.0-dev
          ENGINE_VERSION: 0.0.0-dev-rust
          GM_CLIENT_REVISION: source
        run: scripts/verify-container.sh graphite-meter-rust:smoke
      - name: Export the smoke-tested image's server for the browser groups
        run: |
          docker create --name rust-e2e-export graphite-meter-rust:smoke
          docker cp rust-e2e-export:/graphite-meter "$RUNNER_TEMP/graphite-meter-server"
      - name: Upload the reviewed server for this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-e2e-server
          path: ${{ runner.temp }}/graphite-meter-server
          if-no-files-found: error
          retention-days: 1

  rust-e2e:
    name: Experimental Rust browser E2E (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan, rust-e2e-build]
    if: needs.plan.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [heavy, rest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Download the reviewed server from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-e2e-server
          path: ${{ runner.temp }}
      - name: Restore the server executable mode
        run: chmod +x "$RUNNER_TEMP/graphite-meter-server"
      - name: Run the shared browser suite against the image's server
        env:
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
          GROUP: ${{ matrix.group }}
        run: python3 rust/tests/browser_interop.py --server "$RUNNER_TEMP/graphite-meter-server" --group "$GROUP"
      # Firefox and WebKitGTK, which the script also drives, are not on the runner.
      - name: Check Chromium's HTTP/3, WebTransport and session close codes against the image's server
        if: matrix.group == 'rest'
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          python3 rust/tests/browser_transports.py --server "$RUNNER_TEMP/graphite-meter-server"
          --browsers chromium --chromium "$CHROME"
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-e2e-failures-${{ matrix.group }}
          retention-days: 7
          path: |
            client/test-results/webview
            client/test-results/servers
            rust/target/browser-transports-*/*.json
            rust/target/browser-transports-*/*.log
          if-no-files-found: ignore

  rust-release-tui:
    name: Experimental Rust TUI exports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust-release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned mise and Python
        uses: ./.github/actions/setup-project
      - name: Set up pinned Buildx
        uses: ./.github/actions/setup-buildx
      # Exercise the same package layouts, notices and verification without release-only fat LTO.
      # Distributed artifacts are built separately, without CI caches or these compiler overrides.
      - name: Export the Linux and Windows TUIs with reviewed notices
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: container/Dockerfile.rust
          target: tui-artifacts
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/rust-export/tui
          github-token: ''
          provenance: mode=max
          cache-from: type=gha,scope=rust-ci-tui
          cache-to: type=gha,scope=rust-ci-tui,mode=max,ignore-error=true,timeout=2m
          build-args: |
            VERSION=0.0.0-ci
            GM_RUST_DEPENDENCY_CACHE=1
            GM_RUST_RELEASE_LTO=false
            GM_RUST_RELEASE_CODEGEN_UNITS=16
      - name: Upload TUI exports for package verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-ci-tui-export
          path: ${{ runner.temp }}/rust-export/tui
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  rust-release-server:
    name: Experimental Rust server source exports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust-release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned mise and Python
        uses: ./.github/actions/setup-project
      - name: Set up pinned Buildx
        uses: ./.github/actions/setup-buildx
      - name: Export the amd64 and arm64 server sources with reviewed notices
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: container/Dockerfile.rust
          target: server-artifacts
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=${{ runner.temp }}/rust-export/server
          github-token: ''
          provenance: mode=max
          cache-from: type=gha,scope=rust-ci-server
          cache-to: type=gha,scope=rust-ci-server,mode=max,ignore-error=true,timeout=2m
          build-args: |
            VERSION=0.0.0-ci
            GM_CLIENT_VALIDATE=0
            GM_RUST_DEPENDENCY_CACHE=1
            GM_RUST_RELEASE_LTO=false
            GM_RUST_RELEASE_CODEGEN_UNITS=16
      - name: Upload server source exports for package verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-ci-server-export
          path: ${{ runner.temp }}/rust-export/server
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  rust-release:
    name: Experimental Rust release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan, rust-release-tui, rust-release-server]
    if: needs.plan.outputs.rust-release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned mise and Python
        uses: ./.github/actions/setup-project
      - name: Download TUI exports from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-ci-tui-export
          path: ${{ runner.temp }}/rust-export/tui
      - name: Download server source exports from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-ci-server-export
          path: ${{ runner.temp }}/rust-export/server
      - name: Stage them as a release request does and verify them as the release does
        env:
          RUST: both
          VERSION: 0.0.0-ci
          RUST_EXPORT: ${{ runner.temp }}/rust-export
          RUST_ASSETS: ${{ runner.temp }}/rust-assets
        run: |
          python3 -m scripts.ci.release stage-rust
          python3 -m scripts.ci.release check-rust

  rust-campaign-build:
    name: Temporary campaign variant binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned Python and Rust without build caches
        uses: ./.github/actions/setup-project
        with: {rust: 'true', cache: 'false'}
      - name: Install musl headers and compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build the candidate and its variants
        run: python3 -m scripts.ci.rust_perf_campaign build
      - name: Upload campaign binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-campaign-bin
          path: rust/target/campaign/bin
          if-no-files-found: error
          retention-days: 3
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-campaign-build-logs
          path: rust/target/campaign/*.log
          if-no-files-found: ignore
          retention-days: 3

  rust-campaign:
    name: Temporary campaign (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: [plan, rust-campaign-build]
    if: needs.plan.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [measure, profile]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned mise and Python
        uses: ./.github/actions/setup-project
      - name: Download campaign binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-campaign-bin
          path: rust/target/campaign/bin
      - name: Install perf for the profile
        if: matrix.mode == 'profile'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends linux-tools-generic
      - name: Measure the variants or profile the candidate
        env:
          MODE: ${{ matrix.mode }}
        run: chmod +x rust/target/campaign/bin/* && python3 -m scripts.ci.rust_perf_campaign "$MODE"
      - name: Upload measurements and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-campaign-${{ matrix.mode }}
          path: rust/target/campaign/results-*
          if-no-files-found: error
          retention-days: 3

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [plan, tooling, core, go, e2e, smoke, release, security, secret-scan, rust, rust-interop, rust-e2e-build, rust-e2e, rust-release-tui, rust-campaign-build, rust-campaign, rust-release-server, rust-release]
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          {
            printf '### CI Gate\n\n| Job | Result |\n|---|---|\n'
            jq -r 'to_entries[] | "| \(.key) | `\(.value.result)` |"' <<<"$NEEDS"
          } >>"$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null || {
            echo "::error::CI Gate failed; inspect the summary table for the failing job"
            exit 1
          }
