name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: '0'

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' }}
      deps: ${{ github.event_name == 'push' || steps.filter.outputs.deps == 'true' }}
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        name: Determine affected CI areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Summarize CI plan
        env:
          CHANGES: ${{ github.event_name == 'push' && 'every area on main' || steps.filter.outputs.changes }}
        run: |
          printf '### CI plan for `%s`\n\nSelected: `%s`; tooling and the secret scan always run.\n' \
            "$GITHUB_SHA" "$CHANGES" >>"$GITHUB_STEP_SUMMARY"

  tooling:
    name: Workflow policy and pipeline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Python verification tools
        uses: ./.github/actions/setup-project
        with: {python: 'true'}
      - name: Enforce repository and workflow security policy
        run: mise run workflow-check
      - name: Type-check and test tooling, pipeline and legal boundaries
        run: mise run pipeline-test

  core:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up core toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', staticcheck: 'true'}
      - name: Check legal outputs for drift
        run: mise run legal-check
      - name: Run component checks
        run: mise run core-check

  go:
    name: Go race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.go == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go
        uses: ./.github/actions/setup-project
        with: {go: 'true'}
      - name: Run race detector and coverage floor
        run: mise run server-race

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Run Chromium against one local server fleet
        env:
          # Chrome for Testing is an unpacked archive without a setuid sandbox;
          # this read-only, secret-free job therefore uses Chromium's CI mode.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
        run: mise run e2e
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failures
          path: |
            client/test-results/webview
            client/test-results/servers
          if-no-files-found: ignore

  smoke:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up mise
        uses: ./.github/actions/setup-project
      - name: Build and verify local container
        run: mise run container-smoke

  release:
    name: Release package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up release test toolchain
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true'}
      - name: Build and verify representative release packages
        run: mise run release-check

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.deps == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned vulnerability scanner and client dependencies
        uses: ./.github/actions/setup-project
        with: {go: 'true', bun: 'true', client-deps: 'true', govulncheck: 'true'}
      - name: Run Go and client vulnerability scans
        run: |
          mise run security
          mise run client-audit

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Rust, pinned cargo-deny and cargo-nextest
        uses: ./.github/actions/setup-project
        with: {rust: 'true', cargo-deny: 'true', cargo-nextest: 'true'}
      - name: Check Rust formatting, dependency policy, lints and tests
        run: mise run rust-check
      - name: Verify the fork pins against their branches, upstream tags and reviewed change sets
        run: python3 -m scripts.legal.check_git_sources --verify
      # Target build scripts compile C; only these checks use Ubuntu's unpinned cross compilers.
      - name: Install C cross compilers for the target checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 mingw-w64-x86-64-dev \
            musl-tools gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Check the shipped TUI and server targets
        run: mise run rust-check-targets

  rust-interop:
    name: Rust interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up Go, Rust and cargo-nextest
        uses: ./.github/actions/setup-project
        with: {go: 'true', rust: 'true', cargo-nextest: 'true'}
      # Only the static server's C dependencies use Ubuntu's unpinned musl compiler.
      - name: Install the musl compiler for the static server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      # The scripts keep their evidence in TMPDIR.
      - name: Run unchanged Go peers, the Go native client and process checks against the sharded server
        env:
          TMPDIR: ${{ runner.temp }}
        run: mise run rust-interop
      - name: Run the Rust client against the unchanged Go server and its approved sign-in
        env:
          TMPDIR: ${{ runner.temp }}
        run: mise run rust-client-interop
      - name: Gate delayed-link HTTP/3 and WebTransport downloads
        run: mise run rust-delayed-downloads
      - name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      # Chrome for Testing is an unpacked archive without a setuid sandbox; the script runs it with --no-sandbox.
      - name: Check Chromium's HTTP/3, WebTransport and session close codes against the sharded server
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 rust/interop/browser.py
      - name: Upload interoperability evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-interop-evidence
          retention-days: 7
          path: |
            ${{ runner.temp }}/interop-*/*.log
            ${{ runner.temp }}/client-*/*.log
            ${{ runner.temp }}/browser-*/*.log
            ${{ runner.temp }}/browser-*/*.json
          if-no-files-found: ignore

  rust-image:
    name: Rust image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      VERSION: 0.0.0-ci
      REPOSITORY: ${{ github.repository }}
      REVISION: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned mise and Python
        uses: ./.github/actions/setup-project
      # The arm64 image's checks run its server.
      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # setup-qemu runs this image privileged to register binfmt. Pin the
          # secondary image as tightly as the Action that launches it.
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: 'false'
      - name: Set up pinned Buildx
        uses: ./.github/actions/setup-buildx
      # The OCI archive builds each architecture's server once; the loaded images reuse its layers. The ci
      # profile leaves out LTO, and the core job checks the browser app.
      - name: Build the amd64 and arm64 server image with reviewed notices
        run: |
          build() {
            docker buildx build --file container/Dockerfile.rust --target server \
              --build-arg VERSION="$VERSION" --build-arg PROFILE=ci --build-arg GM_CLIENT_VALIDATE=0 \
              --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
              --label "org.opencontainers.image.revision=$REVISION" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label org.opencontainers.image.licenses=AGPL-3.0-or-later "$@" .
          }
          mkdir -p "$RUNNER_TEMP/rust-image"
          build --platform linux/amd64,linux/arm64 --provenance mode=max \
            --output "type=oci,dest=$RUNNER_TEMP/rust-image/graphite-meter-rust.oci.tar"
          # Docker's image store cannot load the attestation manifests.
          for arch in amd64 arm64; do
            build --platform "linux/$arch" --provenance false --load --tag "graphite-meter-rust:$arch"
          done
      - name: Verify the archive's platforms, provenance, labels and reviewed notices
        env:
          OCI_ARCHIVE: ${{ runner.temp }}/rust-image/graphite-meter-rust.oci.tar
        run: SKOPEO_IMAGE=$(python3 scripts/ci/toolchains.py get images.skopeo) python3 scripts/ci/verify_oci.py
      # The arm64 image runs under emulation.
      - name: Check both images' files, server, browser app and allocator setting like the Go image
        env:
          ENGINE_VERSION: 0.0.0-ci-rust
          GM_CLIENT_REVISION: source
        run: |
          for arch in amd64 arm64; do
            scripts/verify-container.sh "graphite-meter-rust:$arch"
          done
      - name: Export the amd64 image's server for the browser suite
        run: |
          docker create --name rust-image-server graphite-meter-rust:amd64
          docker cp rust-image-server:/graphite-meter "$RUNNER_TEMP/rust-image/graphite-meter-server"
      - name: Upload the image and its amd64 server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-image
          path: ${{ runner.temp }}/rust-image/
          if-no-files-found: error
          retention-days: 7

  rust-e2e:
    name: Rust browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan, rust-image]
    if: needs.plan.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        name: Set up E2E toolchain
        uses: ./.github/actions/setup-project
        with: {bun: 'true', client-deps: 'true'}
      - id: chrome
        name: Install pinned Chrome for Testing
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ steps.toolchain.outputs.chrome-version }}
          install-dependencies: true
      - name: Download the image's amd64 server from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-image
          path: ${{ runner.temp }}/rust-image
      - name: Restore the server's executable mode
        run: chmod +x "$RUNNER_TEMP/rust-image/graphite-meter-server"
      - name: Run Chromium against one fleet of the image's server, password sign-in included
        env:
          # As the Go job: Chrome for Testing has no setuid sandbox.
          BUN_CHROME_ARGS: --no-sandbox
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GM_EXPECTED_CHROME_VERSION: ${{ steps.toolchain.outputs.chrome-version }}
        run: mise run rust-e2e "$RUNNER_TEMP/rust-image/graphite-meter-server"
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-e2e-failures
          retention-days: 7
          path: |
            client/test-results/webview
            client/test-results/servers
          if-no-files-found: ignore

  rust-windows:
    name: Rust client tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    defaults:
      run: {shell: bash}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Tests compare checked-in text byte for byte.
      - name: Check out text with its committed line endings
        run: git config --global core.autocrlf false
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Rust
        uses: ./.github/actions/setup-project
        with: {rust: 'true'}
      - name: Run the client crate's unit and process tests
        working-directory: rust
        run: cargo test --locked -p graphite-meter-client --lib --tests

  # Temporary: this branch's server and client against PR #210's on one runner.
  rust-perf:
    name: Rust perf smoke against PR 210
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: '0'
      BASELINE_SHA: a020e9013dd800ed989b7bdbca6a845c3825929a
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up Go and Rust
        uses: ./.github/actions/setup-project
        with: {go: 'true', rust: 'true'}
      - name: Install the musl compiler for the static binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      # perf.py keeps each variant's binaries in TMPDIR/graphite-meter-perf/<variant> and its evidence in TMPDIR.
      - id: baseline
        name: Restore PR 210's static release server and client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/graphite-meter-perf/baseline
          key: rust-perf-baseline-server-client-${{ runner.os }}-${{ runner.arch }}-${{ env.BASELINE_SHA }}
      - name: Build PR 210's static release server and client
        if: steps.baseline.outputs.cache-hit != 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 rust/interop/perf.py baseline "$BASELINE_SHA"
      - name: Build this branch's static release server and client
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 rust/interop/perf.py candidate
      - id: servers
        name: Compare the servers over HTTP/1, HTTP/2 and HTTP/3 with PR 210 in alternating order
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 rust/interop/perf.py servers
      # The client comparison runs even when the server comparison found a regression.
      - name: Compare the clients over HTTP/1, HTTP/2, HTTP/3 and WebTransport with PR 210 in alternating order
        if: success() || steps.servers.outcome == 'failure'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 rust/interop/perf.py clients
      - name: Upload the perf runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-perf-smoke
          retention-days: 14
          path: |
            ${{ runner.temp }}/perf-*/*.json*
            ${{ runner.temp }}/perf-*/*.log
          if-no-files-found: ignore

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Set up pinned Gitleaks
        uses: ./.github/actions/setup-project
        with: {gitleaks: 'true'}
      - name: Scan repository with pinned Gitleaks
        run: mise run secret-scan-ci

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [plan, tooling, core, go, e2e, smoke, release, security, secret-scan, rust, rust-interop, rust-image,
      rust-e2e, rust-windows, rust-perf]
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          {
            printf '### CI Gate\n\n| Job | Result |\n|---|---|\n'
            jq -r 'to_entries[] | "| \(.key) | `\(.value.result)` |"' <<<"$NEEDS"
          } >>"$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null || {
            echo "::error::CI Gate failed; inspect the summary table for the failing job"
            exit 1
          }
