name: Request release
run-name: Release request · ${{ inputs.mode }} · ${{ inputs.tag }} · ${{ github.sha }}

# LOW AUTHORITY: dispatch may select any ref, so this build has read-only access,
# no secrets or caches, and no path to publication. Release accepts its output
# only from a main run and treats it as untrusted data.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: vMAJOR.MINOR.PATCH, or vMAJOR.MINOR.PATCH-{alpha,beta,rc}.N with a PR
        required: true
        type: string
      pr:
        description: Same-repository PR number for a prerelease; empty for a stable release
        required: false
        default: ''
        type: string
      sha:
        description: Exact PR head SHA for a prerelease; empty for a stable release
        required: false
        default: ''
        type: string
      mode:
        description: Validate only, or publish after protected-environment approval
        required: true
        default: validate
        type: choice
        options: [validate, publish]

permissions:
  contents: read

concurrency:
  group: release-request-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build untrusted release candidate
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned mise and Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_AUTO_INSTALL: '0'
        with:
          version: 2026.9.14
          install_args: --locked python
          cache: false

      - id: request
        name: Validate and record the request
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          TAG: ${{ inputs.tag }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          OUT_DIR: ${{ runner.temp }}/release-request
        run: python3 scripts/ci/release.py prepare

      - name: Set up the stable build toolchain without caches
        if: steps.request.outputs.stable == 'true'
        uses: ./.github/actions/setup-project
        with:
          go: 'true'
          go-cache: 'false'
          bun: 'true'
          client-deps: 'true'
          bun-cache: 'false'
          cache: 'false'

      - name: Build and verify stable native artifacts and third-party source
        if: steps.request.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.request.outputs.version }}
          RELEASE_DIST: ${{ runner.temp }}/release-assets
        run: |
          mise run legal-generate
          mise run release-build "$VERSION"
          mise run release-artifacts "$VERSION"
          python3 scripts/ci/verify_release_assets.py "$VERSION"

      # A prerelease never checks PR files out here: BuildKit fetches that exact
      # commit remotely and receives no GitHub credential.
      - name: Build linux/amd64 + linux/arm64 OCI archive
        uses: ./.github/actions/build-oci
        with:
          version: ${{ steps.request.outputs.version }}
          revision: ${{ steps.request.outputs.sha }}
          output: ${{ runner.temp }}/release-request/graphite-meter.oci.tar
          source-sha: ${{ steps.request.outputs.remote_sha }}
          client-validate: ${{ steps.request.outputs.client_validate }}

      - name: Record the OCI checksum
        working-directory: ${{ runner.temp }}/release-request
        run: sha256sum graphite-meter.oci.tar >graphite-meter.oci.tar.sha256

      - name: Upload untrusted request and OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-request-${{ github.run_id }}
          path: ${{ runner.temp }}/release-request/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload untrusted stable assets
        if: steps.request.outputs.stable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
