name: Request release
run-name: >-
  Release request · ${{ inputs.mode }} · ${{ inputs.tag }} ·
  ${{ inputs.pr && format('PR #{0} @ {1}', inputs.pr, inputs.sha) || 'main' }} · ${{ github.sha }}

# LOW AUTHORITY: dispatch may select any ref, so this build has read-only access,
# no secrets or caches, and no path to publication. Release accepts its output
# only from a main run and treats it as untrusted data.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: vMAJOR.MINOR.PATCH, or vMAJOR.MINOR.PATCH-{alpha,beta,rc}.N for a prerelease
        required: true
        type: string
      pr:
        description: Same-repository PR number for a PR prerelease; empty to build main
        required: false
        default: ''
        type: string
      sha:
        description: Exact commit a prerelease builds, the PR head or current main; empty for a stable release
        required: false
        default: ''
        type: string
      mode:
        description: Validate only, or publish after protected-environment approval
        required: true
        default: validate
        type: choice
        options: [validate, publish]

permissions:
  contents: read

jobs:
  build:
    name: Build untrusted release candidate
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned mise and Python without caches
        uses: ./.github/actions/setup-project
        with:
          cache: 'false'

      - id: request
        name: Validate and record the request
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          TAG: ${{ inputs.tag }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          OUT_DIR: ${{ runner.temp }}/release-request
        run: python3 scripts/ci/release.py prepare

      # A prerelease never checks PR files out here: BuildKit fetches that exact
      # commit remotely and receives no GitHub credential.
      - id: source
        name: Resolve the OCI build context
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.request.outputs.remote_sha }}
        run: |
          if [[ -z "$SOURCE_SHA" ]]; then
            context='.'
          else
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "remote OCI source SHA must be exactly 40 lowercase hexadecimal characters" >&2
              exit 2
            }
            context="https://github.com/${REPOSITORY}.git#${SOURCE_SHA}"
          fi
          echo "context=$context" >>"$GITHUB_OUTPUT"

      - name: Set up pinned Buildx
        uses: ./.github/actions/setup-buildx

      # The pinned builder cross-compiles arm64, so no build emulates it.
      - name: Build the linux/amd64 + linux/arm64 OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Avoid an extra build-record artifact from this untrusted build.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ${{ steps.source.outputs.context }}
          file: container/Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/build/graphite-meter.oci.tar
          no-cache: true
          provenance: mode=max
          # Public exact-commit Git contexts do not need a repository credential.
          # Keeping this empty prevents the default github.token from entering BuildKit.
          github-token: ''
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.request.outputs.sha }}
            org.opencontainers.image.version=${{ steps.request.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: |
            VERSION=${{ steps.request.outputs.version }}
            GM_CLIENT_REVISION=${{ steps.request.outputs.sha }}
            GM_CLIENT_VALIDATE=${{ steps.request.outputs.client_validate }}

      # This job's fresh builder holds only this request's layers, so the exports reuse the image build's.
      - name: Export the server's source offers
        if: steps.request.outputs.stable == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ${{ steps.source.outputs.context }}
          file: container/Dockerfile
          target: server-artifacts
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=${{ runner.temp }}/build/server-export
          provenance: mode=max
          github-token: ''
          build-args: |
            VERSION=${{ steps.request.outputs.version }}
            GM_CLIENT_REVISION=${{ steps.request.outputs.sha }}
            GM_CLIENT_VALIDATE=${{ steps.request.outputs.client_validate }}

      - name: Build the Linux and Windows client archives with their source offers
        if: steps.request.outputs.stable == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ${{ steps.source.outputs.context }}
          file: container/Dockerfile
          target: tui-artifacts
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/build/tui-export
          provenance: mode=max
          github-token: ''
          build-args: |
            VERSION=${{ steps.request.outputs.version }}

      # The amd64 client runs here; the trusted consumer verifies the files and never executes candidates.
      - name: Stage the release files and run the amd64 client
        env:
          VERSION: ${{ steps.request.outputs.version }}
          STABLE: ${{ steps.request.outputs.stable }}
          OCI_ARCHIVE: ${{ runner.temp }}/build/graphite-meter.oci.tar
          SERVER_EXPORT: ${{ runner.temp }}/build/server-export
          TUI_EXPORT: ${{ runner.temp }}/build/tui-export
          OUT_DIR: ${{ runner.temp }}/release-request
        run: |
          python3 scripts/ci/assets.py stage
          if [[ "$STABLE" == true ]]; then
            python3 -m scripts.package "$VERSION" --output "$OUT_DIR" --check
          fi

      - name: Upload the untrusted request and release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-request-${{ github.run_id }}
          path: ${{ runner.temp }}/release-request/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
