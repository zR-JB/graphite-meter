name: Request release
run-name: >-
  Release request · ${{ inputs.mode }} · ${{ inputs.tag }} ·
  ${{ inputs.pr && format('PR #{0} @ {1}', inputs.pr, inputs.sha) || 'main' }} · ${{ github.sha }} · Rust ${{ inputs.rust }}

# LOW AUTHORITY: dispatch may select any ref, so this build has read-only access,
# no secrets or caches, and no path to publication. Release accepts its output
# only from a main run and treats it as untrusted data.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: vMAJOR.MINOR.PATCH, or vMAJOR.MINOR.PATCH-{alpha,beta,rc}.N with a PR
        required: true
        type: string
      pr:
        description: Same-repository PR number for a prerelease; empty for a stable release
        required: false
        default: ''
        type: string
      sha:
        description: Exact PR head SHA for a prerelease; empty for a stable release
        required: false
        default: ''
        type: string
      mode:
        description: Validate only, or publish after protected-environment approval
        required: true
        default: validate
        type: choice
        options: [validate, publish]

      rust:
        description: Experimental Rust artifacts (Go remains included)
        type: choice
        default: none
        options: [none, server, tui, both]

permissions:
  contents: read

jobs:
  build:
    name: Build untrusted release candidate
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned mise and Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_AUTO_INSTALL: '0'
        with:
          version: 2026.9.14
          install_args: --locked python
          cache: false

      - id: request
        name: Validate and record the request
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          TAG: ${{ inputs.tag }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          RUST: ${{ inputs.rust }}
          OUT_DIR: ${{ runner.temp }}/release-request
        run: python3 scripts/ci/release.py prepare

      - name: Set up the stable build toolchain without caches
        if: steps.request.outputs.stable == 'true'
        uses: ./.github/actions/setup-project
        with:
          go: 'true'
          go-cache: 'false'
          bun: 'true'
          client-deps: 'true'
          bun-cache: 'false'
          cache: 'false'

      - name: Check and generate stable legal outputs
        if: steps.request.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          VERSION= mise run legal-check
          mise run legal-generate

      # A prerelease never checks PR files out here: BuildKit fetches that exact
      # commit remotely and receives no GitHub credential.
      - name: Build linux/amd64 + linux/arm64 OCI archive
        uses: ./.github/actions/build-oci
        with:
          version: ${{ steps.request.outputs.version }}
          revision: ${{ steps.request.outputs.sha }}
          output: ${{ runner.temp }}/release-request/graphite-meter.oci.tar
          source-sha: ${{ steps.request.outputs.remote_sha }}
          client-validate: ${{ steps.request.outputs.client_validate }}

      - name: Build and verify stable native artifacts and third-party source
        if: steps.request.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.request.outputs.version }}
          RELEASE_DIST: ${{ runner.temp }}/release-assets
          RUST: ${{ steps.request.outputs.rust }}
        run: |
          mise run release-artifacts "$VERSION"
          python3 scripts/ci/verify_release_assets.py "$VERSION"

      - name: Build experimental Rust AMD64 OCI archive
        if: steps.request.outputs.rust_server == 'true'
        uses: ./.github/actions/build-oci
        with:
          implementation: rust
          version: ${{ steps.request.outputs.version }}-rust
          revision: ${{ steps.request.outputs.sha }}
          output: ${{ runner.temp }}/release-request/graphite-meter-rust.oci.tar
          source-sha: ${{ steps.request.outputs.remote_sha }}
          client-validate: ${{ steps.request.outputs.client_validate }}

      - name: Export prerelease Rust source from the exact remote commit
        if: steps.request.outputs.stable != 'true' && steps.request.outputs.rust_server == 'true'
        uses: ./.github/actions/build-oci
        with:
          implementation: rust
          target: server-artifacts
          output-type: local
          version: ${{ steps.request.outputs.version }}-rust
          revision: ${{ steps.request.outputs.sha }}
          output: ${{ runner.temp }}/rust-source
          source-sha: ${{ steps.request.outputs.remote_sha }}
          client-validate: '1'

      - name: Export prerelease Rust TUI from the exact remote commit
        if: steps.request.outputs.stable != 'true' && steps.request.outputs.rust_tui == 'true'
        uses: ./.github/actions/build-oci
        with:
          implementation: rust
          target: tui-artifacts
          output-type: local
          version: ${{ steps.request.outputs.version }}-rust
          revision: ${{ steps.request.outputs.sha }}
          output: ${{ runner.temp }}/rust-tui
          source-sha: ${{ steps.request.outputs.remote_sha }}

      - name: Stage prerelease Rust source offer
        if: steps.request.outputs.stable != 'true' && steps.request.outputs.rust != 'none'
        env:
          VERSION: ${{ steps.request.outputs.version }}
          SOURCE_DIR: ${{ runner.temp }}/rust-source
          DIST: ${{ runner.temp }}/rust-assets
          TUI_DIR: ${{ runner.temp }}/rust-tui
          RUST_SERVER: ${{ steps.request.outputs.rust_server }}
          RUST_TUI: ${{ steps.request.outputs.rust_tui }}
        run: |
          mkdir -p "$DIST"
          name="graphite-meter-server_${VERSION}_linux_amd64_rust_third-party-source.tar.gz"
          if [ "$RUST_SERVER" = true ]; then
            cp "$SOURCE_DIR/THIRD_PARTY_SOURCE.tar.gz" "$DIST/$name"
          fi
          if [ "$RUST_TUI" = true ]; then
            base="graphite-meter-client_${VERSION}_linux_amd64_rust"
            cp "$TUI_DIR/$base.tar.gz" "$TUI_DIR/${base}_third-party-source.tar.gz" "$DIST/"
          fi
          cd "$DIST"
          sha256sum ./*.tar.gz | sed 's@  ./@  @' >checksums.txt

      - name: Upload untrusted prerelease Rust source offer
        if: steps.request.outputs.stable != 'true' && steps.request.outputs.rust != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rust-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-assets/
          if-no-files-found: error
          retention-days: 35

      - name: Record the OCI checksum
        working-directory: ${{ runner.temp }}/release-request
        env:
          RUST_SERVER: ${{ steps.request.outputs.rust_server }}
        run: |
          sha256sum graphite-meter.oci.tar >graphite-meter.oci.tar.sha256
          if [ "$RUST_SERVER" = true ]; then
            sha256sum graphite-meter-rust.oci.tar >graphite-meter-rust.oci.tar.sha256
          fi

      - name: Upload untrusted request and OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-request-${{ github.run_id }}
          path: ${{ runner.temp }}/release-request/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload untrusted stable assets
        if: steps.request.outputs.stable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
