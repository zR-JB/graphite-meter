name: _Publish exact OCI tag

on:
  workflow_call:
    inputs:
      artifact:
        description: Artifact in the caller run containing graphite-meter.oci.tar
        required: true
        type: string
      tag:
        description: Exact GHCR tag without a leading v
        required: true
        type: string
      expected_sha256:
        description: SHA-256 of graphite-meter.oci.tar
        required: true
        type: string
      source_sha:
        description: Exact source commit that was authorized for this image
        required: true
        type: string
      trusted_main_sha:
        description: Exact main tip bound to the authorization transaction
        required: true
        type: string
      pr_number:
        description: PR number for prerelease freshness checks; empty for stable releases
        required: false
        default: ''
        type: string

# Serialize the check-then-copy transaction for one immutable destination tag.
concurrency:
  group: publish-oci-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact immutable image tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
      packages: write
    env:
      SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:c7d3c512612f52805023cd38351081dad7e2729fc13d14b701e47c7c8bdd6615
      SKOPEO_VERSION: 1.22.2
    steps:
      - name: Download verified OCI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/image

      - name: Verify trusted archive checksum
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          actual=$(sha256sum "$RUNNER_TEMP/image/graphite-meter.oci.tar" | awk '{print $1}')
          [[ "$actual" == "$EXPECTED_SHA256" ]] || {
            echo "::error::trusted OCI archive checksum mismatch"
            exit 1
          }
          echo "::notice::verified OCI handoff sha256:$actual"

      - name: Publish exact tag idempotently
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRUSTED_MAIN_SHA: ${{ inputs.trusted_main_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid source SHA" >&2; exit 1; }
          [[ "$TRUSTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid trusted main SHA" >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]] || {
            echo "invalid immutable image tag: $IMAGE_TAG" >&2
            exit 1
          }

          # Minimize the residual queue gap after the post-approval trust recheck.
          # This job still executes no repository code: it performs only API reads
          # immediately before authenticating to the registry.
          current_main=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          [[ "$current_main" == "$TRUSTED_MAIN_SHA" ]] || {
            echo "main changed after authorization: trusted $TRUSTED_MAIN_SHA, current $current_main" >&2
            exit 1
          }
          if [[ -z "$PR_NUMBER" ]]; then
            [[ "$TRUSTED_MAIN_SHA" == "$SOURCE_SHA" ]] || {
              echo "stable source is not the trusted main SHA" >&2
              exit 1
            }
          else
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "invalid prerelease PR number" >&2; exit 1; }
            pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
            jq -e \
              --arg repo "$REPOSITORY" \
              --arg sha "$SOURCE_SHA" \
              '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha' \
              <<<"$pr" >/dev/null || {
                echo "prerelease PR state/head changed after final approval recheck" >&2
                exit 1
              }
            comparison=$(gh api "repos/$REPOSITORY/compare/$TRUSTED_MAIN_SHA...$SOURCE_SHA")
            jq -e --arg main "$TRUSTED_MAIN_SHA" \
              '.behind_by == 0 and .merge_base_commit.sha == $main' \
              <<<"$comparison" >/dev/null || {
                echo "prerelease source no longer contains current main" >&2
                exit 1
              }
          fi
          echo "::notice::live source freshness check passed immediately before registry authentication"

          image="ghcr.io/${REPOSITORY,,}"
          docker run --rm --entrypoint /bin/sh \
            -e REGISTRY_TOKEN="$REGISTRY_TOKEN" \
            -e REGISTRY_ACTOR="$REGISTRY_ACTOR" \
            -e IMAGE="$image" \
            -e IMAGE_TAG="$IMAGE_TAG" \
            -e SKOPEO_VERSION="$SKOPEO_VERSION" \
            -v "$RUNNER_TEMP/image:/work:ro" \
            "$SKOPEO_IMAGE" -ec '
              set -eu
              auth_dir=$(mktemp -d)
              error_file=$(mktemp)
              cleanup() {
                skopeo logout ghcr.io >/dev/null 2>&1 || true
                rm -rf "$auth_dir" "$error_file"
              }
              trap cleanup EXIT
              export REGISTRY_AUTH_FILE="$auth_dir/auth.json"

              skopeo --version | grep -F "skopeo version $SKOPEO_VERSION " >/dev/null
              source_digest=$(skopeo inspect --format "{{.Digest}}" oci-archive:/work/graphite-meter.oci.tar)
              printf "%s" "$REGISTRY_TOKEN" | skopeo login ghcr.io \
                --username "$REGISTRY_ACTOR" --password-stdin

              if destination_digest=$(skopeo inspect --format "{{.Digest}}" "docker://$IMAGE:$IMAGE_TAG" 2>"$error_file"); then
                if [ "$destination_digest" = "$source_digest" ]; then
                  echo "$IMAGE:$IMAGE_TAG already points at $source_digest; publication already complete"
                  exit 0
                fi
                echo "$IMAGE:$IMAGE_TAG already exists with digest $destination_digest, expected $source_digest" >&2
                exit 1
              fi

              if ! grep -Eiq "manifest unknown|name unknown|not found|404" "$error_file"; then
                cat "$error_file" >&2
                echo "registry lookup failed; refusing to publish" >&2
                exit 1
              fi

              skopeo copy --all --preserve-digests \
                oci-archive:/work/graphite-meter.oci.tar \
                "docker://$IMAGE:$IMAGE_TAG"

              destination_digest=$(skopeo inspect --format "{{.Digest}}" "docker://$IMAGE:$IMAGE_TAG")
              [ "$destination_digest" = "$source_digest" ] || {
                echo "published digest $destination_digest does not match source $source_digest" >&2
                exit 1
              }
              echo "published $IMAGE:$IMAGE_TAG @ $destination_digest"
            '
