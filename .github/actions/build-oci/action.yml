name: Build Graphite Meter OCI archive
description: Build the production multi-platform OCI archive from the checked-out source
inputs:
  version:
    description: Image/application version without the leading v
    required: true
  revision:
    description: Exact 40-character Git revision stamped into OCI labels
    required: true
  output:
    description: Destination path for the OCI archive
    required: true
  client-validate:
    description: Run client validation inside the Docker build
    required: false
    default: '0'
runs:
  using: composite
  steps:
    - id: versions
      name: Read repository Bun version
      shell: bash
      run: echo "bun=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"

    - name: Prepare OCI output directory
      shell: bash
      env:
        OCI_OUTPUT: ${{ inputs.output }}
      run: mkdir -p "$(dirname "$OCI_OUTPUT")"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      with:
        platforms: arm64

    - name: Set up Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Build linux/amd64 + linux/arm64 OCI archive
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: container/Dockerfile
        platforms: linux/amd64,linux/arm64
        outputs: type=oci,dest=${{ inputs.output }}
        provenance: mode=max
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.revision }}
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.licenses=AGPL-3.0-or-later
        build-args: |
          VERSION=${{ inputs.version }}
          GM_CLIENT_BUILD_LABEL=prod
          GM_CLIENT_VALIDATE=${{ inputs.client-validate }}
          BUN_VERSION=${{ steps.versions.outputs.bun }}
