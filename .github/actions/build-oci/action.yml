name: Build Graphite Meter OCI archive
description: Build production OCI images and Rust artifact exports from trusted local source or an exact remote Git commit
inputs:
  version:
    description: Image/application version without the leading v
    required: true
  revision:
    description: Exact 40-character Git revision stamped into OCI labels
    required: true
  output:
    description: Destination OCI archive or export directory
    required: true
  source-sha:
    description: Optional exact 40-character commit fetched directly by BuildKit; empty uses the trusted local checkout
    required: false
    default: ''
  client-validate:
    description: Run client validation inside the Docker build
    required: false
    default: '0'
  implementation:
    description: Go multi-platform or experimental Rust AMD64 image
    default: go
  target:
    description: Optional Rust artifact export stage
    default: ''
  output-type:
    description: OCI image or local source export
    default: oci
runs:
  using: composite
  steps:
    - id: source
      name: Resolve isolated OCI build context
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        IMPLEMENTATION: ${{ inputs.implementation }}
        VERSION: ${{ inputs.version }}
        TARGET: ${{ inputs.target }}
        OUTPUT_TYPE: ${{ inputs.output-type }}
      run: |
        set -euo pipefail
        if [[ -z "$SOURCE_SHA" ]]; then
          context='.'
        else
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "remote OCI source SHA must be exactly 40 lowercase hexadecimal characters" >&2
            exit 2
          }
          context="https://github.com/${REPOSITORY}.git#${SOURCE_SHA}"
        fi
        case "$IMPLEMENTATION" in
          go) file=container/Dockerfile; platforms=linux/amd64,linux/arm64; version=$VERSION ;;
          rust) file=container/Dockerfile.rust; platforms=linux/amd64; version=${VERSION%-rust} ;;
          *) echo "invalid image implementation" >&2; exit 2 ;;
        esac
        case "$IMPLEMENTATION/$OUTPUT_TYPE/$TARGET" in
          go/oci/|rust/oci/|rust/local/server-artifacts|rust/local/tui-artifacts) ;;
          *) echo "invalid build export" >&2; exit 2 ;;
        esac
        echo "version=$version" >>"$GITHUB_OUTPUT"
        echo "file=$file" >>"$GITHUB_OUTPUT"
        echo "platforms=$platforms" >>"$GITHUB_OUTPUT"
        echo "context=$context" >>"$GITHUB_OUTPUT"

    - name: Prepare OCI output directory
      shell: bash
      env:
        OCI_OUTPUT: ${{ inputs.output }}
      run: mkdir -p "$(dirname "$OCI_OUTPUT")"

    - name: Set up QEMU
      if: inputs.implementation == 'go'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        # setup-qemu runs this image privileged to register binfmt. Pin the
        # secondary image as tightly as the Action that launches it.
        image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
        cache-image: 'false'

    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.37.1
        driver-opts: image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
        cache-binary: 'false'
        # Supplying any explicit flags resets setup-buildx's default
        # security.insecure/network.host entitlements. This build needs neither.
        buildkitd-flags: --log-level=info

    - name: Build selected release output
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        # Avoid an extra build-record artifact from this untrusted/verification build.
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: ${{ steps.source.outputs.context }}
        file: ${{ steps.source.outputs.file }}
        platforms: ${{ steps.source.outputs.platforms }}
        target: ${{ inputs.target }}
        outputs: type=${{ inputs.output-type }},dest=${{ inputs.output }}
        no-cache: true
        provenance: mode=max
        # Public exact-commit Git contexts do not need a repository credential.
        # Keeping this empty prevents the default github.token from entering BuildKit.
        github-token: ''
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.revision }}
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.licenses=AGPL-3.0-or-later
        build-args: |
          VERSION=${{ steps.source.outputs.version }}
          CLIENT_VERSION=${{ steps.source.outputs.version }}
          GM_CLIENT_BUILD_PROFILE=prod
          GM_CLIENT_REVISION=${{ inputs.revision }}
          GM_CLIENT_VALIDATE=${{ inputs.client-validate }}
