name: Build Graphite Meter OCI archive
description: Build the production multi-platform OCI archive from trusted local source or an exact remote Git commit
inputs:
  implementation:
    description: Server implementation; Go remains the default
    required: false
    default: go
  source-output:
    description: Optional directory for the Rust server dependency-source export
    required: false
    default: ''
  version:
    description: Image/application version without the leading v
    required: true
  revision:
    description: Exact 40-character Git revision stamped into OCI labels
    required: true
  output:
    description: Destination path for the OCI archive
    required: true
  source-sha:
    description: Optional exact 40-character commit fetched directly by BuildKit; empty uses the trusted local checkout
    required: false
    default: ''
  client-validate:
    description: Run client validation inside the Docker build
    required: false
    default: '0'
runs:
  using: composite
  steps:
    - id: source
      name: Resolve isolated OCI build context
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        IMPLEMENTATION: ${{ inputs.implementation }}
        VERSION: ${{ inputs.version }}
        SOURCE_OUTPUT: ${{ inputs.source-output }}
      run: |
        set -euo pipefail
        if [[ -z "$SOURCE_SHA" ]]; then
          context='.'
        else
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "remote OCI source SHA must be exactly 40 lowercase hexadecimal characters" >&2
            exit 2
          }
          context="https://github.com/${REPOSITORY}.git#${SOURCE_SHA}"
        fi
        case "$IMPLEMENTATION" in
          go)
            [[ -z "$SOURCE_OUTPUT" ]] || { echo "source-output is Rust-only" >&2; exit 2; }
            dockerfile=container/Dockerfile
            platforms=linux/amd64,linux/arm64
            image_version="$VERSION"
            ;;
          rust)
            dockerfile=container/Dockerfile.rust
            platforms=linux/amd64
            image_version="${VERSION}-rust"
            ;;
          *) echo "unknown server implementation" >&2; exit 2 ;;
        esac
        echo "context=$context" >>"$GITHUB_OUTPUT"
        echo "dockerfile=$dockerfile" >>"$GITHUB_OUTPUT"
        echo "platforms=$platforms" >>"$GITHUB_OUTPUT"
        echo "image_version=$image_version" >>"$GITHUB_OUTPUT"

    - id: versions
      name: Read trusted repository Bun version
      shell: bash
      run: |
        set -euo pipefail
        bun=$(python3 scripts/ci/toolchains.py get runtime.bun)
        [[ -n "$bun" ]] || { echo "trusted mise.toml Bun version is empty" >&2; exit 2; }
        echo "bun=$bun" >>"$GITHUB_OUTPUT"

    - name: Prepare OCI output directory
      shell: bash
      env:
        OCI_OUTPUT: ${{ inputs.output }}
      run: mkdir -p "$(dirname "$OCI_OUTPUT")"

    - name: Set up QEMU
      if: inputs.implementation == 'go'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        # setup-qemu runs this image privileged to register binfmt. Pin the
        # secondary image as tightly as the Action that launches it.
        image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
        cache-image: 'false'

    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.37.1
        driver-opts: image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
        cache-binary: 'false'
        # Supplying any explicit flags resets setup-buildx's default
        # security.insecure/network.host entitlements. This build needs neither.
        buildkitd-flags: --log-level=info

    - name: Build selected implementation OCI archive
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        # Avoid an extra build-record artifact from this untrusted/verification build.
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: ${{ steps.source.outputs.context }}
        file: ${{ steps.source.outputs.dockerfile }}
        platforms: ${{ steps.source.outputs.platforms }}
        outputs: type=oci,dest=${{ inputs.output }}
        no-cache: true
        provenance: mode=max
        # Public exact-commit Git contexts do not need a repository credential.
        # Keeping this empty prevents the default github.token from entering BuildKit.
        github-token: ''
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.revision }}
          org.opencontainers.image.version=${{ steps.source.outputs.image_version }}
          io.graphite-meter.implementation=${{ inputs.implementation }}
          org.opencontainers.image.licenses=AGPL-3.0-or-later
        build-args: |
          VERSION=${{ inputs.version }}
          CLIENT_VERSION=${{ inputs.version }}
          GM_CLIENT_BUILD_PROFILE=prod
          GM_CLIENT_REVISION=${{ inputs.revision }}
          GM_CLIENT_VALIDATE=${{ inputs.client-validate }}
          BUN_VERSION=${{ steps.versions.outputs.bun }}

    - name: Export Rust server dependency source from the same build graph
      if: inputs.implementation == 'rust' && inputs.source-output != ''
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: ${{ steps.source.outputs.context }}
        file: container/Dockerfile.rust
        target: server-artifacts
        platforms: linux/amd64
        outputs: type=local,dest=${{ inputs.source-output }}
        github-token: ''
        build-args: |
          VERSION=${{ inputs.version }}
          CLIENT_VERSION=${{ inputs.version }}
          GM_CLIENT_BUILD_PROFILE=prod
          GM_CLIENT_REVISION=${{ inputs.revision }}
          GM_CLIENT_VALIDATE=${{ inputs.client-validate }}
          BUN_VERSION=${{ steps.versions.outputs.bun }}
