name: Setup Graphite Meter project
description: Install the job's pinned tools with mise and optional dependencies
inputs:
  python:
    description: Include the pinned Python type checker and workflow linters
    required: false
    default: 'false'
  go:
    description: Include the pinned Go toolchain
    required: false
    default: 'false'
  bun:
    description: Include the pinned Bun runtime
    required: false
    default: 'false'
  client-deps:
    description: Install frozen client dependencies
    required: false
    default: 'false'
  rust:
    description: Install the pinned Rust toolchain and verify it against its channel manifest
    required: false
    default: 'false'
  cache:
    description: Cache mise tools, Go modules and build results, Bun packages, and Cargo downloads and builds
    required: false
    default: 'true'
  staticcheck:
    description: Include pinned staticcheck
    required: false
    default: 'false'
  govulncheck:
    description: Include pinned govulncheck
    required: false
    default: 'false'
  gitleaks:
    description: Include pinned Gitleaks
    required: false
    default: 'false'
  cargo-deny:
    description: Include pinned cargo-deny
    required: false
    default: 'false'
  cargo-nextest:
    description: Include pinned cargo-nextest
    required: false
    default: 'false'
outputs:
  chrome-version:
    description: Exact Chrome for Testing version from mise.toml
    value: ${{ steps.versions.outputs.chrome }}
  firefox-version:
    description: Exact Firefox version from mise.toml
    value: ${{ steps.versions.outputs.firefox }}
  firefox-sha256:
    description: SHA-256 of that Firefox release's Linux archive, from mise.toml
    value: ${{ steps.versions.outputs.firefox-sha256 }}
runs:
  using: composite
  steps:
    - id: tools
      name: Select this job's tools
      shell: bash
      env:
        INCLUDE_PYTHON_TOOLS: ${{ inputs.python }}
        INCLUDE_GO: ${{ inputs.go }}
        INCLUDE_BUN: ${{ inputs.bun }}
        INCLUDE_STATICCHECK: ${{ inputs.staticcheck }}
        INCLUDE_GOVULNCHECK: ${{ inputs.govulncheck }}
        INCLUDE_GITLEAKS: ${{ inputs.gitleaks }}
        INCLUDE_CARGO_DENY: ${{ inputs.cargo-deny }}
        INCLUDE_CARGO_NEXTEST: ${{ inputs.cargo-nextest }}
      run: |
        tools=(python)
        if [[ "$INCLUDE_GO" == true ]]; then tools+=(go); fi
        if [[ "$INCLUDE_BUN" == true ]]; then tools+=(bun); fi
        if [[ "$INCLUDE_PYTHON_TOOLS" == true ]]; then tools+=(aqua:astral-sh/ty aqua:rhysd/actionlint aqua:zizmorcore/zizmor); fi
        if [[ "$INCLUDE_STATICCHECK" == true ]]; then tools+=(go:honnef.co/go/tools/cmd/staticcheck); fi
        if [[ "$INCLUDE_GOVULNCHECK" == true ]]; then tools+=(go:golang.org/x/vuln/cmd/govulncheck); fi
        if [[ "$INCLUDE_GITLEAKS" == true ]]; then tools+=(aqua:gitleaks/gitleaks); fi
        if [[ "$INCLUDE_CARGO_DENY" == true ]]; then tools+=(aqua:EmbarkStudios/cargo-deny); fi
        if [[ "$INCLUDE_CARGO_NEXTEST" == true ]]; then tools+=(aqua:nextest-rs/nextest/cargo-nextest); fi
        printf 'install-args=%s\n' "${tools[*]}" >> "$GITHUB_OUTPUT"

    - name: Install pinned mise toolchain
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      env:
        MISE_AUTO_INSTALL: '0'
      with:
        version: 2026.9.14
        install_args: --locked ${{ steps.tools.outputs.install-args }}
        cache: ${{ inputs.cache }}

    # The steps below run python3, which a Windows Python build may name python.exe only.
    - name: Name the pinned Python python3 on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        python=$(mise which python)
        [ -e "$(dirname "$python")/python3.exe" ] || cp "$python" "$(dirname "$python")/python3.exe"

    - id: versions
      name: Read toolchain metadata and keep task installs explicit
      shell: bash
      run: |
        printf 'MISE_AUTO_INSTALL=0\n' >> "$GITHUB_ENV"
        chrome=$(python3 scripts/ci/toolchains.py get browser.chrome)
        firefox=$(python3 scripts/ci/toolchains.py get browser.firefox)
        firefox_sha256=$(python3 scripts/ci/toolchains.py get browser.firefox_sha256)
        go=$(python3 scripts/ci/toolchains.py get runtime.go)
        bun=$(python3 scripts/ci/toolchains.py get runtime.bun)
        printf 'chrome=%s\nfirefox=%s\nfirefox-sha256=%s\ngo=%s\nbun=%s\n' \
          "$chrome" "$firefox" "$firefox_sha256" "$go" "$bun" >> "$GITHUB_OUTPUT"

    - id: go-cache
      name: Locate Go caches
      if: inputs.go == 'true' && inputs.cache == 'true'
      shell: bash
      run: |
        printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules and build results
      if: inputs.go == 'true' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-cache.outputs.modules }}
          ${{ steps.go-cache.outputs.build }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.versions.outputs.go }}-${{ hashFiles('go/go.sum') }}

    - name: Show Go version and download dependencies
      if: inputs.go == 'true'
      shell: bash
      run: |
        go version
        cd go && go mod download

    - name: Show Bun version
      if: inputs.bun == 'true'
      shell: bash
      run: |
        bun --version
        bun --revision

    - name: Cache Bun packages
      if: inputs.client-deps == 'true' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.bun }}-${{ hashFiles('client/bun.lock') }}

    - name: Install client dependencies
      if: inputs.client-deps == 'true'
      shell: bash
      run: cd client && bun install --frozen-lockfile --prefer-offline

    - name: Install and verify the pinned Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: |
        (cd rust && rustup toolchain install --no-self-update)
        python3 scripts/ci/toolchains.py verify-rust

    - name: Cache Cargo downloads and builds
      if: inputs.rust == 'true' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          rust/target
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
