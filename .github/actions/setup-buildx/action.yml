name: Set up pinned Buildx
description: Buildx and BuildKit at the release build's versions, without a cached binary or insecure entitlements
outputs:
  name:
    description: The builder, which `docker build` uses only when BUILDX_BUILDER names it
    value: ${{ steps.buildx.outputs.name }}
runs:
  using: composite
  steps:
    - id: buildx
      name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.0
        driver-opts: image=docker.io/moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
        cache-binary: 'false'
        # Runners are discarded after the job; removing the builder only costs its post step.
        cleanup: 'false'
        # Supplying any explicit flags resets setup-buildx's default
        # security.insecure/network.host entitlements. No build needs either.
        buildkitd-flags: --log-level=info
