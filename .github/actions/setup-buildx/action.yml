name: Set up pinned Buildx
description: Buildx and BuildKit at their reviewed versions, without a cached binary or insecure entitlements
runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.37.2
        driver-opts: image=docker.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
        cache-binary: 'false'
        # Supplying any explicit flags resets setup-buildx's default
        # security.insecure/network.host entitlements. No build needs either.
        buildkitd-flags: --log-level=info
