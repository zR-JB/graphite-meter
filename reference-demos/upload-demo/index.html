<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🚀 WebTransport Upload Client</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 WebTransport Upload Client</h1>
      <div class="status-bar">
        <span class="status-label">Status:</span>
        <span id="status" class="status-value init">Disconnected</span>
      </div>
    </header>

    <!-- Controls -->
    <section class="controls-section">
      <div class="control-group">
        <label>Transport Mode:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="transport" value="webtransport" checked>
            WebTransport (/api/upload)
          </label>
          <label class="radio-label">
            <input type="radio" name="transport" value="fetch">
            HTTP Fetch (/upload)
          </label>
        </div>
      </div>

      <div class="control-group">
        <label for="url">URL:</label>
        <input type="text" id="url" placeholder="URL" class="url-input" />
      </div>

      <div class="control-group">
        <label for="size">Upload Size:</label>
        <input type="number" id="size" value="100" min="0.000001" max="10000" step="0.001" class="size-input" />
        <span class="unit">MB</span>
      </div>

      <div class="control-group">
        <label for="workers">Workers:</label>
        <input type="number" id="workers" value="1" min="1" max="16" step="1" class="workers-input" />
      </div>

      <div class="control-group">
        <label for="measurement-mode">Measurement Mode:</label>
        <select id="measurement-mode">
          <option value="server">Server-based</option>
          <option value="client">Client-based</option>
        </select>
      </div>

      <div class="button-group">
        <button id="start-test-btn" class="btn btn-primary">Start Test</button>
        <button id="disconnect-btn" disabled class="btn btn-secondary">Disconnect</button>
        <button id="stop-btn" disabled class="btn btn-danger">Stop</button>
      </div>
    </section>

    <!-- Stats -->
    <section class="stats-section">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Uploaded (SI)</div>
          <div class="stat-value" id="total-mb">0</div>
          <div class="stat-unit">MB</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Uploaded (IEC)</div>
          <div class="stat-value" id="total-mib">0</div>
          <div class="stat-unit">MiB</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Speed (bits/s)</div>
          <div class="stat-value" id="speed-bits">0</div>
          <div class="stat-unit" id="speed-bits-unit">bps</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Speed (bytes/s, SI)</div>
          <div class="stat-value" id="speed-bytes-si">0</div>
          <div class="stat-unit" id="speed-bytes-si-unit">B/s</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Speed (bytes/s, IEC)</div>
          <div class="stat-value" id="speed-bytes-iec">0</div>
          <div class="stat-unit" id="speed-bytes-iec-unit">B/s</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Workers</div>
          <div class="stat-value" id="active-workers">0</div>
          <div class="stat-unit"></div>
        </div>
      </div>
    </section>

    <!-- Graph -->
    <section class="graph-section">
      <h3>Speed Over Time</h3>
      <canvas id="speed-graph" width="800" height="200"></canvas>
    </section>

    <!-- Log -->
    <section class="log-section">
      <div class="log-header">
        <h3>Activity Log</h3>
        <button onclick="clearLog()" class="btn btn-small">Clear</button>
      </div>
      <div id="log" class="log-container"></div>
    </section>
  </div>

  <script type="module" src="./main.js"></script>
  <script>
    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    function updateStatus(state, className) {
      const statusElement = document.getElementById('status');
      statusElement.textContent = state;
      statusElement.className = 'status-value ' + className;
    }

    window.updateStatus = updateStatus;
  </script>
</body>
</html>
