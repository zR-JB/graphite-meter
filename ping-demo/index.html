<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 WebTransport Ping Utility</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 WebTransport Ping Utility</h1>
            <div class="status-bar">
                <span class="status-label">Status:</span>
                <span id="status" class="status-value init">Disconnected</span>
            </div>
        </header>
        
        <section class="controls-section">
            <div class="control-group">
                <label for="url">WebTransport URL:</label>
                <input type="text" id="url" placeholder="WebTransport URL" class="url-input">
            </div>
            
            <div class="control-group">
                <label for="interval">Ping Interval:</label>
                <input type="number" id="interval" value="10" min="4" max="1000" step="0.1" class="interval-input">
                <span class="unit">ms</span>
            </div>
            
            <div class="button-group">
                <button onclick="app.connect()" class="btn btn-primary">Connect</button>
                <button onclick="app.disconnect()" disabled id="disconnect-btn" class="btn btn-secondary">Disconnect</button>
                <button onclick="app.startBenchmark()" disabled id="start-btn" class="btn btn-success">Start Test</button>
                <button onclick="app.stopBenchmark()" disabled id="stop-btn" class="btn btn-danger">Stop Test</button>
            </div>
        </section>
        
        <section class="stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Sent</div>
                    <div class="stat-value" id="sent">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Received</div>
                    <div class="stat-value" id="received">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Rate</div>
                    <div class="stat-value" id="rate">0/s</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Packet Loss</div>
                    <div class="stat-value" id="packet-loss">0.00%</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">Avg Latency</div>
                    <div class="stat-value" id="avg">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Min Latency</div>
                    <div class="stat-value" id="min">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Max Latency</div>
                    <div class="stat-value" id="max">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">P99 Latency</div>
                    <div class="stat-value" id="p99">-</div>
                </div>
            </div>
        </section>
        
        <section class="log-section">
            <div class="log-header">
                <h3>Activity Log</h3>
                <button onclick="clearLog()" class="btn btn-small">Clear</button>
            </div>
            <div id="log" class="log-container"></div>
        </section>
    </div>

    <script type="module" src="./main.js"></script>
    <script>
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        function updateStatus(state, className) {
            const statusElement = document.getElementById('status');
            statusElement.textContent = state;
            statusElement.className = 'status-value ' + className;
        }
        
        window.updateStatus = updateStatus;
    </script>
</body>
</html>
