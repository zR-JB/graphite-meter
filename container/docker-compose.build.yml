# Build-from-source overlay (developers / custom builds). Stack it on the
# default compose, and on any other overlay, from the repository root:
#   docker compose -f container/docker-compose.yml -f container/docker-compose.build.yml up --build -d
services:
  graphite-meter:
    # A local tag, so the build never shadows the published image.
    image: localhost/graphite-meter:source
    build:
      context: ..
      dockerfile: container/Dockerfile
      args:
        VERSION: "0.0.0-dev"
        GM_CLIENT_REVISION: "source"
