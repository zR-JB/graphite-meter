# Graphite Meter — build-from-source compose (developers / custom builds).
# For a normal deployment use the sibling docker-compose.yml, which pulls the
# published image instead of building.
#   docker compose -f container/docker-compose.build.yml up --build
services:
  graphite-meter:
    build:
      context: ..
      dockerfile: container/Dockerfile
      args:
        VERSION: "0.1.0"
        SERVER_IMPL: "go" # reserved: "rust" -> server-rs (future swap)
        # Client build knobs (defaults = prod: real-only, no dev tooling).
        # Uncomment to build a configurable multi-engine image with dev tools:
        # GM_CLIENT_ALLOW_DUMMY: "1"
        # GM_CLIENT_DEV_TOOLS: "1"
        # GM_CLIENT_ENGINE: "real"        # default runner when multiple are built in
        # GM_CLIENT_BUILD_LABEL: "0.1.0"  # status-bar + client-version label (default "prod")
    ports:
      - "8765:8765" # HTTP/1.1 (default)
      # - "8443:8443/tcp"  # TLS + HTTP/1.1/h2 (Stage 5)
      # - "8443:8443/udp"  # HTTP/3 + WebTransport (Stage 5)
    environment:
      # All optional; sensible defaults baked in. Set the PUBLIC_* origins when
      # running behind a reverse proxy so /preflight advertises reachable URLs.
      GM_SERVER_NAME: "graphite-meter"
      # GM_SERVER_LOCATION: "fra"
      # GM_TRUSTED_PROXIES: "172.30.0.0/24" # CIDR of your reverse proxy network
      # PUBLIC_H1_ORIGIN: "http://speed.example:8765"
      # GM_ADVERTISE_H3: "0"
    restart: unless-stopped
