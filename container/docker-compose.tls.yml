# TLS overlay from the repository root:
# docker compose -f container/docker-compose.yml -f container/docker-compose.tls.yml up -d
services:
  graphite-meter:
    ports:
      - "7247:7247/tcp" # dedicated HTTPS HTTP/1.1 throughput and WSS latency
      - "7248:7248/tcp" # HTTP/2-only measurement probe, transfers, and progress
      - "7249:7249/tcp" # HTTP/3 Alt-Svc bootstrap probe only
      - "7249:7249/udp" # HTTP/3 probe, transfers, progress, WebTransport
    environment:
      GM_H1_TLS_ADDR: ":7247"
      GM_H2_ADDR: ":7248"
      GM_H3_ADDR: ":7249"
      GM_TLS_CERT: /etc/letsencrypt/live/${GM_CERT_NAME:-graphite-meter}/fullchain.pem
      GM_TLS_KEY: /etc/letsencrypt/live/${GM_CERT_NAME:-graphite-meter}/privkey.pem
      GM_H1_TLS_PUBLIC_ORIGIN: https://${GM_PUBLIC_HOST}:7247
      GM_H2_PUBLIC_ORIGIN: https://${GM_PUBLIC_HOST}:7248
      GM_H3_PUBLIC_ORIGIN: https://${GM_PUBLIC_HOST}:7249
    volumes:
      # Mount the complete tree: live/ entries are symlinks into archive/.
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: docker.io/certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  letsencrypt:
  certbot-webroot:
