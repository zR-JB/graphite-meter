# Tool versions and task definitions have one owner. CI preinstalls its selected
# tools and sets MISE_AUTO_INSTALL=0; task outputs are never cached.
[tool_config]
locked = true

[tools]
bun = "1.4.2"
python = "3.14.7"
go = "1.27.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:dominikh/go-tools/staticcheck" = "2026.2.1"
"aqua:astral-sh/ty" = "0.0.84"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.145"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"

[vars]
mise_version = "2026.9.14"

browser_chrome = "153.0.8010.52"

codeql = "2.27.1"

image_skopeo = """
quay.io/containers/skopeo:v1.22.3-immutable\
@sha256:f45eb1e14223a5ba0da4246274679a083653dab1402acc1fcb70a6339b50cf00"""
image_bun = "docker.io/oven/bun:1.4.2@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895"
image_golang = "docker.io/library/golang:1.27.1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
image_binfmt = "docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"
# The experimental Rust image (container/Dockerfile.rust).
image_python = "docker.io/library/python:3.14.7-slim-bookworm@sha256:82bc3c539b8813ada9d68c63b40158fa002f7f33de9bf3312a3dfdc0620dff56"
image_rust = "docker.io/library/rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e"
image_distroless_cc = """
gcr.io/distroless/cc-debian13:nonroot\
@sha256:54df941ed0d06a1bd95ef5e0ce391fd8d9f94b64782dc9a60062727849ee3f97"""

[env]
CGO_ENABLED = "0"

[tasks.setup]
description = "Install pinned tools, dependencies, and the commit hook"
run = [
  "mise install",
  "cd client && bun install --frozen-lockfile --prefer-offline",
  "cd go && go mod download",
  "git config core.hooksPath .githooks",
  { task = "doctor" },
]

[tasks.doctor]
description = "Check local, CI, and Docker toolchain drift"
run = "python3 scripts/ci/toolchains.py doctor"

[tasks.toolchain-sync]
description = "Update required toolchain literals from mise.toml"
run = "python3 scripts/ci/toolchains.py sync"

[tasks.workflow-check]
description = "Lint workflows and validate trust boundaries"
run = [
  "actionlint -shellcheck= -pyflakes=",
  "zizmor --offline --no-progress --config .github/zizmor.yml .github",
  "python3 scripts/ci/workflow_policy.py",
]

[tasks.python-check]
shell = "bash -e -o pipefail -c"
description = "Type-check Python tools and tests"
run = '''
ty check scripts --python-version "$(python3 scripts/ci/toolchains.py python-target)" \
  --extra-search-path scripts/ci --error-on-warning
'''

[tasks.pipeline-test]
shell = "bash -e -o pipefail -c"
description = "Test release and prerelease control-plane behavior"
run = [
  { task = "python-check" },
  "python3 -m unittest discover -s scripts/ci -p 'test_*.py'",
  "python3 -m unittest discover -s scripts/legal -t .",
]

[tasks.secret-scan-ci]
description = "Scan the checked-out history with the pinned Gitleaks"
run = "gitleaks git --no-banner --redact --verbose"

# Ordered: generated assets, builds and legal scans must not race.
[tasks.check]
description = "Run the deterministic developer gate"
run = [
  { task = "workflow-check" },
  { task = "pipeline-test" },
  { task = "core-check" },
  { task = "server-test" },
  { task = "legal-check" },
]

[tasks.core-check]
description = "Run the component checks owned by the CI core job"
run = [
  { task = "doctor" },
  { task = "client-ci" },
  { task = "server-check" },
  { task = "staticcheck" },
]

[tasks.client-ci]
description = "Check client formatting, types, dependencies, and tests"
run = [
  "cd client && bun run format:check ../go/internal/auth/assets",
  { task = "client-check" },
  # Duplicate compatible versions are advisory; frozen installs enforce the lockfile.
  "cd client && bun dedupe --dry-run",
  { task = "client-test" },
]

[tasks.client-build-dev]
description = "Build the development client"
dir = "client"
env = { GM_CLIENT_BUILD_PROFILE = "dev", VERSION = false }
run = "bun run build"

[tasks.client-build-prod]
description = "Build the production client"
dir = "client"
env = { GM_CLIENT_BUILD_PROFILE = "prod" }
run = "bun run build"

[tasks._legal-run]
hide = true
usage = 'arg "[mode]" default="check"'
run = '''
#!/usr/bin/env sh
set -eu
scan=$(mktemp)
out=$(mktemp -d)
trap 'rm -f "$scan"; rm -rf "$out"' EXIT
(cd client && GM_LEGAL_SCAN_OUT="$scan" GM_LEGAL_SCAN_DIR="$out" bun run build:bundle -- --outDir "$out")
VERSION="${VERSION:-development}" GM_LEGAL_SCAN_MODULES="$scan" python3 -m scripts.legal --mode "$usage_mode"
'''

[tasks.legal-generate]
description = "Regenerate reviewed legal outputs"
run = [{ task = "_legal-run", args = ["generate"] }]

[tasks.legal-check]
description = "Validate runtime legal closure and generated metadata"
run = [{ task = "_legal-run", args = ["check"] }]

[tasks.legal-review]
shell = "bash -e -o pipefail -c"
description = "Print a legal audit or review template"
usage = 'arg "[mode]" default="audit"'
run = 'mise run _legal-run "review-${usage_mode?}"'

[tasks.client-check]
description = "Type-check the client and Bun tests"
dir = "client"
run = "bun run check"

[tasks.client-test]
description = "Run all browser-source unit tests"
dir = "client"
run = "bun test src --parallel"

[tasks.client-audit]
description = "Check the live registry advisory database"
dir = "client"
run = "bun audit"

[tasks.client-watch]
description = "Run the standalone Vite development server"
dir = "client"
raw = true
run = "bun run dev"

[tasks.auth-preview]
shell = "bash -e -o pipefail -c"
description = "Preview the no-JavaScript login page on loopback"
dir = "go"
raw = true
usage = '''
arg "[mode]" default="hybrid"
arg "[oidc_ready]" default="true"
'''
run = 'go run ./internal/auth/cmd/authpreview --mode "${usage_mode?}" --oidc-ready="${usage_oidc_ready?}"'

[tasks._embed-client]
hide = true
run = [
  "rm -rf go/internal/static/dist",
  "cp -R client/dist go/internal/static/dist",
  "touch go/internal/static/dist/.gitkeep",
]

[tasks.server-build-dev]
description = "Build the development server with embedded client assets"
run = [
  { task = "client-build-dev" },
  { task = "_embed-client" },
  'cd go && go build -ldflags="-s -w" -trimpath -o graphite-meter ./cmd/graphite-meter',
]

[tasks.server-build-prod]
shell = "bash -e -o pipefail -c"
description = "Build the stamped production server with embedded client assets"
run = [
  { task = "client-build-prod" },
  { task = "_embed-client" },
  '''
version=$(scripts/build-version.sh)
cd go && go build -trimpath -o graphite-meter \
  -ldflags="-s -w -X github.com/zR-JB/graphite-meter/go/internal/config.EngineVersion=$version" ./cmd/graphite-meter
''',
]

[tasks.server-check]
shell = "bash -e -o pipefail -c"
description = "Check Go formatting and vet, including the stress harness"
dir = "go"
run = [
  'test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }',
  "go vet ./...",
  "go vet -tags stress ./internal/server/",
]

[tasks.server-test]
description = "Run all Go tests, including loopback integration"
dir = "go"
run = "go test ./..."

[tasks.staticcheck]
description = "Run the pinned Go static analyzer"
dir = "go"
run = "staticcheck ./..."

[tasks.security]
description = "Scan Go dependencies against the live vulnerability database"
dir = "go"
run = "govulncheck ./..."

[tasks.server-race]
description = "Run Go race tests and enforce the 75% coverage floor"
dir = "go"
env = { CGO_ENABLED = "1" }
run = '''
#!/usr/bin/env sh
set -eu
go test -race -shuffle=on -coverprofile=cover.out ./...
total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
echo "total statement coverage: ${total}%"
if ! awk -v total="$total" 'BEGIN { exit !(total >= 75) }'; then
  echo "coverage ${total}% is below the 75% floor" >&2
  exit 1
fi
'''

[tasks._e2e-build]
hide = true
env = { GM_CLIENT_BUILD_PROFILE = "prod" }
run = [
  "cd client && bun run build:bundle && bun run build:e2e-harness",
  { task = "_embed-client" },
  "cd go && go build -trimpath -o ../client/test-results/graphite-meter ./cmd/graphite-meter",
]

[tasks.e2e]
description = "Run Chromium against one local server fleet"
dir = "client"
run = [{ task = "_e2e-build" }, "bun run scripts/e2e.ts"]

[tasks.bench-ui]
description = "Measure UI frame delivery against the local server fleet (manual)"
dir = "client"
run = [
  { task = "_e2e-build" },
  "bun run scripts/e2e.ts bun test ./bench/ui.bench.ts --no-orphans --timeout=600000",
]

[tasks.stress]
description = "Measure the server saturation envelope (Unix, manual)"
dir = "go"
run = "go test -tags stress -run TestSaturationEnvelope -v -timeout 30m -count=1 ./internal/server/"

[tasks.bench-wire]
shell = "bash -e -o pipefail -c"
description = "Benchmark Go and TypeScript wire codecs"
run = [
  "cd go && go test ./internal/wire/ -run '^$' -bench 'Decode|Encode' -benchmem -benchtime=2s",
  "cd client && bun run src/lib/runner/real/wire.bench.ts",
]

[tasks.bench-throughput]
shell = "bash -e -o pipefail -c"
description = "Measure throughput cells against the local server fleet (manual)"
dir = "client"
usage = 'arg "[filter]" default=""'
run = [
  { task = "_e2e-build" },
  'GM_BENCH_FILTER="${usage_filter?}" bun run scripts/e2e.ts bun test ./bench/throughput.bench.ts --no-orphans --timeout=1800000',
]

[tasks.codeql]
description = "Reproduce the CodeQL scan offline with the pinned CLI and count results per rule (manual)"
env = { GM_CODEQL_VERSION = "{{vars.codeql}}" }
run = "scripts/codeql.sh"

[tasks.bench-servers]
description = "Measure one, two, and four real servers in isolated Linux network namespaces (manual)"
run = [
  { task = "server-build-prod" },
  "bash client/bench/server-collection.sh",
]

[tasks.bench-matrix]
description = "Compare Go and Rust servers and clients on shaped paths in isolated Linux network namespaces (manual)"
env = { GM_MULTI_BENCH_PROFILES = "matrix", GM_MULTI_BENCH_REPEATS = "{{ get_env(name='GM_MULTI_BENCH_REPEATS', default='3') }}" }
run = [
  { task = "server-build-prod" },
  { task = "goclient-build" },
  'cd rust && GM_RUST_ASSET_DIR="$PWD/../client/dist" cargo build --release --locked --target-dir target -p graphite-meter-server',
  "cd rust && cargo build --release --locked --target-dir target -p graphite-meter-client",
  "bash client/bench/server-collection.sh",
]

[tasks.release-check]
description = "Validate release packages and third-party source without publishing"
usage = 'arg "[version]" default="development"'
run = '''
#!/usr/bin/env sh
set -eu
VERSION=$usage_version
export VERSION
mise run legal-check
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
RELEASE_DIST="$tmp/dist" mise run release-artifacts "$VERSION"
RELEASE_DIST="$tmp/dist" python3 scripts/ci/verify_release_assets.py "$VERSION"
'''

[tasks.release-artifacts]
description = "Build distributable native archives and checksums without publishing"
usage = 'arg "[version]" default="development"'
run = 'scripts/release-artifacts.sh "$usage_version"'

[tasks.container-smoke]
description = "Build and smoke-test the local production image"
env = { VERSION = "0.0.0-ci", GM_CLIENT_REVISION = "local", GM_CLIENT_VALIDATE = "0" }
run = [
  { task = "container-build", args = ["graphite-meter:smoke"] },
  "scripts/verify-container.sh graphite-meter:smoke",
]

# Mirrors CI job by job: server-race replaces check's server-test.
[tasks.ci]
description = "Run deterministic, race, advisory, browser, release, and container gates"
run = [
  { task = "workflow-check" },
  { task = "pipeline-test" },
  { task = "core-check" },
  { task = "legal-check" },
  { task = "server-race" },
  { task = "security" },
  { task = "client-audit" },
  { task = "secret-scan-ci" },
  { task = "e2e" },
  { task = "release-check" },
  { task = "container-smoke" },
]

[tasks.goclient-build]
shell = "bash -e -o pipefail -c"
description = "Build the stamped native TUI without browser assets"
run = '''
version=$(scripts/build-version.sh)
cd go && go build -trimpath -o graphite-meter-client \
  -ldflags="-s -w -X github.com/zR-JB/graphite-meter/go/internal/goclient.Version=$version" ./cmd/graphite-meter-client
'''

[tasks.tui]
shell = "bash -e -o pipefail -c"
description = "Run the native TUI; arguments after -- go to the client (e.g. -- -server http://host:7246)"
raw = true
run = '''
version=$(scripts/build-version.sh)
cd go && go run -ldflags="-X github.com/zR-JB/graphite-meter/go/internal/goclient.Version=$version" \
  ./cmd/graphite-meter-client "$@"
'''

[tasks.dev]
description = "Build the development client and run the embedded server"
raw = true
run = [
  { task = "client-build-dev" },
  { task = "_embed-client" },
  "cd go && go run ./cmd/graphite-meter",
]

[tasks.prod]
shell = "bash -e -o pipefail -c"
description = "Build the production client and run the stamped server"
raw = true
run = [
  { task = "client-build-prod" },
  { task = "_embed-client" },
  '''
version=$(scripts/build-version.sh)
cd go && go run \
  -ldflags="-X github.com/zR-JB/graphite-meter/go/internal/config.EngineVersion=$version" ./cmd/graphite-meter
''',
]

[tasks.container-build]
description = "Build the production Docker or Podman image"
usage = 'arg "[tag]" default="graphite-meter:latest"'
run = '''
#!/usr/bin/env sh
set -eu
engine=${CONTAINER_ENGINE:-$(command -v docker || command -v podman || echo docker)}
revision=${GM_CLIENT_REVISION:-$(git rev-parse --short HEAD 2>/dev/null || echo source)}
"$engine" build -f container/Dockerfile -t "$usage_tag" --build-arg VERSION="${VERSION:-$revision}" \
  --build-arg CLIENT_VERSION="${VERSION:-}" \
  --build-arg GM_CLIENT_REVISION="$revision" --build-arg GM_CLIENT_VALIDATE="${GM_CLIENT_VALIDATE:-1}" \
  --label org.opencontainers.image.licenses=AGPL-3.0-or-later .
'''

[tasks.rust-format]
description = "Format the experimental Rust workspace"
dir = "rust"
run = "cargo fmt --all"

[tasks.rust-server-build]
description = "Build the experimental Rust server"
run = "python3 scripts/run-rust-server.py --profile release --version \"${VERSION:-development}\" --build-only"

[tasks.rust-server-run]
description = "Run the experimental Rust server with GM_* configuration"
raw = true
run = "python3 scripts/run-rust-server.py --profile dev"

[tasks.rust-client-run]
description = "Run the experimental Rust TUI against a server"
dir = "rust"
raw = true
run = "cargo run --locked --bin graphite-meter-client --"

[tasks.rust-client-build]
description = "Build the experimental Rust TUI without browser assets"
dir = "rust"
run = "cargo build --release --locked --bin graphite-meter-client"

[tasks.rust-check]
description = "Check experimental Rust formatting, dependencies, lints, and tests"
dir = "rust"
run = [
  "cargo fmt --all --check",
  "python3 ../scripts/legal/check_git_sources.py",
  "cd .. && python3 -m scripts.legal.check_rust_reviews",
  "python3 ../scripts/ci/rust_crate_budget.py",
  "cargo deny --locked check",
  "cargo deny --manifest-path http3/fuzz/Cargo.toml --locked check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo nextest run --workspace --all-targets --locked",
]

[tasks.rust-fuzz]
description = "Fuzz one HTTP/3 codec target with libFuzzer on the pinned stable toolchain"
dir = "rust/http3/fuzz"
usage = '''
arg "<target>"
arg "[seconds]" default="60"
'''
run = '''
#!/usr/bin/env sh
set -eu
# Stable sancov flags; the explicit target keeps them off build scripts.
RUSTFLAGS="--cfg fuzzing -Cpasses=sancov-module -Cllvm-args=-sanitizer-coverage-level=4 \
-Cllvm-args=-sanitizer-coverage-inline-8bit-counters -Cllvm-args=-sanitizer-coverage-pc-table \
-Cllvm-args=-sanitizer-coverage-trace-compares -Cdebug-assertions -Coverflow-checks" \
  cargo build --locked --release --target x86_64-unknown-linux-gnu --bin "$usage_target"
mkdir -p "corpus/$usage_target" "artifacts/$usage_target"
"target/x86_64-unknown-linux-gnu/release/$usage_target" -max_total_time="$usage_seconds" -rss_limit_mb=512 \
  -artifact_prefix="artifacts/$usage_target/" "corpus/$usage_target"
'''

[tasks.rust-client-package]
description = "Package the experimental Linux and Windows Rust TUIs in the reviewed builder image"
usage = 'arg "[version]" default="development"'
run = '''
#!/usr/bin/env sh
set -eu
engine=${CONTAINER_ENGINE:-$(command -v docker || command -v podman || echo docker)}
"$engine" build -f container/Dockerfile.rust --target tui-artifacts --build-arg VERSION="$usage_version" \
  --output "type=local,dest=${RELEASE_DIST:-go/dist}" .
'''

[tasks.rust-container-build]
description = "Build the experimental Rust server image with Docker or Podman on an amd64 host"
usage = 'arg "[tag]" default="graphite-meter:latest-rust"'
run = '''
#!/usr/bin/env sh
set -eu
engine=${CONTAINER_ENGINE:-$(command -v docker || command -v podman || echo docker)}
revision=${GM_CLIENT_REVISION:-$(git rev-parse --short HEAD 2>/dev/null || echo source)}
# One VERSION stamps the server, browser and SOURCE.txt; default to the Dockerfile's, not a revision.
"$engine" build -f container/Dockerfile.rust --target server -t "$usage_tag" --build-arg VERSION="${VERSION:-0.0.0-dev}" \
  --build-arg GM_CLIENT_REVISION="$revision" --build-arg GM_CLIENT_VALIDATE="${GM_CLIENT_VALIDATE:-1}" \
  --label org.opencontainers.image.licenses=AGPL-3.0-or-later .
'''
