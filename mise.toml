# Tool versions and task definitions have one owner. CI preinstalls its selected
# tools and sets MISE_AUTO_INSTALL=0; task outputs are never cached.
[tool_config]
locked = true

[tools]
bun = "1.4.4"
python = "3.15.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:astral-sh/ty" = "0.0.91"
"github:jdx/jactionlint" = "2.3.0"
"aqua:zizmorcore/zizmor" = "1.31.1"
"aqua:biomejs/biome" = "2.6.2"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.149"

[vars]
mise_version = "2026.10.17"
buildx_version = "v0.38.1"

browser_chrome = "156.0.8078.47"
browser_firefox = "158.0.1"
# SHA-256 of ftp.mozilla.org's linux-x86_64/en-US/firefox-<version>.tar.xz, from the release's SHA256SUMS.
browser_firefox_sha256 = "dce45470139242cf294eb6ada3d192a9bb334696842b02b71ade448a139eb41a"

codeql = "2.27.3"

image_skopeo = """
quay.io/containers/skopeo:v1.22.3-immutable\
@sha256:f45eb1e14223a5ba0da4246274679a083653dab1402acc1fcb70a6339b50cf00"""
image_bun = "docker.io/oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d"
image_buildkit = "docker.io/moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c"
image_binfmt = "docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"
# The image's builder (container/Dockerfile).
image_python = "docker.io/library/python:3.15.1-slim-trixie@sha256:533b0b2f9b5d46fd097091cf826f27902f1d6c3bca714b6dc74551356aa97a51"
image_rust = "docker.io/library/rust:1.99.1-trixie@sha256:931c2c0531a8b143e044f0f3914dfe802f15bb3d1955f0b657e9359327ac2ffc"

# SHA-256 of static.rust-lang.org/dist/channel-rust-<channel>.toml for rust/rust-toolchain.toml's channel.
rust_manifest_sha256 = "fb152be80975c194aa5fc684b2aec3a6e14e2b855efe2faa4e5f8ae6e590f463"
# The llvm-mingw release that cross-links the Windows arm64 client, and the SHA-256 of its
# llvm-mingw-<release>-ucrt-ubuntu-22.04-x86_64.tar.xz.
llvm_mingw = "20261020"
llvm_mingw_sha256 = "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335"

[tasks.setup]
description = "Install pinned tools, dependencies, and the commit hook"
run = [
  "mise install",
  { task = "client-install" },
  "git config core.hooksPath .githooks",
  { task = "doctor" },
]

[tasks.client-install]
description = "Install the browser client's locked dependencies"
dir = "client"
run = "bun install --frozen-lockfile --prefer-offline"

[tasks.doctor]
description = "Check local, CI, and Docker toolchain drift"
run = "python3 scripts/ci/toolchains.py doctor"

[tasks.browser-bump]
description = "Pin the latest stable Chrome for Testing and Firefox"
run = "python3 scripts/ci/toolchains.py latest-browsers --write"

[tasks.toolchain-sync]
description = "Update required toolchain literals from mise.toml"
run = "python3 scripts/ci/toolchains.py sync"

[tasks.workflow-check]
description = "Lint workflows and validate trust boundaries"
run = [
  "jactionlint --no-online --shellcheck= --pyflakes=",
  "zizmor --offline --no-progress --config .github/zizmor.yml .github",
  "python3 scripts/ci/workflow_policy.py",
]

[tasks.python-check]
shell = "bash -e -o pipefail -c"
description = "Type-check Python tools and tests"
run = '''
ty check scripts rust/interop --python-version "$(python3 scripts/ci/toolchains.py python-target)" \
  --extra-search-path scripts/ci --error-on-warning
'''

[tasks.pipeline-test]
description = "Test the release, legal and workflow tooling"
run = [
  { task = "python-check" },
  "python3 -m unittest discover -s scripts/ci -p 'test_*.py'",
  "python3 -m unittest discover -s scripts/legal -t .",
]

[tasks.secret-scan-ci]
description = "Scan the checked-out history with the pinned Gitleaks"
run = "gitleaks git --no-banner --redact --verbose"

[tasks.check]
description = "Run the developer gate"
run = [
  { task = "workflow-check" },
  { task = "pipeline-test" },
  { task = "client-ci" },
  { task = "rust-check" },
]

[tasks.client-ci]
description = "Check client formatting, lints, types, dependencies, and tests"
run = [
  { task = "doctor" },
  "cd client && bun run lint",
  { task = "client-check" },
  # Duplicate compatible versions are advisory; frozen installs enforce the lockfile.
  "cd client && bun dedupe --dry-run",
  { task = "client-test" },
]

[tasks.client-check]
description = "Type-check the client and Bun tests"
dir = "client"
run = "bun run check"

[tasks.client-test]
description = "Run all browser-source unit tests"
dir = "client"
run = "bun test src --parallel"

[tasks.client-audit]
description = "Check the live registry advisory database"
dir = "client"
run = "bun audit"

[tasks.rust-format]
description = "Format the Rust workspace"
dir = "rust"
run = "cargo fmt --all"

# Ordered: static policy checks run before the workspace compiles.
[tasks.rust-check]
description = "Check Rust formatting, dependency policy, lints, and tests"
dir = "rust"
run = [
  "cargo fmt --all --check",
  "cd .. && python3 -m scripts.legal.check_git_sources",
  "cd .. && python3 -m scripts.legal.check_rust_reviews",
  { task = "rust-deny-fetch" },
  "cargo deny --locked --offline check",
  "cd .. && python3 -m scripts.legal.check_fork_advisories",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo nextest run --workspace --all-targets --locked --no-fail-fast",
]

[tasks.rust-deny-fetch]
shell = "bash -e -o pipefail -c"
description = "Fetch the live advisory database and the locked crates for cargo deny, retrying transient failures"
dir = "rust"
run = '''
for attempt in 1 2 3; do
  timeout 120 cargo deny --locked fetch db index && exit 0
  echo "cargo deny fetch failed (attempt $attempt of 3)" >&2
  [ "$attempt" = 3 ] || sleep 15
done
echo "cargo deny fetch failed 3 times; not checking against a stale advisory database" >&2
exit 1
'''

[tasks.rust-check-targets]
shell = "bash -e -o pipefail -c"
description = "Check the shipped client and server targets (needs mingw-w64, llvm-mingw, musl-tools and an aarch64 GNU compiler)"
dir = "rust"
env = { CC_x86_64_unknown_linux_musl = "x86_64-linux-musl-gcc", CC_aarch64_unknown_linux_musl = "aarch64-linux-gnu-gcc" }
run = '''
tui=($(python3 ../scripts/ci/workspace.py targets tui))
server=($(python3 ../scripts/ci/workspace.py targets server))
rustup target add $(printf '%s\n' "${tui[@]}" "${server[@]}" | sort -u)
cargo check --locked -p graphite-meter-client "${tui[@]/#/--target=}"
cargo check --locked -p graphite-meter-server "${server[@]/#/--target=}"
'''

[tasks.delayed-downloads]
shell = "bash -e -o pipefail -c"
description = "Gate delayed-link HTTP/3 and WebTransport download throughput; a run that measures nothing fails"
dir = "rust"
run = '''
log=$(mktemp)
trap 'rm -f "$log"' EXIT
cargo nextest run --locked --cargo-profile ci -p graphite-meter-server --test sockets --run-ignored only \
  --no-tests=fail --no-capture -E 'test(=delayed::quic_downloads_outgrow_a_fixed_window)' 2>&1 | tee "$log"
# The gate passes without measuring when loopback cannot reach its baseline; that proves nothing.
if grep -q '^inconclusive:' "$log"; then
  echo "delayed downloads were not measured: loopback was below the baseline" >&2
  exit 1
fi
'''

# Local builds embed development notices: their executables say UNREVIEWED DEVELOPMENT BUILD and are not
# distributable. dev, tui and e2e-server use the ci profile (no LTO, 16 codegen units), the build tasks the release profile.
# mise appends a raw task's arguments to its script's last line, so those scripts end by running the binary.
[tasks.dev]
description = "Run the server with the development browser app; arguments after -- go to the server"
raw = true
run = [
  "python3 -m scripts.build --package graphite-meter-server --profile ci --browser dev",
  "cd rust && exec target/ci/graphite-meter-server",
]

[tasks.tui]
description = "Run the terminal client; arguments after -- go to it"
raw = true
run = [
  "python3 -m scripts.build --package graphite-meter-client --profile ci",
  "cd rust && exec target/ci/graphite-meter-client",
]

[tasks.server-build]
shell = "bash -e -o pipefail -c"
description = "Build rust/target/release/graphite-meter-server with the production browser app"
run = '''
version=$(scripts/build-version.sh)
python3 -m scripts.build --package graphite-meter-server --profile release --browser prod --version "$version"
'''

[tasks.tui-build]
shell = "bash -e -o pipefail -c"
description = "Build the terminal client, rust/target/release/graphite-meter-client"
run = '''
version=$(scripts/build-version.sh)
python3 -m scripts.build --package graphite-meter-client --profile release --version "$version"
'''

# The pinned builder of container/Dockerfile needs an amd64 host; it cross-compiles arm64.
[tasks.container-build]
description = "Build the server image with Docker or Podman on an amd64 host (PROFILE=ci skips LTO and PGO)"
usage = 'arg "[tag]" default="graphite-meter:latest"'
run = '''
#!/usr/bin/env sh
set -eu
engine=${CONTAINER_ENGINE:-$(command -v docker || command -v podman || echo docker)}
revision=${GM_CLIENT_REVISION:-$(git rev-parse --short HEAD 2>/dev/null || echo source)}
# One VERSION stamps the server, the browser app and SOURCE.txt.
"$engine" build -f container/Dockerfile --target server -t "$usage_tag" --build-arg PROFILE="${PROFILE:-release}" \
  --build-arg VERSION="${VERSION:-0.0.0-dev}" --build-arg GM_CLIENT_REVISION="$revision" \
  --build-arg GM_CLIENT_VALIDATE="${GM_CLIENT_VALIDATE:-1}" --label org.opencontainers.image.licenses=AGPL-3.0-or-later .
'''

[tasks.container-smoke]
description = "Build and smoke-test the local image"
env = { VERSION = "0.0.0-ci", GM_CLIENT_REVISION = "local" }
run = [
  { task = "container-build", args = ["graphite-meter:smoke"] },
  "scripts/verify-container.sh graphite-meter:smoke",
]

[tasks.tui-package]
description = "Build the terminal client archives and their source offers in the pinned builder (PROFILE=ci skips LTO and PGO, TUI_PLATFORM builds one)"
usage = 'arg "[version]" default="development"'
run = '''
#!/usr/bin/env sh
set -eu
engine=${CONTAINER_ENGINE:-$(command -v docker || command -v podman || echo docker)}
"$engine" build -f container/Dockerfile --target tui-artifacts --build-arg VERSION="$usage_version" \
  --build-arg PROFILE="${PROFILE:-release}" --build-arg TUI_PLATFORM="${TUI_PLATFORM:-}" \
  --output "type=local,dest=${RELEASE_DIST:-dist}" .
'''

[tasks.e2e-server]
description = "Build rust/target/ci/graphite-meter-server with the production browser app for the browser suite"
run = "python3 -m scripts.build --package graphite-meter-server --profile ci --browser prod"

[tasks.e2e]
shell = "bash -e -o pipefail -c"
description = "Run the browser suite against one local server fleet (GM_E2E_BROWSER=chrome|firefox)"
usage = '''
arg "[server]" default="rust/target/ci/graphite-meter-server" help="The server executable; mise run e2e-server builds the default"
arg "[group]" default="all" help="all; reversals or heavy: halves of performance.test.ts; rest-1 or rest-2: halves of the other files; network, or network-1 to network-3: shaped links and faults"
'''
run = '''
export GM_E2E_SERVER_BIN=$(realpath "$usage_server")
# The surface reversals run serially under CPU throttling, so performance.test.ts splits by test name; the other
# files split into two shards of equal time by e2e/timings.json, which --update-timings refreshes.
reversals='rapid surface reversals release resources at (1600|390)px'
case "$usage_group" in
  all|network) set -- ;;
  network-[123]) set -- "--shard=${usage_group#network-}/3" --timings=e2e/timings.json ;;
  reversals) set -- bun test ./e2e/performance.test.ts --no-orphans --timeout=60000 -t "$reversals" ;;
  heavy) set -- bun test ./e2e/performance.test.ts --no-orphans --timeout=60000 -t "^(?!$reversals)" ;;
  rest-[12]) set -- bun test ./e2e --parallel=3 --no-orphans --timeout=60000 '--path-ignore-patterns=**/performance.test.ts' \
    '--path-ignore-patterns=**/network/**' "--shard=${usage_group#rest-}/2" --timings=e2e/timings.json ;;
  *) echo "group must be all, reversals, heavy, rest-1, rest-2 or network[-1 to -3]" >&2; exit 2 ;;
esac
cd client
if [[ $usage_group != network* ]]; then bun run e2e "$@"; fi
# The network scenarios own loopback's queues, one test at a time, in a private network namespace; CI runners refuse
# users one, so there GM_E2E_HOST_LOOPBACK lends them the throwaway machine's own loopback through sudo.
if [[ $usage_group == all || $usage_group == network* ]]; then
  export GM_E2E_NETWORK=1
  loopback='ip link set lo up mtu 1500; ethtool -K lo tso off gso off gro off'
  network=(bun run e2e bun test ./e2e/network --no-orphans --timeout=600000 "$@")
  if [[ -n ${GM_E2E_HOST_LOOPBACK:-} ]]; then
    sudo -n bash -ec "$loopback"
    "${network[@]}"
  else
    unshare -rn bash -ec "$loopback; exec \"\$@\"" network "${network[@]}"
  fi
fi
'''

[tasks.screenshots]
shell = "bash -e -o pipefail -c"
depends = ["e2e-server"]
description = "Render the README screenshots from the working tree, stamped with a release (the latest tag by default)"
usage = 'arg "[version]" help="The release the images show, such as v0.13.0"'
run = '''
tag=${usage_version:-$(git describe --tags --abbrev=0)}
version=$(VERSION=${tag#v} scripts/build-version.sh)
mkdir -p rust/target/screenshots
cells=$PWD/rust/target/screenshots/terminal.json
(cd rust && GM_ENGINE_VERSION=$version cargo run -q --locked --profile ci -p graphite-meter-client --example screenshot >"$cells")
export GM_E2E_SERVER_BIN=$PWD/rust/target/ci/graphite-meter-server GM_SCREENSHOT_VERSION=$version GM_SCREENSHOT_TERMINAL=$cells
export BUN_CHROME_ARGS="${BUN_CHROME_ARGS:-} --force-color-profile=srgb"
(cd client && bun run e2e bun scripts/screenshots/capture.ts)
python3 scripts/ci/screenshots.py stamp "$tag"
'''

[tasks.bench-ui]
shell = "bash -e -o pipefail -c"
depends = ["e2e-server"]
description = "Measure UI frame delivery against the local server fleet (manual)"
run = '''
export GM_E2E_SERVER_BIN=$PWD/rust/target/ci/graphite-meter-server
cd client && bun run e2e bun test ./bench/ui.bench.ts --no-orphans --timeout=600000
'''

[tasks.bench-session]
shell = "bash -e -o pipefail -c"
depends = ["e2e-server"]
description = "Measure retained browser resources across repeated tests (manual)"
run = '''
export GM_E2E_SERVER_BIN=$PWD/rust/target/ci/graphite-meter-server
cd client && bun run e2e bun test ./bench/session.bench.ts --no-orphans --timeout=600000
'''

[tasks.codeql]
description = "Reproduce the CodeQL scan offline with the pinned CLI and count results per rule (manual)"
env = { GM_CODEQL_VERSION = "{{vars.codeql}}" }
run = "scripts/codeql.sh"

[tasks.ci]
description = "Run the gates CI runs (needs the cross compilers of rust-check-targets and a browser)"
run = [
  { task = "check" },
  { task = "secret-scan-ci" },
  { task = "rust-check-targets" },
  { task = "delayed-downloads" },
  { task = "e2e-server" },
  { task = "e2e" },
]
