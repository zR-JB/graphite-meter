[package]
name = "graphite-meter-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64.workspace = true
sha2 = "0.11.0"
socket2 = "0.6.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# quic-go's forced UDP buffer sizes; crossterm and the server already link rustix.
# Its socket options need the timespec module, which "time" enables.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["net", "std", "time"] }
