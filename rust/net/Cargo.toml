[package]
name = "graphite-meter-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
graphite-meter-core = { path = "../core" }
base64 = "0.22.1"
http = "1"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ipnet = "2.12.2"
percent-encoding = "2.3.2"
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "0.7.0"
tokio = { version = "1.53.1", features = ["net", "time", "rt", "macros", "io-util"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
