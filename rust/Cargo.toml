[workspace]
members = ["core", "server", "client", "net", "webtransport"]
resolver = "3"

[workspace.package]
version = "0.8.6"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
h3 = { git = "https://github.com/zR-JB/h3", rev = "cc8145161aa75bf3c7f5505da526579d79438757" }
noq = { git = "https://github.com/zR-JB/noq", rev = "e87d1c05c860f0d8e3c39cb98cb87fd27545ce96" }
