[workspace]
members = ["proto", "net", "http3", "server", "client", "legal", "testkit", "e2e"]
resolver = "3"

# Shipped platforms, their Rust targets and the platform record, read through scripts/ci/workspace.py.
[workspace.metadata.graphite-meter]
tui = ["linux/amd64", "linux/arm64", "windows/amd64", "windows/arm64"]
server = ["linux/amd64", "linux/arm64"]
platform-record = "legal/rust-platform-debian-trixie.json"

[workspace.metadata.graphite-meter.targets]
"linux/amd64" = "x86_64-unknown-linux-musl"
"linux/arm64" = "aarch64-unknown-linux-musl"
"windows/amd64" = "x86_64-pc-windows-gnu"
"windows/arm64" = "aarch64-pc-windows-gnullvm"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
graphite-meter-proto = { path = "proto" }
graphite-meter-net = { path = "net" }
graphite-meter-http3 = { path = "http3" }
graphite-meter-server = { path = "server" }
graphite-meter-client = { path = "client" }
graphite-meter-legal = { path = "legal" }
graphite-meter-testkit = { path = "testkit" }

argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1.12.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
h2 = "0.4.20"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["tokio"] }
ipnet = "2.12.2"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
nix = { version = "0.31.3", default-features = false, features = ["socket"] }
noq = { version = "1.3.0", default-features = false }
percent-encoding = "2.3.2"
ratatui-core = { version = "0.1.2", features = ["std"] }
ratatui-crossterm = { version = "0.1.2", default-features = false, features = ["crossterm_0_29"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17.14"
rustfs-mimalloc = "=0.5.6"
rustix = { version = "1.1.5", default-features = false, features = ["std"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
tokio = { version = "1.53.3", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.20", default-features = false }
unicode-width = "0.2.2"
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false }
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"

# Unoptimized, one Argon2id hash at the server's cost takes most of a second, and the tests hash many.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[patch.crates-io]
h2 = { git = "https://github.com/zR-JB/h2", rev = "7a7c2527475965cfd4da2130ef4bf5fe361f6431" }
noq = { git = "https://github.com/zR-JB/noq", rev = "2aba4e49f5c73f43ed23c40677ec96508842aa3c" }
