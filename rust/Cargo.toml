[workspace]
members = ["core", "server", "client", "net"]
resolver = "3"
exclude = ["vendor/h3", "vendor/h3-noq", "vendor/noq-proto"]

[workspace.package]
version = "0.8.6"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
h3 = { path = "vendor/h3" }

[patch."https://github.com/n0-computer/noq"]
noq-proto = { path = "vendor/noq-proto" }
