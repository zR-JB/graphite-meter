[workspace]
members = ["core", "server", "client", "net", "webtransport"]
resolver = "3"

[workspace.package]
version = "0.8.6"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
h3-noq = { git = "https://github.com/zR-JB/h3", rev = "dc10d4813114da2c200c86322ed18753fa45055d" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
h3 = { git = "https://github.com/zR-JB/h3", rev = "dc10d4813114da2c200c86322ed18753fa45055d" }
noq = { git = "https://github.com/zR-JB/noq", rev = "0ae9fe96258162ed58a6405a7affc745fcd22acb" }
