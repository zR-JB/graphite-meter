[workspace]
members = ["core", "server", "client", "net", "webtransport"]
resolver = "3"

[workspace.package]
version = "0.8.6"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
h3-noq = { git = "https://github.com/zR-JB/h3", rev = "03874beb50d065f4ac8f946ddb7814d2432b7527" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
h2 = { git = "https://github.com/zR-JB/h2", rev = "b3b4a42caaf168c121c3edd1981f59ccf9f264a3" }
h3 = { git = "https://github.com/zR-JB/h3", rev = "03874beb50d065f4ac8f946ddb7814d2432b7527" }
noq = { git = "https://github.com/zR-JB/noq", rev = "b9855303b1c6662be2e790cc93013238f77e1db9" }
