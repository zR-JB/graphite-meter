<!doctype html>
<html lang="en">
  <head>
    {% include "auth-head.html" %}
    <meta http-equiv="refresh" content="0; url={{ self.destination() }}">
    <title>Signing in · Graphite Meter</title>
    {% include "auth-theme.html" %}
  </head>
  <body>
    <main class="card completion">
      {% if !opening %}<svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path class="hex" d="M12 2.6 3.9 7.3v9.4l8.1 4.7 8.1-4.7V7.3Z" fill="none" stroke-width="2"/><path d="m8.2 12.3 2.4 2.4 5.3-5.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>{% endif %}
      <h1>{% if opening %}Continue sign-in{% else %}Signed in{% endif %}</h1>
      <p>Taking you to Graphite Meter…</p>
      <p><a href="{{ self.destination() }}">Continue</a></p>
    </main>
  </body>
</html>
