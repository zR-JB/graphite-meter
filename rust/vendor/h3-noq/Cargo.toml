[package]
edition = "2021"
rust-version = "1.70"
name = "h3-noq"
version = "0.0.10"
authors = ["Jean-Christophe BEGUE <jc.begue@pm.me>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Local HTTP/3 transport adapter for Noq, derived from h3-quinn."
documentation = "https://docs.rs/h3-quinn"
readme = "README.md"
categories = [
    "network-programming",
    "web-programming",
]
license = "MIT"
repository = "https://github.com/hyperium/h3"

[features]
datagram = ["dep:h3-datagram"]
tracing = ["dep:tracing"]

[lib]
name = "h3_noq"
path = "src/lib.rs"

[dependencies.bytes]
version = "1"

[dependencies.futures]
version = "0.3.28"

[dependencies.h3]
version = "0.0.8"

[dependencies.h3-datagram]
version = "0.0.2"
optional = true

[dependencies.quinn]
package = "noq"
git = "https://github.com/n0-computer/noq"
rev = "ca4b44552c6df355906f45c58e992ddbb7986bbb"
features = ["futures-io"]
default-features = false

[dependencies.tokio]
version = "1"
features = ["io-util", "sync"]
default-features = false

[dependencies.tokio-util]
version = "0.7.9"

[dependencies.tracing]
version = "0.1.40"
optional = true
