# Standalone manifest normalized from Noq ca4b44552c6df355906f45c58e992ddbb7986bbb.
[package]
name = "noq-proto"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0-computer/noq"
description = "State machine for the QUIC transport protocol"
keywords = ["quic"]
categories = ["network-programming", "asynchronous"]

[features]
# NOTE: Please keep this in sync with the feature list in `.github/workflows/codecov.yml`, see
# comment in that file for more information.
default = ["rustls", "ring", "tracing-log", "bloom"]
arbitrary = ["dep:arbitrary"]
# Enables conveniences like `EndpointConfig::default`, and together with
# enabling the `rustls` feature, this also enables the `aws-lc-rs` crypto provider
# for the rustls TLS backend, making `Endpoint::client` and `Endpoint::server` available,
# except when compiling to Wasm.
# If both `aws-lc-rs` and `ring` are enabled, `ring` will actually be used.
aws-lc-rs = ["dep:aws-lc-rs", "aws-lc-rs?/aws-lc-sys", "aws-lc-rs?/prebuilt-nasm", "rustls?/aws-lc-rs"] # TODO: Once released, we'll want to depend on the rustls-aws-lc-rs crate instead of rustls' aws-lc-rs feature.
aws-lc-rs-fips = ["aws-lc-rs", "aws-lc-rs?/fips"]
# Enables conveniences like `EndpointConfig::default`, and together with
# enabling the `rustls` feature, this also enables the `ring` crypto provider
# for the rustls TLS backend, making `Endpoint::client` and `Endpoint::server` available,
# except when compiling to Wasm.
# If both `aws-lc-rs` and `ring` are enabled, `ring` will actually be used.
ring = ["dep:ring", "rustls?/ring"] # TODO: Once released, we'll want to depend on the rustls-ring crate instead of rustls' ring feature.
# Enables BloomTokenLog, and uses it by default
bloom = ["dep:fastbloom"]
# Enables rustls as the TLS implementation backend
rustls = ["dep:rustls", "dep:aes-gcm"]
# Provides `ClientConfig::with_platform_verifier()` convenience method
platform-verifier = ["dep:rustls-platform-verifier"]
# Configure `tracing` to log events via `log` if no `tracing` subscriber exists.
tracing-log = ["tracing/log"]
# Enable rustls logging
rustls-log = ["rustls?/logging"]
# Enable qlog support
qlog = ["dep:qlog"]
bench = ["dep:criterion"]

# Backwards-compatibility features
rustls-ring = ["rustls", "ring"]
rustls-aws-lc-rs = ["rustls", "aws-lc-rs"]

# Internal (PRIVATE!) features used to aid testing.
# Don't rely on these whatsoever. They may disappear at any time.

__rustls-post-quantum-test =  []
__all_without_fips = ["arbitrary", "aws-lc-rs", "rustls", "ring", "platform-verifier", "rustls-log", "qlog", "bench", "bloom", "tracing-log"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"], optional = true }
arbitrary = { version = "1.0.1", features = ["derive"], optional = true }
aws-lc-rs = { version = "1.9", default-features = false, optional = true }
bytes = { version = "1" }
criterion = { version = "0.7", default-features = false, features = ["async_tokio"], optional = true }
derive_more = { version = "2.1.0", features = ["debug", "deref", "deref_mut", "display", "from", "add", "add_assign"] }
enum-assoc = { version = "1.3.0" }
fastbloom = { version = "0.17", default-features = false, optional = true }
identity-hash = { version = "0.1.0" }
lru-slab = { version = "0.1.2" }
qlog = { package = "n0-qlog", version = "0.1.0", optional = true }
rand = { version = "0.10" }
rand_pcg = "0.10"
ring = { version = "0.17", optional = true }
rustc-hash = { version = "2" }
rustls = { version = "0.23.33", default-features = false, features = ["std"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
slab = { version = "0.4.9" }
sorted-index-buffer = { version = "0.2.0" }
thiserror = { version = "2.0.3" }
tinyvec = { version = "1.10", features = ["alloc"] }
tracing = { version = "0.1.10", default-features = false, features = ["std"] }

# Feature flags & dependencies for wasm
# wasm-bindgen is assumed for a wasm*-*-unknown target
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
ring = { version = "0.17", optional = true, features = ["wasm32_unknown_unknown_js"] }
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
rustls-pki-types = { version = "1.7", features = ["web"] } # only added as dependency to enforce the `web` feature for this target
web-time = { version = "1" }

[dev-dependencies]
assert_matches = { version = "1.1" }
hex-literal = { version = "0.4" }
proptest = { version = "1.9.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14" }
test-strategy = { version = "0.4.3" }
testresult = "0.4.1"
tracing-subscriber = { version = "0.3.1", default-features = false, features = ["env-filter", "fmt", "ansi", "time", "local-time"] }
wasm-bindgen-test = { version = "0.3.45" }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
# ensure we set the wasm_js feature even for the older version of getrandom used in proptest in Wasm
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[[bench]]
name = "send_buffer"
harness = false
required-features = ["bench"]

[lints.rust]
elided_lifetimes_in_paths = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
unnameable_types = "warn"
unreachable_pub = "warn"
[lints.clippy]
manual_let_else = "warn"
or_fun_call = "warn"
use_self = "warn"

[package.metadata.docs.rs]
# all non-default features except fips (cannot build on docs.rs environment)
features = ["__all_without_fips"]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "arbitrary::Arbitrary", # gated behind `arbitrary` feature
    "criterion::Criterion", # gated behind `bench` feature
    "bytes::*",
    "rustls",
    "rustls::*",
    "rustls_pki_types::*",
]
