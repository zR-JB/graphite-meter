[package]
name = "graphite-meter-http3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["io"]
# The fuzz harness builds the codec without it.
io = ["dep:noq", "dep:tokio"]

[dependencies]
bytes = "1"
http = "1"
noq = { version = "1.3.0", default-features = false, optional = true }
tokio = { version = "1.53.1", default-features = false, features = ["sync", "time"], optional = true }

[dev-dependencies]
noq = { version = "1.3.0", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "signal", "test-util"] }
