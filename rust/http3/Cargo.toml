[package]
name = "graphite-meter-http3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1"
http = "1"
noq = { version = "1.3.0", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "sync", "time"] }

[dev-dependencies]
noq = { version = "1.3.0", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "signal", "test-util"] }
