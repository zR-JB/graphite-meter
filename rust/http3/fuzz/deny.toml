# The harness never ships; libFuzzer's runtime adds the NCSA license.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "NCSA", "AGPL-3.0-or-later"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
