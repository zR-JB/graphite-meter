# Development-only libFuzzer harness; it has its own lock and never ships.
[package]
name = "graphite-meter-http3-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
graphite-meter-http3 = { path = "..", default-features = false }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings"
path = "fuzz_targets/settings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qpack"
path = "fuzz_targets/qpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "huffman"
path = "fuzz_targets/huffman.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capsule"
path = "fuzz_targets/capsule.rs"
test = false
doc = false
bench = false

[[bin]]
name = "webtransport_ids"
path = "fuzz_targets/webtransport_ids.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_stream"
path = "fuzz_targets/request_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control"
path = "fuzz_targets/control.rs"
test = false
doc = false
bench = false

[workspace]
