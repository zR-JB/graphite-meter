[package]
name = "graphite-meter-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
graphite-meter-core = { path = "../core" }
graphite-meter-http3 = { path = "../http3" }
graphite-meter-net = { path = "../net" }
form_urlencoded = "1.2.2"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
rustls-platform-verifier = "0.7.0"
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time", "sync", "process"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
getrandom = "0.4.3"
http = "1"
httpdate = "1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64.workspace = true
miniz_oxide.workspace = true
zeroize = "1.9.0"
unicode-width = "0.2.2"
quinn = { package = "noq", version = "1.3.0", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

[target.'cfg(target_env = "musl")'.dependencies]
dlmalloc = { version = "0.2.14", features = ["global"] }

[build-dependencies]
miniz_oxide.workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
