[package]
name = "graphite-meter-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
graphite-meter-core = { path = "../core" }
graphite-meter-net = { path = "../net" }
form_urlencoded = "1.2.2"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
rustls-platform-verifier = "0.7.0"
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time", "sync", "process"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
getrandom = "0.4.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
sha2 = "0.11.0"
zeroize = "1.9.0"
unicode-width = "0.2.2"
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-noq = { path = "../vendor/h3-noq" }
quinn = { package = "noq", git = "https://github.com/n0-computer/noq", rev = "ca4b44552c6df355906f45c58e992ddbb7986bbb", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

[build-dependencies]
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
