<!doctype html>
<meta charset="utf-8" />
<title>Hero</title>
<style>
  @font-face {
    font-family: Plex;
    src: url("client/public/fonts/ibm-plex-sans-var-latin1.woff2");
    font-weight: 100 700;
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    position: relative;
    width: 2400px;
    height: 1400px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 70% at 30% 20%, oklch(0.27 0.03 200 / 0.55), transparent 70%),
      radial-gradient(ellipse 45% 55% at 86% 78%, oklch(0.26 0.025 250 / 0.5), transparent 70%),
      oklch(0.15 0.008 258);
    font-family: Plex, system-ui, sans-serif;
  }
  /* The laptop: a lid with a slim bezel and a camera, a hinge, and a base a little wider than the lid. */
  .laptop {
    position: absolute;
    left: 130px;
    top: 190px;
    width: 1596px;
  }
  .lid {
    padding: 18px 18px 22px;
    border-radius: 30px 30px 10px 10px;
    background: linear-gradient(180deg, #1b1f23, #121518);
    box-shadow:
      inset 0 0 0 1.5px #3a4147,
      inset 0 0 0 4px #0b0d0f,
      0 40px 90px -30px #000c;
  }
  .lid .camera {
    position: absolute;
    left: 50%;
    top: 7px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #3b4a55, #0b0f12);
    translate: -50% 0;
  }
  .lid img {
    display: block;
    width: 1560px;
    height: 975px;
    border-radius: 12px;
  }
  .hinge {
    height: 10px;
    margin: 0 40px;
    background: linear-gradient(180deg, #0a0c0e, #23282d);
  }
  .base {
    position: relative;
    height: 26px;
    margin: 0 -60px;
    border-radius: 2px 2px 26px 26px / 2px 2px 18px 18px;
    background: linear-gradient(180deg, #4a535b 0%, #2f363c 35%, #1d2226 100%);
    box-shadow:
      inset 0 1px 0 #6a747c,
      0 30px 60px -20px #000d;
  }
  .base::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 260px;
    height: 9px;
    border-radius: 0 0 12px 12px;
    background: linear-gradient(180deg, #1c2125, #2a3136);
    translate: -50% 0;
  }
  /* The phone: a titanium edge, side keys, and a display with the status bar, the island and the home indicator. */
  .phone {
    position: absolute;
    right: 80px;
    bottom: 159px;
    width: 520px;
    height: 1103px;
    padding: 14px;
    border-radius: 78px;
    background: linear-gradient(135deg, #5b646b, #2a3035 45%, #4b545b);
    box-shadow:
      inset 0 0 0 2px #7d878e,
      inset 0 0 0 5px #15191c,
      0 50px 90px -30px #000d;
  }
  .key {
    position: absolute;
    width: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #6b747b, #3b4247);
  }
  .key.action { left: -5px; top: 190px; height: 58px; }
  .key.up { left: -5px; top: 290px; height: 98px; }
  .key.down { left: -5px; top: 405px; height: 98px; }
  .key.power { right: -5px; top: 330px; height: 150px; }
  .screen {
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100%;
    overflow: hidden;
    border-radius: 64px;
    background: var(--canvas);
  }
  .status {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 69px;
    padding: 10px 46px 0 58px;
    color: #f2f4f6;
  }
  .status .time {
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.2px;
  }
  .status .icons {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .island {
    position: absolute;
    left: 50%;
    top: 13px;
    width: 148px;
    height: 43px;
    border-radius: 22px;
    background: #000;
    translate: -50% 0;
  }
  .screen img.page {
    display: block;
    width: 492px;
  }
  .home {
    position: relative;
    height: 39px;
  }
  .home::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 9px;
    width: 157px;
    height: 6px;
    border-radius: 3px;
    background: #e9ecef;
    translate: -50% 0;
  }
</style>
<div class="laptop">
  <div class="lid">
    <span class="camera"></span>
    <img src="out/hero-desktop.png" alt="" />
  </div>
  <div class="hinge"></div>
  <div class="base"></div>
</div>
<div class="phone">
  <span class="key action"></span><span class="key up"></span><span class="key down"></span><span class="key power"></span>
  <div class="screen">
    <div class="status">
      <span class="time">9:41</span>
      <span class="island"></span>
      <span class="icons">
        <svg width="20" height="13" viewBox="0 0 20 13" fill="#f2f4f6">
          <rect x="0" y="9" width="3.4" height="4" rx="1" />
          <rect x="5.4" y="6.5" width="3.4" height="6.5" rx="1" />
          <rect x="10.8" y="3.5" width="3.4" height="9.5" rx="1" />
          <rect x="16.2" y="0.5" width="3.4" height="12.5" rx="1" />
        </svg>
        <svg width="18" height="13" viewBox="0 0 18 13" fill="#f2f4f6">
          <path d="M9 12.6 6.6 10a3.4 3.4 0 0 1 4.8 0z" />
          <path d="M9 6.2a6.8 6.8 0 0 1 4.8 2l-1.6 1.6a4.6 4.6 0 0 0-6.4 0L4.2 8.2a6.8 6.8 0 0 1 4.8-2z" />
          <path d="M9 1.4a11.6 11.6 0 0 1 8.2 3.4l-1.6 1.6a9.4 9.4 0 0 0-13.2 0L.8 4.8A11.6 11.6 0 0 1 9 1.4z" />
        </svg>
        <svg width="29" height="13" viewBox="0 0 29 13">
          <rect x="0.6" y="0.6" width="24.4" height="11.8" rx="3.6" fill="none" stroke="#f2f4f6" stroke-opacity=".45" stroke-width="1.2" />
          <rect x="2.4" y="2.4" width="18.6" height="8.2" rx="2.2" fill="#f2f4f6" />
          <path d="M26.6 4.4v4.2a2.2 2.2 0 0 0 0-4.2z" fill="#f2f4f6" fill-opacity=".45" />
        </svg>
      </span>
    </div>
    <img class="page" src="out/mobile.png" alt="" />
    <div class="home"></div>
  </div>
</div>
<script>
  // The screen's ground is the page's own top colour, read from the capture.
  const page = document.querySelector("img.page");
  page.decode().then(() => {
    const c = document.createElement("canvas");
    c.width = 4;
    c.height = 4;
    const g = c.getContext("2d");
    g.drawImage(page, 0, 0, 4, 4, 0, 0, 4, 4);
    const [r, gr, b] = g.getImageData(1, 1, 1, 1).data;
    document.querySelector(".screen").style.setProperty("--canvas", `rgb(${r} ${gr} ${b})`);
    document.body.dataset.ready = "1";
  });
</script>
