<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Graphite Meter — open-source network speed test"
    />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-var-latin1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-mono-500-latin1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Pre-paint canvas + theme. This MUST live inline in <head>:
         the real colors live in app.css, which is imported from the JS
         bundle and so only applies AFTER the module graph loads. The browser
         paints the empty <body> before then, white without this.
         Keep the light-dark() literals in sync with src/app.css. -->
    <style>
      :root {
        color-scheme: light dark;
        background: light-dark(
          oklch(0.962 0.004 258),
          oklch(0.17 0.008 258)
        ); /* --canvas */
        color: light-dark(
          oklch(0.22 0.012 258),
          oklch(0.955 0.004 258)
        ); /* --text */
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      .noscript-shell {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }
      .noscript-panel {
        box-sizing: border-box;
        width: min(100%, 520px);
        border: 1px solid
          light-dark(oklch(0.3 0.02 255 / 0.14), oklch(0.92 0.02 255 / 0.11));
        border-radius: 8px;
        background: light-dark(oklch(0.995 0.002 255), oklch(0.232 0.011 255));
        box-shadow: 0 10px 28px
          light-dark(oklch(0.25 0.02 255 / 0.08), oklch(0.05 0.01 255 / 0.4));
        padding: 24px;
      }
      .noscript-kicker {
        margin: 0 0 10px;
        color: light-dark(oklch(0.52 0.078 205), oklch(0.8 0.092 205));
        font:
          600 12px/1.2 "IBM Plex Mono",
          "SFMono-Regular",
          Consolas,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .noscript-panel h1 {
        margin: 0 0 12px;
        font:
          600 28px/1.05 "IBM Plex Sans",
          system-ui,
          sans-serif;
      }
      .noscript-panel p {
        margin: 0;
        color: light-dark(oklch(0.4 0.014 255), oklch(0.79 0.012 255));
        font-size: 15px;
        line-height: 1.55;
      }
    </style>
    <script>
      /* Pick the saved theme before first paint; the store owns it afterwards.
         Storage key: graphite-meter:v1 (see persistence.ts). */
      try {
        var raw = localStorage.getItem("graphite-meter:v1");
        var saved = raw ? JSON.parse(raw).theme : null;
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        /* corrupt/blocked storage → leave the dark default */
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#111418"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f0f3f6"
    />
    <title>The Graphite Meter</title>
  </head>
  <body>
    <div id="app">
      <noscript>
        <main class="noscript-shell" aria-labelledby="noscript-title">
          <section class="noscript-panel">
            <p class="noscript-kicker">The Graphite Meter</p>
            <h1 id="noscript-title">JavaScript is required</h1>
            <p>
              This speed test runs in your browser and needs JavaScript to
              measure latency, download, and upload performance. Enable
              JavaScript, then reload this page.
            </p>
          </section>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
