<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Graphite Meter — open-source network speed test" />
    <meta name="color-scheme" content="dark light" />
    <!-- Pre-paint canvas + theme (§14.1). This MUST live inline in <head>:
         the real colors live in app.css, which is imported from the JS
         bundle and so only applies AFTER the module graph loads. The browser
         paints the empty <body> before then — without this it paints white.
         Keep the hexes in sync with --canvas in src/app.css (dark/light). -->
    <style>
      :root { color-scheme: dark; }
      html { background: #0b0a10; }            /* --canvas (dark) */
      html[data-theme="light"] { color-scheme: light; background: #e7e5f1; } /* --canvas (light) */
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0a10;
        color: #ecebf3;
        font-family: "IBM Plex Sans", "Inter", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      html[data-theme="light"] body {
        background: #e7e5f1;
        color: #221d30;
      }
      .noscript-shell {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }
      .noscript-panel {
        box-sizing: border-box;
        width: min(100%, 520px);
        border: 1px solid rgba(196, 186, 232, 0.14);
        border-radius: 8px;
        background: #15131d;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.32), 0 12px 34px rgba(7, 5, 16, 0.46);
        padding: 24px;
      }
      .noscript-kicker {
        margin: 0 0 10px;
        color: #b6a6e6;
        font: 600 12px/1.2 "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .noscript-panel h1 {
        margin: 0 0 12px;
        font: 600 28px/1.05 "Space Grotesk", "Inter", system-ui, sans-serif;
      }
      .noscript-panel p {
        margin: 0;
        color: #a8a2bb;
        font-size: 15px;
        line-height: 1.55;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) {
          color-scheme: light;
          background: #e7e5f1;
        }
        html:not([data-theme]) body {
          background: #e7e5f1;
          color: #221d30;
        }
        html:not([data-theme]) .noscript-panel {
          border-color: rgba(58, 48, 90, 0.12);
          background: #f6f5fc;
          box-shadow: 0 1px 1px rgba(46, 36, 80, 0.07), 0 10px 32px rgba(46, 36, 80, 0.1);
        }
        html:not([data-theme]) .noscript-kicker {
          color: #6d5bb0;
        }
        html:not([data-theme]) .noscript-panel p {
          color: #5d5773;
        }
      }
    </style>
    <script>
      /* Pick the saved theme before first paint — mirrors applyThemePrePaint()
         in src/main.ts, but runs ahead of the bundle so the very first frame
         is correct. Storage key: graphite-meter:v1 (see persistence.ts). */
      try {
        var raw = localStorage.getItem("graphite-meter:v1");
        var saved = raw ? JSON.parse(raw).theme : null;
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        /* corrupt/blocked storage → leave the dark default */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>The Graphite Meter</title>
  </head>
  <body>
    <div id="app">
      <noscript>
        <main class="noscript-shell" aria-labelledby="noscript-title">
          <section class="noscript-panel">
            <p class="noscript-kicker">The Graphite Meter</p>
            <h1 id="noscript-title">JavaScript is required</h1>
            <p>
              This speed test runs in your browser and needs JavaScript to measure
              latency, download, and upload performance. Enable JavaScript, then
              reload this page.
            </p>
          </section>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
