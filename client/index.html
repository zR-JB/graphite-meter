<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Graphite Meter: open-source network speed test" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" data-scheme="dark" media="(prefers-color-scheme: dark)" content="#0d1013" />
    <meta name="theme-color" data-scheme="light" media="(prefers-color-scheme: light)" content="#f1f2f5" />
    <!-- The servers require Trusted Types under the policy this names (src/lib/trusted.ts). -->
    <meta name="graphite-meter-trusted-types" content="graphite-meter" />
    <link rel="preload" href="/fonts/ibm-plex-sans-var-latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-500-latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Graphite Meter</title>
    <!-- The stylesheet loads before the first paint, so the no-JavaScript card uses its tokens. -->
    <style>
      .noscript-shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: var(--space-5);
      }
      .noscript-panel {
        display: grid;
        gap: var(--space-3);
        width: min(100%, 520px);
        padding: var(--space-5);
        color: var(--text-muted);
        font: var(--role-row);
      }
      .noscript-panel h1 {
        color: var(--text);
        font: var(--role-panel-title);
      }
    </style>
    <!-- theme -->
    <!-- bundle -->
  </head>
  <body>
    <div id="app">
      <noscript>
        <main class="noscript-shell" aria-labelledby="noscript-title">
          <section class="panel noscript-panel">
            <p class="caps">Graphite Meter</p>
            <h1 id="noscript-title">JavaScript is required</h1>
            <p>
              This speed test runs in your browser and needs JavaScript to measure latency, download and upload
              performance. Enable JavaScript, then reload this page.
            </p>
          </section>
        </main>
      </noscript>
    </div>
  </body>
</html>
