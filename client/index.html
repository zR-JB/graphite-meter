<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Graphite Meter — open-source network speed test"
    />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/spline-sans-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Pre-paint canvas + theme. This MUST live inline in <head>:
         the real colors live in app.css, which is imported from the JS
         bundle and so only applies AFTER the module graph loads. The browser
         paints the empty <body> before then — without this it paints white.
         Keep the hexes in sync with --canvas in src/app.css (dark/light). -->
    <style>
      :root {
        color-scheme: dark;
      }
      html {
        background: #131518;
      } /* --canvas (dark) */
      html[data-theme="light"] {
        color-scheme: light;
        background: #e9e9e4;
      } /* --canvas (light) */
      body {
        margin: 0;
        min-height: 100vh;
        background: #131518;
        color: #d9dce0;
        font-family:
          "Instrument Sans", "Inter", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      html[data-theme="light"] body {
        background: #e9e9e4;
        color: #26272a;
      }
      .noscript-shell {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }
      .noscript-panel {
        box-sizing: border-box;
        width: min(100%, 520px);
        border: 1px solid rgba(211, 219, 227, 0.14);
        border-radius: 6px;
        background: #1c1f23;
        box-shadow:
          0 1px 1px rgba(0, 0, 0, 0.3),
          0 10px 28px rgba(5, 7, 9, 0.4);
        padding: 24px;
      }
      .noscript-kicker {
        margin: 0 0 10px;
        color: #6db0b8;
        font:
          600 12px/1.2 "Spline Sans Mono",
          "SFMono-Regular",
          Consolas,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .noscript-panel h1 {
        margin: 0 0 12px;
        font:
          600 28px/1.05 "Instrument Sans",
          "Inter",
          system-ui,
          sans-serif;
      }
      .noscript-panel p {
        margin: 0;
        color: #9ba2aa;
        font-size: 15px;
        line-height: 1.55;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) {
          color-scheme: light;
          background: #e9e9e4;
        }
        html:not([data-theme]) body {
          background: #e9e9e4;
          color: #26272a;
        }
        html:not([data-theme]) .noscript-panel {
          border-color: rgba(43, 44, 40, 0.13);
          background: #f6f5f1;
          box-shadow:
            0 1px 1px rgba(43, 44, 40, 0.06),
            0 8px 24px rgba(43, 44, 40, 0.08);
        }
        html:not([data-theme]) .noscript-kicker {
          color: #2f717a;
        }
        html:not([data-theme]) .noscript-panel p {
          color: #575c5f;
        }
      }
    </style>
    <script>
      /* Pick the saved theme before first paint — mirrors applyThemePrePaint()
         in src/main.ts, but runs ahead of the bundle so the very first frame
         is correct. Storage key: graphite-meter:v1 (see persistence.ts). */
      try {
        var raw = localStorage.getItem("graphite-meter:v1");
        var saved = raw ? JSON.parse(raw).theme : null;
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        /* corrupt/blocked storage → leave the dark default */
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#131518"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#e9e9e4"
    />
    <title>The Graphite Meter</title>
  </head>
  <body>
    <div id="app">
      <noscript>
        <main class="noscript-shell" aria-labelledby="noscript-title">
          <section class="noscript-panel">
            <p class="noscript-kicker">The Graphite Meter</p>
            <h1 id="noscript-title">JavaScript is required</h1>
            <p>
              This speed test runs in your browser and needs JavaScript to
              measure latency, download, and upload performance. Enable
              JavaScript, then reload this page.
            </p>
          </section>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
